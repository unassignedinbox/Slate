<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050706" />
    <title>Slate — Webgiya Surfel GI · ShaderBall Light Lab</title>
  </head>
  <body>
    <div id="app">
      <div id="loading-overlay" class="overlay" hidden>
        <div class="overlay-card">
          <div class="overlay-title">Loading…</div>
          <div id="loading-message" class="overlay-message">
            Preparing scene
          </div>
        </div>
      </div>
      <div id="error-overlay" class="overlay hidden" hidden>
        <div class="overlay-card">
          <div class="overlay-title">Something went wrong</div>
          <div id="error-message" class="overlay-message"></div>
        </div>
      </div>
    </div>
    <aside id="slate-note">
      <strong>WEBGIYA · SCREEN PROBES + MULTI-BOUNCE SURFELS</strong>
      <span
        >8×8 screen probes · BVH rays · persistent surfel cache · 1K shadows ·
        GTAO visibility</span
      >
    </aside>
    <style>
      html,
      body,
      #app {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        color: #e0e0e0;
      }
      #app {
        background: #000;
      }
      canvas {
        display: block;
      }
      #slate-note {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 1001;
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px 13px;
        border: 1px solid rgba(136, 225, 173, 0.28);
        border-radius: 7px;
        background: rgba(8, 12, 9, 0.78);
        backdrop-filter: blur(8px);
        pointer-events: none;
        text-align: left;
        font:
          10px/1.35 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.07em;
      }
      #slate-note strong {
        color: #88e1ad;
      }
      #slate-note span {
        color: rgba(235, 244, 237, 0.68);
        letter-spacing: 0.02em;
      }
    </style>
    <script type="module" src="/src/mainVisibility.ts"></script>
  </body>
</html>
