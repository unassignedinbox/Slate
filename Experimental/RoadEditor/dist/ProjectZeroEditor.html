<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ProjectZeroEditor — Road Editor</title>
<style>
/* ==================================================================================================
   Slate — Road Editor. ProjectZeroEditor house style: neutral charcoal, hairline borders, one
   accent, no gradients on controls, 13px type.
   ================================================================================================== */
:root {
  --bg: #101010;
  --panel: #161616;
  --panel-2: #1c1c1c;
  --line: #2a2a2a;
  --line-2: #333;
  --text: #dcdcdc;
  --dim: #8b8b8b;
  --dimmer: #6a6a6a;
  --accent: #7fb2ff;
  --good: #6fd08c;
  --warn: #e2b93b;
  --bad: #e2685a;
  --build: 13px;
  font-family: 'DM Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: var(--build);
  color: var(--text);
  background: var(--bg);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; transition: background .15s, color .15s, border-color .15s; }
button:hover { color: #fff; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

#app { display: grid; grid-template-rows: 46px 1fr 26px; height: 100vh; }

/* --- top bar ---------------------------------------------------------------------------------- */
.topbar { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 0 12px 0 14px; background: #141414; }
.brand { display: flex; align-items: center; gap: 9px; color: #c9c9c9; }
.brand svg { color: #9a9a9a; }
.brand-name { font-size: 15px; letter-spacing: -0.3px; }
.brand-sub { font-size: 12px; color: var(--dim); }
.version { font-size: 9px; letter-spacing: 1.2px; color: var(--dimmer); margin-left: 10px; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }
.ghost { border: 1px solid var(--line-2); border-radius: 6px; padding: 5px 10px; font-size: 11px; color: #c4c4c4; background: #1b1b1b; }
.ghost:hover { background: #232323; border-color: #444; }
.view-presets { display: flex; gap: 2px; margin-right: 8px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.view-presets button { padding: 5px 9px; font-size: 11px; color: var(--dim); background: #191919; }
.view-presets button.active { background: #262626; color: #eee; }

/* --- shell ------------------------------------------------------------------------------------ */
.shell { display: grid; grid-template-columns: 288px minmax(0, 1fr) 312px; min-height: 0; }
.panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.scroll { overflow-y: auto; overflow-x: hidden; padding: 10px 12px 26px; flex: 1; }
.scene-label { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px 2px; font-size: 9px; letter-spacing: 1.5px; color: var(--dimmer); }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line-2); }
.dot.on { background: var(--accent); }
.tabs { display: flex; gap: 2px; padding: 8px 10px 6px; border-bottom: 1px solid var(--line); }
.tabs button { font-size: 11px; padding: 5px 9px; border-radius: 5px; color: var(--dim); }
.tabs button.active { background: #242424; color: #e6e6e6; }

/* --- viewport ---------------------------------------------------------------------------------- */
.viewport { position: relative; min-width: 0; background: #0d0f12; }
#gl { display: block; width: 100%; height: 100%; cursor: crosshair; }
.hud { position: absolute; z-index: 5; font-size: 10.5px; color: #c8c8c8; pointer-events: none; }
.hud-tl { top: 10px; left: 12px; display: grid; gap: 3px; }
.hud-tr { top: 8px; right: 10px; display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; max-width: 60%; pointer-events: auto; }
.hud-bl { bottom: 10px; left: 12px; display: grid; gap: 3px; }
.hud .row { display: flex; gap: 8px; align-items: center; background: rgba(12,12,12,.55); padding: 2px 7px; border-radius: 4px; border: 1px solid rgba(255,255,255,.05); }
.hud b { color: #eee; font-weight: 500; }
.tool { pointer-events: auto; border: 1px solid rgba(255,255,255,.09); background: rgba(18,18,20,.72); color: #cfcfcf; border-radius: 5px; padding: 4px 8px; font-size: 10.5px; }
.tool.active { background: var(--accent); border-color: var(--accent); color: #07121f; }
.tool input[type=range] { width: 86px; vertical-align: middle; }
.progress { position: absolute; inset: 0; display: none; place-items: center; background: rgba(8,9,11,.72); z-index: 9; backdrop-filter: blur(2px); }
.progress.on { display: grid; }
.progress .bar { width: 260px; height: 3px; background: #262626; border-radius: 2px; overflow: hidden; margin-bottom: 10px; }
.progress .bar i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.1s infinite ease-in-out; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.progress span { font-size: 11px; color: var(--dim); display: block; text-align: center; }
.fatal { position: absolute; inset: 24px; display: none; z-index: 12; background: #1a1111; border: 1px solid #4a2626; border-radius: 8px; padding: 16px; font-size: 12px; color: #e8c6c2; white-space: pre-wrap; overflow: auto; }
.fatal.on { display: block; }
.help-overlay { position: absolute; inset: 0; display: none; z-index: 11; background: rgba(10,10,12,.82); padding: 28px; overflow: auto; }
.help-overlay.on { display: block; }
.help-overlay h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: 1.4px; color: var(--dim); text-transform: uppercase; }
.help-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 22px; }
.help-grid div { display: flex; justify-content: space-between; border-bottom: 1px solid #232323; padding: 5px 0; font-size: 11.5px; }
.help-grid b { color: #efefef; font-weight: 500; font-family: ui-monospace, monospace; font-size: 11px; }

/* --- panel content ----------------------------------------------------------------------------- */
.section { margin-bottom: 16px; }
.section > h3 { font-size: 9px; letter-spacing: 1.5px; color: var(--dimmer); margin: 0 0 8px; text-transform: uppercase; }
.field { display: grid; grid-template-columns: 1fr 92px; align-items: center; gap: 8px; padding: 3px 0; }
.field label { font-size: 11.5px; color: #b6b6b6; }
.field .val { font-size: 11px; color: var(--dim); text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 16px; }
select, input[type=text], input[type=number] { background: #1d1d1d; border: 1px solid #2c2c2c; border-radius: 5px; padding: 4px 6px; font-size: 11.5px; width: 100%; }
.switch { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; font-size: 11.5px; color: #b6b6b6; }
.switch button { width: 34px; height: 18px; border-radius: 10px; background: #2c2c2c; border: 1px solid #383838; position: relative; }
.switch button i { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #7d7d7d; transition: transform .15s, background .15s; }
.switch button.on { background: #24405f; border-color: #35597f; }
.switch button.on i { transform: translateX(16px); background: var(--accent); }
.btn { border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 10px; font-size: 11.5px; background: #1d1d1d; }
.btn:hover { background: #262626; }
.btn.primary { background: #24405f; border-color: #39648f; color: #eaf2ff; }
.btn.primary:hover { background: #2b4d73; }
.btn.wide { width: 100%; }
.btn.danger { border-color: #55292a; color: #e7b0aa; }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; }

.profile-list { display: grid; gap: 4px; }
.profile-item { display: grid; grid-template-columns: 58px 1fr auto; align-items: center; gap: 8px; padding: 5px 6px; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
.profile-item:hover { background: #1e1e1e; }
.profile-item.active { background: #232323; border-color: #3a3a3a; }
.profile-item svg { display: block; }
.profile-item .name { font-size: 11.5px; color: #cccccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-item .meta { font-size: 10px; color: var(--dimmer); }
.badge { font-size: 9px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--dim); }
.badge.bus { border-color: #35513a; color: #8fd0a0; }
.badge.bike { border-color: #5a3030; color: #e09a90; }
.badge.walk { border-color: #3a4757; color: #a9c2dc; }
.badge.park { border-color: #4a4a3a; color: #cfcb95; }
.badge.tram { border-color: #4a3f5a; color: #c0a7d8; }

.issue { display: grid; grid-template-columns: 8px 1fr; gap: 7px; padding: 5px 4px; border-bottom: 1px solid #1f1f1f; font-size: 11px; cursor: pointer; }
.issue:hover { background: #1c1c1c; }
.issue .sev { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; }
.issue .sev.error { background: var(--bad); }
.issue .sev.warn { background: var(--warn); }
.issue .sev.info { background: #6a7f92; }
.issue .code { color: var(--dim); font-size: 9.5px; letter-spacing: .6px; }

table.book { width: 100%; border-collapse: collapse; font-size: 11px; }
table.book th { text-align: left; color: var(--dimmer); font-weight: 500; font-size: 9.5px; letter-spacing: .8px; text-transform: uppercase; padding: 4px 3px; border-bottom: 1px solid var(--line); position: sticky; top: -10px; background: var(--panel); }
table.book td { padding: 3px; border-bottom: 1px solid #1e1e1e; color: #bdbdbd; font-variant-numeric: tabular-nums; cursor: pointer; white-space: nowrap; }
table.book tr:hover td { background: #1d1d1d; }
table.book tr.sel td { background: #24303c; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: 11.5px; }
.kv span { color: #a8a8a8; }
.kv b { font-weight: 500; color: #e2e2e2; font-variant-numeric: tabular-nums; }
.bar-mini { height: 4px; background: #262626; border-radius: 2px; overflow: hidden; margin-top: 3px; }
.bar-mini i { display: block; height: 100%; background: #4f6f8f; }
.statusbar { display: flex; align-items: center; padding: 0 12px; border-top: 1px solid var(--line); background: #141414; font-size: 10.5px; color: var(--dim); }
.statusbar .spacer { flex: 1; }
.muted { color: var(--dimmer); font-size: 11px; line-height: 1.5; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-size: 10px; border: 1px solid var(--line-2); border-radius: 10px; padding: 2px 7px; color: var(--dim); }
.chip b { color: #ddd; font-weight: 500; }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M4 20 L12 3 L20 20 M12 3 L12 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span class="brand-name">ProjectZero</span>
      <span class="brand-sub">Road Editor</span>
      <span class="version">ROAD EDITOR · SLATE 0.1</span>
    </div>
    <div class="topbar-actions">
      <div class="view-presets" id="viewPresets"></div>
      <button class="ghost" id="btnSave">Save</button>
      <button class="ghost" id="btnLoad">Load</button>
      <button class="ghost" id="btnExportObj">Export OBJ</button>
      <button class="ghost" id="btnExportJson">Export JSON</button>
      <button class="ghost" id="btnShot">Screenshot</button>
      <button class="ghost" id="btnHelp">Controls</button>
    </div>
  </header>

  <main class="shell">
    <aside class="panel left">
      <div class="scene-label"><span id="sceneName">UNTITLED NETWORK</span><span class="dot" id="dirtyDot"></span></div>
      <div class="tabs" id="leftTabs">
        <button data-tab="build" class="active">Build</button>
        <button data-tab="library">Library</button>
        <button data-tab="issues">Issues</button>
      </div>
      <div class="scroll" id="leftBody"></div>
    </aside>

    <section class="viewport" id="viewport">
      <canvas id="gl"></canvas>
      <div class="hud hud-tl" id="hud"></div>
      <div class="hud hud-tr" id="viewTools"></div>
      <div class="hud hud-bl" id="legend"></div>
      <div class="progress" id="progress"><div class="bar"><i></i></div><span></span></div>
      <div class="fatal" id="fatal"></div>
      <div class="help-overlay" id="helpOverlay"></div>
    </section>

    <aside class="panel right">
      <div class="tabs" id="rightTabs">
        <button data-tab="inspect" class="active">Inspector</button>
        <button data-tab="book">Road book</button>
        <button data-tab="stats">Stats</button>
      </div>
      <div class="scroll" id="rightBody"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="status">Ready.</span>
    <span class="spacer"></span>
    <span id="perf"></span>
  </footer>
</div>
