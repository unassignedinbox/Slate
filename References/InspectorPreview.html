      <text x="304" y="${(trY(0)-5).toFixed(1)}" class="axis" text-anchor="end">horizon</text>
      <path d="${one(q=>q[1]>=-0.5)}" fill="none" stroke="#cdd7ff" stroke-width="2"/>
      <path d="${one(q=>q[1]<-0.5)}" fill="none" stroke="rgba(205,215,255,.3)" stroke-width="1.6" stroke-dasharray="4 3"/>
      <line x1="${mx.toFixed(1)}" y1="8" x2="${mx.toFixed(1)}" y2="132" stroke="rgba(255,255,255,.2)"/>
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="12" fill="rgba(205,215,255,.15)"/>
      <circle cx="${mx.toFixed(1)}" cy="${my.toFixed(1)}" r="6" fill="${upM?'#e8ecf5':'none'}" stroke="${upM?'none':'rgba(255,255,255,.4)'}" stroke-width="2"/>
      <text x="${mx.toFixed(1)}" y="${(my-16).toFixed(1)}" class="axis" text-anchor="middle">${fmtT(M.t)}</text>`;
    tr.querySelector('#tr-v').textContent=`${md.az.toFixed(1)}° / ${md.el.toFixed(1)}°`;
    tr.querySelector('#tr-m').innerHTML=`${fmtT(M.t)} · rise ${rise?fmtT(rise):'—'} · set ${set?fmtT(set):'—'}${upM?'':' · below horizon'} · glow ${(M.earthshine*100).toFixed(0)}%`;
    /* brightness */
    let c2='',a2='M 10 102 ';
    for(let p=0;p<=1.001;p+=0.02){ const m=moonMlx(p,M.gain);
      c2+=`${p===0?'M':'L'} ${pbX(p).toFixed(1)} ${pbY(m).toFixed(1)} `;
      a2+=`L ${pbX(p).toFixed(1)} ${pbY(m).toFixed(1)} `; }
    pb.querySelector('#pb-c').setAttribute('d',c2);
    pb.querySelector('#pb-a').setAttribute('d',a2+'L 310 102 Z');
    const ry=pbY(105*M.gain);
    pb.querySelector('#pb-r').setAttribute('y1',ry); pb.querySelector('#pb-r').setAttribute('y2',ry);
    pb.querySelector('#pb-rl').setAttribute('y',ry-5);
    pb.querySelector('#pb-x').setAttribute('x1',pbX(M.phase)); pb.querySelector('#pb-x').setAttribute('x2',pbX(M.phase));
    pb.querySelector('#pb-d').setAttribute('cx',pbX(M.phase)); pb.querySelector('#pb-d').setAttribute('cy',pbY(mlx));
    pb.querySelector('#pb-v').textContent=mlx<1?mlx.toFixed(2):mlx.toFixed(1);
    pb.querySelector('#pb-m').innerHTML=`full-moon ref 105 mlx · gain ×${M.gain.toFixed(2)}`;
    const mArcmin=2*Math.asin(1737.4/M.distance)*180/Math.PI*60;
    pb.querySelector('#pb-s').textContent=`${M.distance.toLocaleString('en-US')} km`;
    pb.querySelector('#pb-z').textContent=`${mArcmin.toFixed(1)}′${M.distance<360000?' · perigee':M.distance>405000?' · apogee':''}`;
    /* tint */
    const md2=moonDir(M.t), mBase=2500+2500*Math.sin(Math.max(md2.el,0)*Math.PI/180);
    const mEff=clamp(Math.round(mBase+M.tintOffset),1800,12000), mEc=kelvinToRgb(mEff);
    const ltx=10+(M.tintOffset+1500)/3000*300;
    lt.querySelector('#lt-x').setAttribute('x1',ltx); lt.querySelector('#lt-x').setAttribute('x2',ltx);
    lt.querySelector('#lt-d').setAttribute('cx',ltx);
    lt.querySelector('#lt-d').style.fill=rgbCss(mEc);
    lt.querySelector('#lt-v').textContent=mEff;
    lt.querySelector('#lt-m').innerHTML=`<span class="swatch" style="background:${rgbCss(mEc)}"></span>${mEc[0]} ${mEc[1]} ${mEc[2]}`;
    lt.querySelector('#lt-b').textContent=`${Math.round(mBase)} · ${M.tintOffset>=0?'+':''}${M.tintOffset}`;
    lt.querySelector('#lt-r').textContent=`${Math.round(1e6/mEff)} mired`;
  }
  render();
}


/* ================================================================ FOG */
const fmtDist=v=>v>=1000?(v/1000).toFixed(1)+' km':Math.round(v)+' m';
function pageFog(host){ const F=state.fog;
  host.insertAdjacentHTML('beforeend',headHTML('#9fd8b4','EXPONENTIAL FOG','Height_Fog','extinction · height falloff'));
  const hero=document.createElement('div'); hero.className='card';
  hero.innerHTML=`${cardLabel('Visibility · Koschmieder')}<div id="h-v"></div><div><span class="delta-pill" id="h-p">—</span></div>`;
  host.appendChild(hero);

  /* extinction curve */
  const fx=document.createElement('div'); fx.className='card';
  fx.innerHTML=`${cardLabel('Extinction curve','drag — draw the transmittance you want')}
    <div class="plot" id="fext"><svg viewBox="0 0 320 128" id="fx-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="fx-v">—</span><span class="u">σ · 1/km</span>
      <span class="meta" id="fx-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">HALF-DISTANCE d½</div><div class="v num" id="fx-h" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">T @ 100 M</div><div class="v num" id="fx-t" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">DECADIC</div><div class="v num" id="fx-d" style="font-size:12px">—</div></div></div>`;
  host.appendChild(fx);
  const fxSvg=fx.querySelector('#fx-svg'), fxEl=fx.querySelector('#fext');
  const fxXMax=()=>{ const V=3912/F.sigma, d50=Math.LN2/F.sigma*1000, need=Math.max(d50*5,V*0.35);
    for(const st of [100,200,500,1000,2000,5000,10000,20000,50000]) if(need<=st) return st; return 50000; };
  let fxXm=5000, fxOn=false;
  fxEl.addEventListener('pointerdown',e=>{ fxOn=true; fxXm=fxXMax(); fxEl.setPointerCapture(e.pointerId); fxMove(e); });
  fxEl.addEventListener('pointermove',e=>{ if(fxOn)fxMove(e); });
  fxEl.addEventListener('pointerup',()=>{ fxOn=false; render(); });
  function fxMove(e){ const r=fxEl.getBoundingClientRect();
    const d=clamp((e.clientX-r.left)/r.width*320-10,4,300)/300*fxXm;
    const T=clamp(1-((e.clientY-r.top)/r.height*128-8)/96,0.01,0.99);
    F.sigma=Math.round(clamp(-Math.log(T)/(Math.max(d,5)/1000),0.02,12)*1000)/1000;
    render(); }

  /* height profile */
  const fp=document.createElement('div'); fp.className='card';
  fp.innerHTML=`${cardLabel('Height profile','knees: base offset + falloff height')}
    <div class="plot" id="fprof"><svg viewBox="0 0 320 128" id="fp-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="fh-v">—</span><span class="u">m falloff H</span>
      <span class="meta" id="fh-m">—</span></div>`;
  host.appendChild(fp);
  const fpSvg=fp.querySelector('#fp-svg');
  const fpY=h=>112-h/60*104;
  const fpEl=fp.querySelector('#fprof'); let fpMode=null;
  const fpPos=e=>{ const r=fpEl.getBoundingClientRect();
    return [(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*128]; };
  fpEl.addEventListener('pointerdown',e=>{ const [,y]=fpPos(e);
    fpMode=Math.abs(y-fpY(F.base))<Math.abs(y-fpY(F.falloff))?'base':'H';
    if(F.base<0.5&&y>fpY(4))fpMode='base';
    fpEl.setPointerCapture(e.pointerId); fpMove(e); });
  fpEl.addEventListener('pointermove',e=>{ if(fpMode)fpMove(e); });
  fpEl.addEventListener('pointerup',()=>fpMode=null);
  function fpMove(e){ const [,y]=fpPos(e);
    if(fpMode==='base')F.base=Math.round(clamp((112-y)/104*60,0,20)*10)/10;
    else F.falloff=Math.round(clamp((112-y)/104*60,1,60)*10)/10; render(); }

  /* scattering lobe */
  const lb=document.createElement('div'); lb.className='card';
  lb.innerHTML=`${cardLabel('Scattering lobe','horizontal: anisotropy · vertical: albedo')}
    <div class="plot" id="lobe"><svg viewBox="0 0 320 150" id="lb-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="lb-v">—</span><span class="u">anisotropy g</span>
      <span class="meta" id="lb-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">FORWARD GAIN</div><div class="v num" id="lb-f" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">ALBEDO · ABSORB</div><div class="v num" id="lb-a" style="font-size:12px">—</div></div></div>`;
  host.appendChild(lb);
  const lbSvg=lb.querySelector('#lb-svg');
  dragify(lb.querySelector('#lobe'),e=>{ const r=lb.querySelector('#lobe').getBoundingClientRect();
    F.aniso=Math.round(clamp(((e.clientX-r.left)/r.width*320-10)/300,0,1)*180-90)/100;
    F.albedo=Math.round(clamp(1-(e.clientY-r.top)/r.height,0,1)*50+50)/100;
    render(); });

  /* -------- render -------- */
  function render(){
    const V=3912/F.sigma, xm=fxXMax();
    if(V>=1000){ const [hi,hf]=splitNum(V/1000,2); hero.querySelector('#h-v').innerHTML=heroHTML(hi,hf,'km'); }
    else hero.querySelector('#h-v').innerHTML=heroHTML(String(Math.round(V)),'','m');
    hero.querySelector('#h-p').textContent=F.sigma<0.2?'crystal clear':F.sigma<1?'light haze':F.sigma<3?'misty':'dense fog';
    /* extinction */
    const X=d=>10+d/xm*300, Y=t=>104-clamp(t,0,1)*96;
    const T=d=>Math.exp(-F.sigma*d/1000);
    let c='',a='M 10 104 ';
    for(let i=0;i<=60;i++){ const d=i/60*xm;
      c+=`${i?'L':'M'} ${X(d).toFixed(1)} ${Y(T(d)).toFixed(1)} `;
      a+=`L ${X(d).toFixed(1)} ${Y(T(d)).toFixed(1)} `; }
    const d50=Math.LN2/F.sigma*1000, vx=X(Math.min(V,xm)), hx=X(Math.min(d50,xm));
    fxSvg.innerHTML=`
      <line x1="10" y1="${Y(0.5)}" x2="310" y2="${Y(0.5)}" stroke="rgba(255,255,255,.1)" stroke-dasharray="3 4"/>
      <text x="12" y="${Y(0.5)-4}" class="axis">50%</text>
      <line x1="10" y1="104" x2="310" y2="104" stroke="rgba(255,255,255,.2)"/>
      <text x="10" y="118" class="axis">0</text>
      <text x="160" y="118" class="axis" text-anchor="middle">${fmtDist(xm/2)}</text>
      <text x="310" y="118" class="axis" text-anchor="end">${fmtDist(xm)}</text>
      <path d="${a}L 310 104 Z" fill="rgba(159,216,180,.14)"/>
      <path d="${c}" fill="none" stroke="#9fd8b4" stroke-width="2"/>
      <line x1="${vx.toFixed(1)}" y1="8" x2="${vx.toFixed(1)}" y2="104" stroke="rgba(255,255,255,.3)" stroke-dasharray="4 3"/>
      <text x="${vx.toFixed(1)}" y="16" class="axis" text-anchor="middle">V</text>
      <line x1="${hx.toFixed(1)}" y1="8" x2="${hx.toFixed(1)}" y2="104" class="xhair" style="--ac:#9fd8b4"/>
      <circle cx="${hx.toFixed(1)}" cy="${Y(T(Math.min(d50,xm))).toFixed(1)}" r="5" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>`;
    fx.querySelector('#fx-v').textContent=F.sigma<1?F.sigma.toFixed(3):F.sigma.toFixed(2);
    fx.querySelector('#fx-m').innerHTML=`V ${fmtDist(V)} · T = e^-σd`;
    fx.querySelector('#fx-h').textContent=fmtDist(d50);
    fx.querySelector('#fx-t').textContent=(T(100)*100).toFixed(1)+' %';
    fx.querySelector('#fx-d').textContent=(F.sigma*4.343).toFixed(2)+' dB/km';
    /* height */
    let prof=`M 60 ${fpY(0)} `;
    for(let h=0;h<=60;h+=2)prof+=`L ${(60+230*Math.exp(-h/F.falloff)).toFixed(1)} ${fpY(h).toFixed(1)} `;
    prof+=`L 60 ${fpY(60)} Z`;
    fpSvg.innerHTML=`
      <text x="52" y="${fpY(60)+3}" class="axis" text-anchor="end">60</text>
      <text x="52" y="${fpY(30)+3}" class="axis" text-anchor="end">30</text>
      <text x="52" y="${fpY(0)+3}" class="axis" text-anchor="end">0 m</text>
      <line x1="60" y1="8" x2="60" y2="112" stroke="rgba(255,255,255,.2)"/>
      <path d="${prof}" fill="rgba(159,216,180,.2)" stroke="#9fd8b4" stroke-width="2"/>
      <line x1="8" y1="112" x2="312" y2="112" stroke="rgba(255,255,255,.3)"/>
      <text x="312" y="108" class="axis" text-anchor="end">GROUND</text>
      <rect x="60" y="${fpY(F.base).toFixed(1)}" width="240" height="${(112-fpY(F.base)).toFixed(1)}" fill="#0c0c0e" opacity=".72"/>
      <text x="292" y="${(112-4).toFixed(0)}" class="axis" text-anchor="end">CLEAR</text>
      <line x1="60" y1="${fpY(F.base).toFixed(1)}" x2="300" y2="${fpY(F.base).toFixed(1)}" stroke="#f2c267" stroke-width="1.4" stroke-dasharray="5 3" opacity=".85"/>
      <circle cx="80" cy="${fpY(F.base).toFixed(1)}" r="5.5" fill="#0c0c0e" stroke="#f2c267" stroke-width="2.5"/>
      <line x1="60" y1="${fpY(F.falloff).toFixed(1)}" x2="300" y2="${fpY(F.falloff).toFixed(1)}" stroke="#fff" stroke-width="1.4" stroke-dasharray="5 3" opacity=".7"/>
      <circle cx="290" cy="${fpY(F.falloff).toFixed(1)}" r="5.5" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>
      <text x="276" y="${(fpY(F.falloff)-8).toFixed(1)}" class="axis" text-anchor="end">H</text>`;
    fp.querySelector('#fh-v').textContent=F.falloff.toFixed(1);
    fp.querySelector('#fh-m').innerHTML=`half-density at ${(F.falloff*Math.LN2).toFixed(1)} m · surface σ ${F.sigma} /km · base ${F.base.toFixed(1)} m`;
    /* lobe */
    const hgF=(g,c)=>{ const d=1+g*g-2*g*c; return (1-g*g)/Math.pow(Math.max(d,1e-6),1.5); };
    let lobe='';
    for(let i=0;i<=72;i++){ const th=i/72*2*Math.PI, lc=Math.cos(th);
      const lp=hgF(F.aniso,lc), lmax=hgF(F.aniso,F.aniso>=0?1:-1);
      const lr=8+58*lp/lmax, lX=160+lr*lc, lY=75-lr*Math.sin(th);
      lobe+=`${i?'L':'M'} ${lX.toFixed(1)} ${lY.toFixed(1)} `; }
    const fgain=(1+F.aniso)/Math.pow(Math.max(1-F.aniso,0.05),2);
    lbSvg.innerHTML=`
      <line x1="10" y1="75" x2="310" y2="75" stroke="rgba(255,255,255,.12)"/>
      <line x1="160" y1="10" x2="160" y2="140" stroke="rgba(255,255,255,.12)"/>
      <circle cx="160" cy="75" r="66" fill="none" stroke="rgba(255,255,255,.08)" stroke-dasharray="3 4"/>
      <text x="306" y="70" class="axis" text-anchor="end">sunward</text>
      <path d="${lobe}Z" fill="rgba(159,216,180,${(0.1+0.5*F.albedo).toFixed(2)})" stroke="#9fd8b4" stroke-width="2"/>
      <circle cx="160" cy="75" r="4" fill="#9fd8b4"/>`;
    lb.querySelector('#lb-v').textContent=(F.aniso>=0?'+':'')+F.aniso.toFixed(2);
    lb.querySelector('#lb-m').innerHTML=F.aniso>0.3?'strong forward throw':F.aniso<-0.3?'back-scatter glory':'near-isotropic';
    lb.querySelector('#lb-f').textContent=`×${fgain>=10?fgain.toFixed(0):fgain.toFixed(1)}`;
    lb.querySelector('#lb-a').textContent=`${F.albedo.toFixed(2)} · ${((1-F.albedo)*100).toFixed(0)}%`;
  }
  render();
}

/* ================================================================ SPOT */
function pageSpot(host){ const P=state.spot;
  const beamLm=()=>2*Math.PI*P.intensity*(1-Math.cos(P.outer/2*Math.PI/180));
  host.insertAdjacentHTML('beforeend',headHTML('#ffb469','SPOT LIGHT','Key_Spot','cone · candela · kelvin'));
  const hero=document.createElement('div'); hero.className='card';
  hero.innerHTML=`${cardLabel('Peak intensity')}<div id="h-i"></div><div><span class="delta-pill" id="h-b">—</span></div>`;
  host.appendChild(hero);

  /* cone section */
  const cn=document.createElement('div'); cn.className='card';
  cn.innerHTML=`${cardLabel('Cone section','edges: angles · apex: cd · flag: range · plane: throw')}
    <div class="plot" id="cone"><svg viewBox="0 0 320 190" id="cn-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="cn-v">—</span><span class="u">lx centre @ plane</span>
      <span class="meta" id="cn-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">INNER / OUTER</div><div class="v num" id="cn-io" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">BEAM LUMENS</div><div class="v num" id="cn-bm" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">CONE SOLID ANGLE</div><div class="v num" id="cn-sr" style="font-size:12px">—</div></div></div>`;
  host.appendChild(cn);
  const cnSvg=cn.querySelector('#cn-svg'), cnEl=cn.querySelector('#cone');
  const cnPlaneX=()=>70+(P.throw-1)/9*220;
  const rgX=()=>70+(P.range-1)/19*220;
  const cnPos=e=>{ const r=cnEl.getBoundingClientRect();
    return [(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*190]; };
  const cnHandles=()=>{ const px=cnPlaneX(), len=px-36;
    return { px, len,
      iy:95-len*Math.tan(P.inner/2*Math.PI/180),
      oy:95-len*Math.tan(P.outer/2*Math.PI/180) }; };
  let cnMode=null;
  cnEl.addEventListener('pointerdown',e=>{ const [x,y]=cnPos(e), h=cnHandles();
    const dI=Math.hypot(x-h.px,y-clamp(h.iy,16,174)), dO=Math.hypot(x-h.px,y-clamp(h.oy,16,174));
    const rgm=rgX();
    cnMode=(Math.abs(x-rgm)<14&&y<50)?'range':(dI<22&&dI<=dO)?'inner':(dO<22?'outer':(x<70?'gain':'throw'));
    cnEl.setPointerCapture(e.pointerId); cnMove(e); });
  cnEl.addEventListener('pointermove',e=>{ if(cnMode)cnMove(e); });
  cnEl.addEventListener('pointerup',()=>cnMode=null);
  function cnMove(e){ const [x,y]=cnPos(e), h=cnHandles();
    if(cnMode==='inner')P.inner=Math.round(clamp(2*Math.atan(Math.abs(y-95)/h.len)*180/Math.PI,5,P.outer-2)*10)/10;
    else if(cnMode==='outer')P.outer=Math.round(clamp(2*Math.atan(Math.abs(y-95)/h.len)*180/Math.PI,P.inner+2,90)*10)/10;
    else if(cnMode==='gain')P.intensity=Math.round(Math.pow(10,1+clamp(1-(y-15)/160,0,1)*3.3));
    else if(cnMode==='range')P.range=Math.round((1+clamp((x-70)/220,0,1)*19)*10)/10;
    else P.throw=Math.round((1+clamp((x-70)/220,0,1)*9)*10)/10;
    render(); }

  /* temp wheel */
  const TN=[[1800,'candle'],[2700,'tungsten'],[3200,'halogen'],[5600,'daylight'],[6500,'overcast'],[9000,'shade']];
  const tnName=v=>{ let n=TN[0][1]; for(const [a,l] of TN) if(v>=a) n=l; return n; };
  const tw=document.createElement('div'); tw.className='card';
  tw.innerHTML=`${cardLabel('Temperature wheel','drag around the arc')}
    <div class="plot" id="twheel"><svg viewBox="0 0 320 158" id="tw-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="tw-v">—</span><span class="u">K</span>
      <span class="meta" id="tw-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">MIRED</div><div class="v num" id="tw-r" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">sRGB TINT</div><div class="v num" id="tw-t" style="font-size:12px">—</div></div></div>`;
  host.appendChild(tw);
  const twSvg=tw.querySelector('#tw-svg');
  const twT=()=>Math.log(P.temp/1800)/Math.log(12000/1800);
  dragify(tw.querySelector('#twheel'),e=>{ const r=tw.querySelector('#twheel').getBoundingClientRect();

  /* placement */
  const pl=document.createElement('div'); pl.className='card';

  /* decay curve */
  const dc=document.createElement('div'); dc.className='card';
  dc.innerHTML=`${cardLabel('Decay law','drag vertically — falloff exponent')}
    <div class="plot" id="decay"><svg viewBox="0 0 320 118">
      <path id="dc-a" fill="rgba(255,180,105,.13)"/><path id="dc-c" fill="none" stroke="#ffb469" stroke-width="2"/>

      <line id="dc-x" y1="8" y2="100" class="xhair" style="--ac:#ffb469"/>

    <div class="vstrip"><span class="big num" id="dc-v">—</span><span class="u">decay exponent</span>
      <span class="meta" id="dc-m">—</span></div>`;
  host.appendChild(dc);
  const dcX=d=>10+(d-0.5)/14.5*300;
  const dcMax=()=>P.intensity/Math.pow(0.5,P.decay);
  const dcY=e=>100-clamp(e/dcMax(),0,1)*92;
  dragify(dc.querySelector('#decay'),e=>{ const r=dc.querySelector('#decay').getBoundingClientRect();
    P.decay=Math.round(clamp(1-(e.clientY-r.top)/r.height,0,1)*4*100)/100; render(); });

  /* softness gauge */
  const sg=document.createElement('div'); sg.className='card';
  sg.innerHTML=`${cardLabel('Shadow softness','drag around the meter — source radius')}
    <div class="plot" id="soft"><svg viewBox="0 0 320 130" id="sg-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="sg-v">—</span><span class="u">cm source radius</span>
      <span class="meta" id="sg-m">—</span></div>`;
  host.appendChild(sg);
  const sgSvg=sg.querySelector('#sg-svg');
  dragify(sg.querySelector('#soft'),e=>{ const r=sg.querySelector('#soft').getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*320-160, y=112-(e.clientY-r.top)/r.height*130;
    const t=clamp(1-Math.atan2(Math.max(y,0),x)/Math.PI,0,1);
    P.srcRadius=Math.round(t*30*10)/10; render(); });

  /* gel wheel */
  const gw=document.createElement('div'); gw.className='card';
  gw.innerHTML=`${cardLabel('Gel wheel','angle: hue · radius: saturation')}
    <div class="plot" id="gel"><svg viewBox="0 0 200 168" id="gw-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="gw-v">—</span><span class="u">° gel hue</span>
      <span class="meta" id="gw-m">—</span></div>`;
  host.appendChild(gw);
  const gwSvg=gw.querySelector('#gw-svg'), gwEl=gw.querySelector('#gel');
  dragify(gwEl,e=>{ const r=gwEl.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*200-100, y=(e.clientY-r.top)/r.height*168-88;
    let a=Math.atan2(x,-y)*180/Math.PI; if(a<0)a+=360;
    P.gelHue=Math.round(a);
    P.gelSat=Math.round(clamp((Math.sqrt(x*x+y*y)-8)/50,0,1)*100)/100;
    render(); });

  /* -------- render -------- */
  function render(){
    hero.querySelector('#h-i').innerHTML=P.intensity>=1000
      ?heroHTML((P.intensity/1000).toFixed(1)+'k','','cd'):heroHTML(String(Math.round(P.intensity)),'','cd');
    hero.querySelector('#h-b').textContent=`≈ ${Math.round(beamLm())} lm beam`;
    /* cone */
    const px=cnPlaneX(), len=px-36, rgx=rgX();
    const hO=len*Math.tan(P.outer/2*Math.PI/180), hI=len*Math.tan(P.inner/2*Math.PI/180);
    const pool=2*P.throw*Math.tan(P.outer/2*Math.PI/180), centre=P.throw<=P.range?P.intensity/Math.pow(P.throw,P.decay):0;
    const edge=Math.pow(Math.cos(P.outer/2*Math.PI/180),3)*100;
    cnSvg.innerHTML=`<defs><clipPath id="cncl"><rect x="8" y="14" width="304" height="162"/></clipPath></defs>
      <g clip-path="url(#cncl)">
        <polygon points="36,95 ${(px).toFixed(1)},${(95-hO).toFixed(1)} ${px.toFixed(1)},${(95+hO).toFixed(1)}" fill="rgba(255,180,105,.10)"/>
        <polygon points="36,95 ${px.toFixed(1)},${(95-hI).toFixed(1)} ${px.toFixed(1)},${(95+hI).toFixed(1)}" fill="rgba(255,180,105,.22)"/>
        <line x1="36" y1="95" x2="312" y2="95" stroke="rgba(255,255,255,.18)" stroke-dasharray="5 4"/>
        <line x1="${px.toFixed(1)}" y1="${(95-hO).toFixed(1)}" x2="${px.toFixed(1)}" y2="${(95+hO).toFixed(1)}" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
        <line x1="${(px-6).toFixed(1)}" y1="${(95-hO).toFixed(1)}" x2="${(px+6).toFixed(1)}" y2="${(95-hO).toFixed(1)}" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
        <line x1="${(px-6).toFixed(1)}" y1="${(95+hO).toFixed(1)}" x2="${(px+6).toFixed(1)}" y2="${(95+hO).toFixed(1)}" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
      </g>
      <rect x="24" y="84" width="16" height="22" rx="4" fill="#1c1c20" stroke="rgba(255,255,255,.25)"/>
      <circle cx="40" cy="95" r="4" fill="#ffd9a8" style="filter:drop-shadow(0 0 6px #ffb469)"/>
      <text x="14" y="30" class="axis">APEX = cd</text>
      <text x="${px.toFixed(1)}" y="186" class="axis" text-anchor="middle">${P.throw.toFixed(1)} m</text>
      <text x="308" y="186" class="axis" text-anchor="end">pool ${pool<10?pool.toFixed(2):pool.toFixed(1)} m</text>
      <line x1="${px.toFixed(1)}" y1="14" x2="${px.toFixed(1)}" y2="176" stroke="rgba(255,255,255,.12)" stroke-dasharray="2 3"/>
      <rect x="${rgx.toFixed(1)}" y="14" width="${(312-rgx).toFixed(1)}" height="162" fill="#000" opacity=".45"/>
      <line x1="${rgx.toFixed(1)}" y1="14" x2="${rgx.toFixed(1)}" y2="176" stroke="#f2c267" stroke-width="1.6" stroke-dasharray="5 3"/>
      <polygon points="${rgx.toFixed(1)},14 ${(rgx-9).toFixed(1)},26 ${(rgx+9).toFixed(1)},26" fill="#f2c267"/>
      <text x="${rgx.toFixed(1)}" y="38" class="axis" text-anchor="middle">CUT</text>
      <circle cx="${px.toFixed(1)}" cy="${clamp(95-hI,18,172).toFixed(1)}" r="6" fill="#0c0c0e" stroke="#ffb469" stroke-width="2.5"/>
      <circle cx="${px.toFixed(1)}" cy="${clamp(95-hO,18,172).toFixed(1)}" r="6" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>`;
    cn.querySelector('#cn-v').textContent=centre>=1000?(centre/1000).toFixed(1)+'k':centre.toFixed(centre<10?1:0);
    cn.querySelector('#cn-m').innerHTML=`throw ${P.throw.toFixed(1)} m · pool dia ${pool<10?pool.toFixed(2):pool.toFixed(1)} m · edge ≈ ${edge.toFixed(0)}% · cut ${P.range.toFixed(1)} m${P.throw>P.range?' · BEYOND RANGE':''}`;
    cn.querySelector('#cn-io').textContent=`${P.inner.toFixed(1)}° / ${P.outer.toFixed(1)}°`;
    cn.querySelector('#cn-bm').textContent=`≈ ${Math.round(beamLm())} lm`;
    cn.querySelector('#cn-sr').textContent=`${(2*Math.PI*(1-Math.cos(P.outer/2*Math.PI/180))).toFixed(3)} sr`;
    /* wheel */
    const t=twT(), ang=Math.PI*(1-t);
    const nx=160+96*Math.cos(ang), ny=132-96*Math.sin(ang);
    let ticks='';
    [[1800,'1.8k'],[3200,'3.2k'],[5600,'5.6k'],[9000,'9k'],[12000,'12k']].forEach(([T,l])=>{
      const tt=Math.log(T/1800)/Math.log(12000/1800), aa=Math.PI*(1-tt);
      ticks+=`<line x1="${(160+88*Math.cos(aa)).toFixed(1)}" y1="${(132-88*Math.sin(aa)).toFixed(1)}" x2="${(160+104*Math.cos(aa)).toFixed(1)}" y2="${(132-104*Math.sin(aa)).toFixed(1)}" stroke="rgba(255,255,255,.35)" stroke-width="2"/>`
        +`<text x="${(160+76*Math.cos(aa)).toFixed(1)}" y="${(132-76*Math.sin(aa)+3).toFixed(1)}" class="axis" text-anchor="middle">${l}</text>`; });
    const sw=kelvinToRgb(P.temp);
    twSvg.innerHTML=`<defs><linearGradient id="twg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ff8a2a"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#7aa2ff"/></linearGradient></defs>
      ${ticks}
      <path d="M 64 132 A 96 96 0 0 1 256 132" fill="none" stroke="url(#twg)" stroke-width="10" stroke-linecap="round" opacity=".9"/>
      <line x1="160" y1="132" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
      <circle cx="160" cy="132" r="6" fill="#1c1c20" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
      <circle cx="${nx.toFixed(1)}" cy="${ny.toFixed(1)}" r="8" fill="${rgbCss(sw)}" stroke="#fff" stroke-width="2.5" style="filter:drop-shadow(0 0 8px rgba(0,0,0,.6))"/>`;
    tw.querySelector('#tw-v').textContent=Math.round(P.temp);
    tw.querySelector('#tw-m').innerHTML=`≈ ${tnName(P.temp)}`;
    tw.querySelector('#tw-r').textContent=`${Math.round(1e6/P.temp)} mired`;
    tw.querySelector('#tw-t').innerHTML=`<span class="swatch" style="background:${rgbCss(sw)}"></span>${sw[0]} ${sw[1]} ${sw[2]}`;
    /* decay */
    let dc1='',dc2='',dcA='M 10 100 ';
    for(let dd=0.5;dd<=15.001;dd+=0.25){ const de=P.intensity/Math.pow(dd,P.decay), dr2=P.intensity/(dd*dd);
      dc1+=`${dd===0.5?'M':'L'} ${dcX(dd).toFixed(1)} ${dcY(de).toFixed(1)} `;
      dc2+=`${dd===0.5?'M':'L'} ${dcX(dd).toFixed(1)} ${dcY(dr2).toFixed(1)} `;
      dcA+=`L ${dcX(dd).toFixed(1)} ${dcY(de).toFixed(1)} `; }
    dc.querySelector('#dc-c').setAttribute('d',dc1);
    dc.querySelector('#dc-r').setAttribute('d',dc2);
    dc.querySelector('#dc-a').setAttribute('d',dcA+'L 310 100 Z');
    dc.querySelector('#dc-x').setAttribute('x1',dcX(Math.min(P.throw,15)));
    dc.querySelector('#dc-x').setAttribute('x2',dcX(Math.min(P.throw,15)));
    dc.querySelector('#dc-d').setAttribute('cx',dcX(Math.min(P.throw,15)));
    dc.querySelector('#dc-d').setAttribute('cy',dcY(P.intensity/Math.pow(Math.min(P.throw,15),P.decay)));
    dc.querySelector('#dc-v').textContent=P.decay.toFixed(2);
    dc.querySelector('#dc-m').innerHTML=Math.abs(P.decay-2)<0.05?'physical inverse-square':P.decay<2?'softer than physical':'harder than physical';
    /* softness */
    const sgA=Math.PI*(1-P.srcRadius/30);
    const sgNx=160+88*Math.cos(sgA), sgNy=112-88*Math.sin(sgA);
    let sgTk='';
    for(let sv=0;sv<=30;sv+=5){ const sa=Math.PI*(1-sv/30);
      sgTk+=`<line x1="${(160+78*Math.cos(sa)).toFixed(1)}" y1="${(112-78*Math.sin(sa)).toFixed(1)}" x2="${(160+96*Math.cos(sa)).toFixed(1)}" y2="${(112-96*Math.sin(sa)).toFixed(1)}" stroke="rgba(255,255,255,.35)" stroke-width="2"/>`
        +`<text x="${(160+66*Math.cos(sa)).toFixed(1)}" y="${(112-66*Math.sin(sa)+3).toFixed(1)}" class="axis" text-anchor="middle">${sv}</text>`; }
    sgSvg.innerHTML=`<path d="M 72 112 A 88 88 0 0 1 248 112" fill="none" stroke="#26262c" stroke-width="10" stroke-linecap="round"/>
      <path d="M 72 112 A 88 88 0 0 1 248 112" fill="none" stroke="#ffb469" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(P.srcRadius/30*276.5).toFixed(1)} 276.5"/>${sgTk}
      <line x1="160" y1="112" x2="${sgNx.toFixed(1)}" y2="${sgNy.toFixed(1)}" stroke="rgba(255,255,255,.5)" stroke-width="2"/>
      <circle cx="160" cy="112" r="6" fill="#1c1c20" stroke="rgba(255,255,255,.4)" stroke-width="2"/>
      <circle cx="${sgNx.toFixed(1)}" cy="${sgNy.toFixed(1)}" r="6.5" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>`;
    sg.querySelector('#sg-v').textContent=P.srcRadius.toFixed(1);
    sg.querySelector('#sg-m').innerHTML=`penumbra ≈ ${(Math.atan(P.srcRadius/100/P.throw)*180/Math.PI).toFixed(1)}° @ plane${P.srcRadius>20?' · noisy':''}`;
    /* gel */
    const gwP=(r,a)=>[100+r*Math.sin(a),88-r*Math.cos(a)];
    let gwSeg='';
    for(let gi=0;gi<24;gi++){ const ga0=gi/24*2*Math.PI, ga1=(gi+1.06)/24*2*Math.PI;
      gwSeg+=`<path d="M ${gwP(64,ga0).map(v=>v.toFixed(1)).join(' ')} A 64 64 0 0 1 ${gwP(64,ga1).map(v=>v.toFixed(1)).join(' ')}" fill="none" stroke="hsl(${gi*15},75%,58%)" stroke-width="13"/>`; }
    const gel=hsv2rgb(P.gelHue,P.gelSat,1);
    const gmix=[Math.round(gel[0]*sw[0]/255),Math.round(gel[1]*sw[1]/255),Math.round(gel[2]*sw[2]/255)];
    const ghex='#'+gmix.map(v=>v.toString(16).padStart(2,'0')).join('');
    const gR=8+P.gelSat*50, gA2=P.gelHue*Math.PI/180;
    gwSvg.innerHTML=`${gwSeg}
      <circle cx="100" cy="88" r="46" fill="${ghex}" stroke="rgba(255,255,255,.25)" stroke-width="2"/>
      <circle cx="${(100+gR*Math.sin(gA2)).toFixed(1)}" cy="${(88-gR*Math.cos(gA2)).toFixed(1)}" r="6.5" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>
      <text x="100" y="92" text-anchor="middle" fill="rgba(0,0,0,.55)" font-size="11" font-weight="700">${ghex}</text>`;
    gw.querySelector('#gw-v').textContent=P.gelHue;
    gw.querySelector('#gw-m').innerHTML=`sat ${(P.gelSat*100).toFixed(0)}% · ${ghex} × ${P.temp}K`;
  }
  render();
}


/* ================================================================ RENDERER */
function pageRenderer(host){ const R=state.renderer;
  host.insertAdjacentHTML('beforeend',headHTML('var(--rend)','RESTIR DI + GI','Renderer','budget · stops · pipeline · convergence'));
  const hero=document.createElement('div'); hero.className='card';
  hero.innerHTML=`${cardLabel('Primary candidates')}<div id="h-c"></div><div id="h-s"></div>`;
  host.appendChild(hero);

  /* sample matrix */
  const mx=document.createElement('div'); mx.className='card';
  mx.innerHTML=`${cardLabel('Reservoir matrix','paint dots — candidates per pixel')}
    <div class="plot"><div class="matrix" id="mx"></div></div>
    <div class="seg-row" id="mx-s"></div>
    <div class="vstrip"><span class="big num" id="mx-v">—</span><span class="u">candidates / px</span>
      <span class="meta" id="mx-m">—</span></div>`;
  host.appendChild(mx);
  const mxEl=mx.querySelector('#mx');
  for(let i=0;i<32;i++) mxEl.appendChild(document.createElement('i'));
  const dots=[...mxEl.children];
  const setFromMatrix=e=>{ const r=mxEl.getBoundingClientRect();
    const cols=8,dx=r.width/cols,rows=4,dy=r.height/rows;
    const c=clamp(Math.floor((e.clientX-r.left)/dx),0,cols-1),rw=clamp(Math.floor((e.clientY-r.top)/dy),0,rows-1);
    R.candidates=Math.max(1,rw*cols+c+1); render(); };
  dragify(mxEl,setFromMatrix);
  const mxSamp=mx.querySelector('#mx-s');
  ['Halton','Sobol','Blue'].forEach(nm=>{ const b=document.createElement('button');
    b.className='seg-btn'+(R.sampler===nm?' active':''); b.textContent=nm;
    b.addEventListener('click',()=>{ R.sampler=nm; render();
      mxSamp.querySelectorAll('.seg-btn').forEach(x=>x.classList.toggle('active',x===b));
      toast(`Sampler ${nm} — accumulation restarted`); });
    mxSamp.appendChild(b); });

  /* pass ring */
  const pr=document.createElement('div'); pr.className='card';
  pr.innerHTML=`${cardLabel('Spatial ring','trace the arc — extra candidates')}
    <div class="plot" id="pr" style="cursor:pointer"><svg viewBox="0 0 320 130">
      <g id="pr-s"></g>
      <text x="160" y="72" text-anchor="middle" fill="#f4f4f5" font-size="34" font-weight="200" class="num" id="pr-v">2</text>
      <text x="160" y="92" text-anchor="middle" class="axis">PASSES</text></svg></div>
    <div class="vstrip"><span class="big num" id="pr-t">—</span><span class="u">total candidates / px</span>
      <span class="meta">M + passes</span></div>`;
  host.appendChild(pr);
  const prS=pr.querySelector('#pr-s');
  for(let i=0;i<8;i++){ const a=(135+i*(270/8))*Math.PI/180;
    const x=160+Math.cos(a)*52,y=72+Math.sin(a)*52;
    SVG('circle',{cx:x,cy:y,r:9,fill:'#222228',stroke:'rgba(255,255,255,.08)',id:'prs'+i},prS); }
  dragify(pr.querySelector('#pr'),e=>{ const r=pr.querySelector('#pr').getBoundingClientRect();
    const dx=e.clientX-(r.left+r.width/2),dy=(e.clientY-r.top)/r.height*130-72;
    let a=Math.atan2(dy,dx)*180/Math.PI; if(a<0)a+=360;
    let t=(a-135)/270; R.spatial=(a>45&&a<135)?0:clamp(Math.round(clamp(t,0,1)*8),0,8); render(); });

  /* exposure stops */
  const ex=document.createElement('div'); ex.className='card';
  ex.innerHTML=`${cardLabel('Exposure stops','horizontal: stops · vertical: clamp')}
    <div class="plot" id="ex" style="cursor:ew-resize"><svg viewBox="0 0 320 96">
      <defs><linearGradient id="exg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000"/><stop offset=".45" stop-color="#3a3a40"/>
        <stop offset=".62" stop-color="#8a8a92"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
      <rect x="8" y="26" width="304" height="30" rx="15" fill="url(#exg)" stroke="rgba(255,255,255,.1)"/>
      <g id="ex-t"></g><line id="ex-x" y1="16" y2="66" class="xhair" style="--ac:var(--rend)"/>
      <circle id="ex-d" r="9" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>
      <line id="ex-cl" x1="8" x2="306" y1="41" y2="41" stroke="#ffd166" stroke-width="1.6" stroke-dasharray="5 3"/>
      <circle id="ex-ck" r="5" cx="306" cy="41" fill="#0c0c0e" stroke="#ffd166" stroke-width="2.5"/>
      <text id="ex-clb" x="298" y="36" class="axis" text-anchor="end">clamp</text></svg></div>
    <div class="vstrip"><span class="big num" id="ex-v">—</span><span class="u">× exposure</span>
      <span class="meta" id="ex-m">—</span></div>`;
  host.appendChild(ex);
  const exT=e=>(Math.log2(e)-Math.log2(0.1))/(Math.log2(4)-Math.log2(0.1));
  [-3,-2,-1,0,1,2].forEach(ev=>{ const x=8+exT(Math.pow(2,ev))*304;
    SVG('line',{x1:x,y1:56,x2:x,y2:62,stroke:'rgba(255,255,255,.4)','stroke-width':1.4},ex.querySelector('#ex-t'));
    const t=SVG('text',{x,y:76,class:'anchor',style:'font-size:8px;fill:#55555c;font-weight:600;text-anchor:middle'},ex.querySelector('#ex-t'));
    t.textContent=(ev>0?'+':'')+ev; });
  dragify(ex.querySelector('#ex'),e=>{ const r=ex.querySelector('#ex').getBoundingClientRect();
    const t=clamp(((e.clientX-r.left)/r.width*320-8)/304,0,1);
    R.exposure=Math.round(0.1*Math.pow(40,t)*100)/100;
    R.clamp=Math.round(Math.pow(100,clamp(1-(e.clientY-r.top)/r.height,0,1))*10)/10; render(); });

  /* render path */
  const pg=document.createElement('div'); pg.className='card';
  pg.innerHTML=`${cardLabel('Render path','tap a stage to engage / bypass')}
    <div class="pathrow" id="pathrow">
      <button class="pathpill" data-k="gi"><i></i>BOUNCE<span id="pg-gi">GI · 2B</span></button>
      <button class="pathpill" data-k="aa"><i></i>JITTER<span id="pg-aa">AA · Halton</span></button>
      <button class="pathpill" data-k="ambientFloor"><i></i>FILL<span>ambient</span></button>
    </div>
    <div class="vstrip"><span class="big num" id="pg-v" style="font-size:15px">—</span><span class="u">path</span>
      <span class="meta" id="pg-m">—</span></div>`;
  host.appendChild(pg);
  pg.querySelectorAll('.pathpill').forEach(n=>n.addEventListener('click',()=>{
    const k=n.dataset.k; R[k]=!R[k]; render();
    toast(`${k==='gi'?'Global illumination':k==='aa'?'Anti-aliasing':'Ambient floor'} ${R[k]?'engaged':'bypassed'} — accumulation restarted`); }));
  /* bounce stack */
  const bs=document.createElement('div'); bs.className='card';
  bs.innerHTML=`${cardLabel('Bounce stack','drag vertically — GI depth')}
    <div class="plot" id="bstack"><svg viewBox="0 0 320 150" id="bs-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="bs-v">—</span><span class="u">GI bounces</span>
      <span class="meta" id="bs-m">—</span></div>`;
  host.appendChild(bs);
  const bsSvg=bs.querySelector('#bs-svg');
  dragify(bs.querySelector('#bstack'),e=>{ const r=bs.querySelector('#bstack').getBoundingClientRect();
    R.bounces=clamp(Math.round((118-(e.clientY-r.top)/r.height*150)/13)+1,1,8); render(); });

  /* fill ramp */
  const fl=document.createElement('div'); fl.className='card';
  fl.innerHTML=`${cardLabel('Fill ramp','drag — albedo × strength (auto-engages FILL)')}
    <div class="plot" id="fl" style="cursor:ew-resize"><svg viewBox="0 0 320 84">
      <defs><linearGradient id="flg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#b9b9c0"/></linearGradient></defs>
      <rect x="8" y="18" width="304" height="34" rx="17" fill="url(#flg)" stroke="rgba(255,255,255,.1)"/>
      <line id="fl-x" y1="10" y2="60" class="xhair" style="--ac:var(--rend)"/>
      <circle id="fl-d" r="8" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/></svg></div>
    <div class="vstrip"><span class="big num" id="fl-v">—</span><span class="u">ambient strength</span>
      <span class="meta">debug fill light</span></div>`;
  host.appendChild(fl);
  dragify(fl.querySelector('#fl'),e=>{ const r=fl.querySelector('#fl').getBoundingClientRect();
    R.ambient=Math.round(clamp(((e.clientX-r.left)/r.width*320-8)/304,0,1)*0.2*1000)/1000;
    if(!R.ambientFloor){R.ambientFloor=true;toast('Ambient floor engaged');} render(); });

  /* convergence chart */
  const cv=document.createElement('div'); cv.className='card';
  cv.innerHTML=`${cardLabel('Convergence','horizontal: inspect · vertical: target')}
    <div class="plot" id="cv" style="cursor:crosshair"><svg viewBox="0 0 320 140">
      <defs><linearGradient id="cvg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#5fd68a" stop-opacity=".4"/><stop offset="1" stop-color="#5fd68a" stop-opacity="0"/></linearGradient></defs>
      <path id="cv-a" fill="url(#cvg)"/><path id="cv-c" fill="none" stroke="#5fd68a" stroke-width="2"/>
      <line x1="8" y1="112" x2="312" y2="112" stroke="rgba(255,255,255,.12)"/>
      <circle cx="312" cy="12" r="5" fill="#5fd68a" style="filter:drop-shadow(0 0 6px #5fd68a)"/>
      <text x="312" y="30" class="axis" text-anchor="end">NOW · 256</text>
      <line id="cv-x" y1="8" y2="112" class="xhair" style="--ac:var(--rend)"/>
      <circle id="cv-d" r="5" fill="#0c0c0e" stroke="#fff" stroke-width="2"/>
      <line id="cv-t" y1="8" y2="112" stroke="#ffd166" stroke-width="1.6" stroke-dasharray="5 3"/>
      <circle id="cv-g" r="5" fill="#0c0c0e" stroke="#ffd166" stroke-width="2.5"/>
      <text x="10" y="128" class="axis">frame 1</text>
      <text x="230" y="128" class="axis">frame 256</text></svg></div>
    <div class="vstrip"><span class="big num" id="cv-v">—</span><span class="u">residual noise</span>
      <span class="meta" id="cv-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">ACCUMULATION</div><div class="v num">256<em> frames</em></div></div>
      <div class="kv"><div class="k">VIEWPORT</div><div class="v num">1280×720</div></div></div>`;
  host.appendChild(cv);
  const CX=n=>8+(n/256)*304,CY=n=>112-(1/Math.sqrt(n))*100;
  let cP='',cA='M 8 112 '; for(let n=1;n<=256;n+=2){ cP+=`${n===1?'M':'L'} ${CX(n).toFixed(1)} ${CY(n).toFixed(1)} `; cA+=`L ${CX(n).toFixed(1)} ${CY(n).toFixed(1)} `; }
  cv.querySelector('#cv-c').setAttribute('d',cP); cv.querySelector('#cv-a').setAttribute('d',cA+'L 312 112 Z');
  dragify(cv.querySelector('#cv'),e=>{ const r=cv.querySelector('#cv').getBoundingClientRect();
    R.inspectFrame=Math.round(clamp(((e.clientX-r.left)/r.width*320-8)/304,0,1)*255+1);
    R.accumTarget=Math.round(clamp(1-(e.clientY-r.top)/r.height,0,1)*255+1); render(); });

  function render(){
    const [hi,hf]=splitNum(R.candidates,0);
    hero.querySelector('#h-c').innerHTML=heroHTML(hi,hf,'/ px');
    hero.querySelector('#h-s').innerHTML=`<span class="delta-pill grn">M ${R.candidates} + ${R.spatial} passes · frame 256</span>`;
    dots.forEach((d,i)=>d.classList.toggle('on',i<R.candidates));
    mx.querySelector('#mx-v').textContent=R.candidates;
    mx.querySelector('#mx-m').innerHTML=`≈ ${R.candidates} shadow rays / px · ${R.sampler}`;
    pr.querySelector('#pr-v').textContent=R.spatial;
    for(let i=0;i<8;i++){ const s=pr.querySelector('#prs'+i);
      s.setAttribute('fill',i<R.spatial?'#5fd68a':'#222228');
      s.setAttribute('stroke',i<R.spatial?'#5fd68a':'rgba(255,255,255,.08)');
      s.style.filter=i<R.spatial?'drop-shadow(0 0 6px #5fd68a)':'none'; }
    pr.querySelector('#pr-t').textContent=R.candidates+R.spatial;
    const exx=8+exT(R.exposure)*304,ev=Math.log2(R.exposure);
    ex.querySelector('#ex-x').setAttribute('x1',exx); ex.querySelector('#ex-x').setAttribute('x2',exx);
    ex.querySelector('#ex-d').setAttribute('cx',exx); ex.querySelector('#ex-d').setAttribute('cy',41);
    ex.querySelector('#ex-v').textContent=R.exposure.toFixed(2);
    ex.querySelector('#ex-m').innerHTML=`${ev>=0?'+':''}${ev.toFixed(1)} EV · ACES · clamp ${R.clamp>=10?R.clamp.toFixed(0):R.clamp.toFixed(1)}`;
    const cly=56-Math.log10(Math.max(R.clamp,1))/2*30;
    ex.querySelector('#ex-cl').setAttribute('y1',cly); ex.querySelector('#ex-cl').setAttribute('y2',cly);
    ex.querySelector('#ex-ck').setAttribute('cy',cly);
    ex.querySelector('#ex-clb').setAttribute('y',cly-5);
    pg.querySelectorAll('.pathpill').forEach(n=>n.classList.toggle('on',!!R[n.dataset.k]));
    pg.querySelector('#pg-v').textContent=`${R.aa?'AA':''}${R.aa&&R.gi?' · ':''}${R.gi?'GI':''}${(R.aa||R.gi)&&R.ambientFloor?' · ':''}${R.ambientFloor?'FILL':''}`||'direct only';
    pg.querySelector('#pg-aa').textContent=`AA · ${R.sampler}`;
    pg.querySelector('#pg-gi').textContent=`GI · ${R.bounces}B`;
    pg.querySelector('#pg-m').innerHTML=R.gi?`${R.bounces} bounce${R.bounces>1?'es':''} + NEE`:'direct lighting only';
    /* bounce stack */
    let bsRows=`<rect x="8" y="126" width="304" height="12" rx="6" fill="#5fd68a"/><text x="160" y="135.5" text-anchor="middle" font-size="8" font-weight="700" fill="#0c0c0e">DIRECT</text>`;
    for(let bi=0;bi<8;bi++){ const bOn=bi<R.bounces, by=112-bi*13, bx=8+bi*6, bw=304-bi*12;
      bsRows+=`<rect x="${bx}" y="${by}" width="${bw}" height="10" rx="5" fill="${bOn?'#5fd68a':'none'}" opacity="${bOn?(1-bi*0.09).toFixed(2):1}" stroke="${bOn?'#5fd68a':'rgba(255,255,255,.15)'}"/>`
        +`<text x="160" y="${by+8}" text-anchor="middle" font-size="7.5" font-weight="700" fill="${bOn?'#0c0c0e':'rgba(255,255,255,.3)'}">B${bi+1}</text>`; }
    bsSvg.innerHTML=bsRows+`<text x="10" y="16" class="axis">DEPTH</text>`;
    bs.querySelector('#bstack').style.opacity=R.gi?1:.4;
    bs.querySelector('#bs-v').textContent=R.bounces;
    bs.querySelector('#bs-m').innerHTML=`direct + ${R.bounces}×NEE${R.gi?'':' · BOUNCE bypassed'}`;
    const flx=8+(R.ambient/0.2)*304;
    fl.querySelector('#fl-x').setAttribute('x1',flx); fl.querySelector('#fl-x').setAttribute('x2',flx);
    fl.querySelector('#fl-d').setAttribute('cx',flx); fl.querySelector('#fl-d').setAttribute('cy',35);
    fl.querySelector('#fl-v').textContent=R.ambient.toFixed(3);
    fl.querySelector('#fl').style.opacity=R.ambientFloor?1:.45;
    const n=R.inspectFrame;
    cv.querySelector('#cv-x').setAttribute('x1',CX(n)); cv.querySelector('#cv-x').setAttribute('x2',CX(n));
    cv.querySelector('#cv-d').setAttribute('cx',CX(n)); cv.querySelector('#cv-d').setAttribute('cy',CY(n));
    cv.querySelector('#cv-v').textContent=(100/Math.sqrt(n)).toFixed(1)+'%';
    const cvt=CX(R.accumTarget);
    cv.querySelector('#cv-t').setAttribute('x1',cvt); cv.querySelector('#cv-t').setAttribute('x2',cvt);
    cv.querySelector('#cv-g').setAttribute('cx',cvt); cv.querySelector('#cv-g').setAttribute('cy',CY(R.accumTarget));
    cv.querySelector('#cv-m').innerHTML=`frame ${n} of 256 · target ${R.accumTarget} · ${(100/Math.sqrt(R.accumTarget)).toFixed(1)}%`;
  }
  render();
}

/* ---------------- boot ---------------- */
buildOutliner();
buildInspector();
</script>
</body>
</html>
