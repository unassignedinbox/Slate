<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate — Inspector · Instruments Concept</title>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600&display=swap" rel="stylesheet">
<style>
/* ================================================================
   SLATE INSPECTOR — INSTRUMENTS. No sliders. No toggles.
   Every property is an interactive chart / diagram / gauge with a
   live value, honest units and metadata. Dark OLED card language
   from the reference images.
   ================================================================ */
:root{
  --bg:#060607;
  --panel:#0e0e10;
  --card:#141416;
  --card-2:#19191d;
  --inset:#1e1e22;
  --field:#000000;
  --raised:#26262c;
  --selected:#232329;
  --stroke:rgba(255,255,255,.07);
  --stroke-soft:rgba(255,255,255,.045);
  --text:#f4f4f5;
  --dim:#9a9aa0;
  --faint:#5b5b62;
  --sun:#f2c267;
  --cam:#7aa2ff;
  --mesh:#b79cff;
  --rend:#5fd68a;
  --danger:#f25555;
  --ok:#3ddc84;
  --r-card:22px;
  --r-pill:999px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --shadow:0 24px 70px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 700px at 70% -10%, #101014 0%, var(--bg) 55%) fixed, var(--bg);
  color:var(--text);
  font-family:'General Sans','Segoe UI',system-ui,sans-serif;
  font-size:14px; user-select:none; -webkit-font-smoothing:antialiased;
  display:flex; justify-content:center; padding:26px; min-height:100vh;
}
svg{display:block}
.num{font-variant-numeric:tabular-nums}
.top-wrap{display:flex; gap:22px; align-items:stretch; justify-content:center; flex-wrap:wrap}

/* ============================ OUTLINER ============================ */
.outliner{
  width:296px; flex-shrink:0; background:var(--panel);
  border:1px solid var(--stroke-soft); border-radius:28px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
  max-height:calc(100vh - 52px);
}
.ol-head{padding:22px 22px 14px; display:flex; align-items:center; gap:12px}
.ol-title{font-size:17px; font-weight:600; letter-spacing:.2px}
.count-pill{font-size:11.5px; font-weight:600; color:var(--dim); background:var(--inset);
  border:1px solid var(--stroke); padding:3px 11px; border-radius:var(--r-pill)}
.ol-search{margin:0 16px 12px; height:40px; border-radius:var(--r-pill); background:var(--field);
  border:1px solid var(--stroke); display:flex; align-items:center; gap:10px; padding:0 16px; color:var(--faint)}
.ol-search:focus-within{border-color:rgba(255,255,255,.16)}
.ol-search input{flex:1; min-width:0; background:none; border:none; outline:none; color:var(--text); font:inherit; font-size:13px}
.ol-search input::placeholder{color:var(--faint)}
.ol-body{flex:1; overflow-y:auto; padding:2px 12px 16px; display:flex; flex-direction:column; gap:2px}
.ol-body::-webkit-scrollbar,.insp-scroll::-webkit-scrollbar{width:0}
.ol-group{font-size:10.5px; font-weight:600; letter-spacing:1.6px; color:var(--faint); padding:14px 12px 7px}
.ol-item{position:relative; display:flex; align-items:center; gap:11px; padding:9px 12px 9px 14px;
  border-radius:14px; cursor:pointer; color:var(--dim); font-size:13.5px; font-weight:500;
  transition:background .14s var(--ease), color .14s var(--ease); border:1px solid transparent}
.ol-item:hover{background:rgba(255,255,255,.035); color:var(--text)}
.ol-item.sel{background:var(--selected); color:var(--text); border-color:var(--stroke)}
.ol-item.sel::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px;
  border-radius:2px; background:var(--ac,var(--text))}
.ol-dot{width:8px; height:8px; border-radius:50%; background:var(--ac,var(--faint)); flex-shrink:0}
.ol-item.sel .ol-dot{box-shadow:0 0 10px var(--ac,var(--faint))}
.ol-name{flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ol-tag{font-size:10px; font-weight:600; letter-spacing:.6px; color:var(--faint);
  background:rgba(255,255,255,.04); border:1px solid var(--stroke-soft); padding:2px 8px; border-radius:var(--r-pill)}
.ol-item.hidden{display:none}
.ol-foot{padding:12px 22px 18px; border-top:1px solid var(--stroke-soft); color:var(--faint);
  font-size:11.5px; display:flex; justify-content:space-between}
.ol-foot b{color:var(--dim); font-weight:600}

/* ============================ INSPECTOR ============================ */
.inspector{width:400px; flex-shrink:0; background:var(--panel); border:1px solid var(--stroke-soft);
  border-radius:28px; box-shadow:var(--shadow); display:flex; flex-direction:column; overflow:hidden;
  max-height:calc(100vh - 52px); position:relative}
.insp-scroll{flex:1; overflow-y:auto; padding:22px 20px 30px; display:flex; flex-direction:column; gap:16px}
.insp-head{display:flex; align-items:flex-start; gap:13px; padding:2px 4px 0}
.accent-tick{width:5px; align-self:stretch; min-height:44px; border-radius:3px;
  background:var(--ac,var(--text)); box-shadow:0 0 14px -2px var(--ac,var(--text))}
.insp-kicker{font-size:11px; font-weight:600; letter-spacing:1.8px; color:var(--faint); margin-bottom:3px}
.insp-title{font-size:21px; font-weight:600; letter-spacing:.2px}
.insp-sub{font-size:12px; color:var(--faint); margin-top:3px}
.insp-head .spacer{flex:1}
.live-dot{display:flex; align-items:center; gap:7px; font-size:11px; font-weight:600; color:var(--ok);
  background:rgba(61,220,132,.08); border:1px solid rgba(61,220,132,.22); padding:5px 12px; border-radius:var(--r-pill)}
.live-dot i{width:6px; height:6px; border-radius:50%; background:var(--ok); box-shadow:0 0 8px var(--ok); animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.45}}

.card{background:var(--card); border:1px solid var(--stroke-soft); border-radius:var(--r-card);
  padding:20px; position:relative}
.card.tight{padding:15px 20px}
.card-label{font-size:12px; font-weight:500; color:var(--dim); margin-bottom:2px}
.card-label .hint{float:right; color:var(--faint); font-size:11px}

/* hero numeral: bright integer, dim fraction + unit */
.hero{display:flex; align-items:baseline; gap:6px; margin:2px 0 4px}
.hero .int{font-size:52px; font-weight:200; letter-spacing:-1px; line-height:1}
.hero .frac{font-size:52px; font-weight:200; letter-spacing:-1px; line-height:1; color:#6d6d75}
.hero .unit{font-size:15px; font-weight:400; color:var(--faint); margin-left:2px}
.delta-pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
  padding:5px 13px; border-radius:var(--r-pill); margin-top:8px;
  background:rgba(255,255,255,.05); color:var(--dim); border:1px solid var(--stroke)}
.delta-pill.hot{background:rgba(242,194,103,.12); color:var(--sun); border-color:rgba(242,194,103,.25)}
.delta-pill.cool{background:rgba(122,162,255,.12); color:var(--cam); border-color:rgba(122,162,255,.25)}
.delta-pill.grn{background:rgba(95,214,138,.12); color:var(--rend); border-color:rgba(95,214,138,.25)}

/* preset buttons (functional shortcuts, not property editors) */
.seg-row{display:flex; gap:8px; margin-top:14px}
.seg-btn{flex:1; height:38px; border-radius:var(--r-pill); cursor:pointer; background:var(--field);
  border:1px solid var(--stroke); color:var(--dim); font:inherit; font-size:12.5px; font-weight:600;
  transition:all .15s var(--ease)}
.seg-btn:hover{color:var(--text); border-color:rgba(255,255,255,.16)}
.seg-btn.active{background:#f4f4f5; color:#111; border-color:transparent}

/* generic instrument frame */
.plot{background:var(--field); border:1px solid var(--stroke-soft); border-radius:16px;
  margin-top:10px; position:relative; overflow:hidden}
.plot svg{width:100%; height:auto}
.axis{font-size:8.5px; fill:#55555c; font-weight:600; letter-spacing:.4px}
.grid{stroke:rgba(255,255,255,.05); stroke-width:1}
.xhair{stroke:var(--ac,#f4f4f5); stroke-width:1.2; stroke-dasharray:3 3}

/* value strip under an instrument: live value + units + meta */
.vstrip{display:flex; align-items:baseline; gap:8px; margin-top:10px}
.vstrip .big{font-size:22px; font-weight:300}
.vstrip .u{font-size:12px; color:var(--faint)}
.vstrip .meta{margin-left:auto; font-size:11.5px; color:var(--faint); text-align:right}

/* ---- spectrum bar (reference: kelvin with swatch) ---- */
.kelvin-bar{position:relative; height:16px; border-radius:999px; cursor:ew-resize; touch-action:none;
  background:linear-gradient(90deg,#ff5a00 0%,#ff8c1a 12%,#ffb469 24%,#ffd9b0 36%,#fff4e6 46%,#ffffff 54%,#e8efff 66%,#cfdcff 82%,#b6ccff 100%)}
.kelvin-bar .kmark{position:absolute; top:-4px; left:var(--p,50%); width:2px; height:24px; background:#fff;
  transform:translateX(-50%); box-shadow:0 0 6px rgba(0,0,0,.8); pointer-events:none}
.kelvin-bar .kswatch{position:absolute; top:50%; left:var(--p,50%); width:22px; height:22px; border-radius:50%;
  transform:translate(-50%,-50%); border:2px solid #fff; box-shadow:0 2px 8px rgba(0,0,0,.6); pointer-events:none}
.kelvin-ticks{display:flex; justify-content:space-between; font-size:9px; color:var(--faint); margin-top:8px; font-weight:600}
/* ---- orbit hemisphere (reference: 3D orbit widget) ---- */
#orb-svg .og{stroke:rgba(255,255,255,.06)}
#orb-svg .ohz{fill:rgba(255,255,255,.02); stroke:rgba(255,255,255,.2)}
#orb-svg .oc{fill:rgba(255,255,255,.4); font-size:11px; text-anchor:middle}
#orb-svg .oc.n{fill:#fff}
#orb-svg .oarc{fill:none; stroke:rgba(255,255,255,.15); stroke-dasharray:3 4}
#orb-svg .odrop{stroke:rgba(255,255,255,.25); stroke-dasharray:2 3}
#orb-svg .ofoot{fill:rgba(255,255,255,.35)}
#orb-svg .osun{fill:#ffd166; filter:drop-shadow(0 0 6px #ffb454)}
#orb-svg .oglow{fill:rgba(255,180,84,.2)}
#orb-svg .dim{opacity:.3}
#orb-svg .ostat{fill:rgba(255,255,255,.4); font-size:10px; letter-spacing:.08em}
#orb-svg .ostat tspan{fill:#fff; font-size:12px}
/* ---- daylight ladder ---- */
.ladder{cursor:ew-resize; touch-action:none}
.ladder .anchor{font-size:8px; fill:#55555c; font-weight:600; text-anchor:middle}
.ladder .anchor b{fill:#8a8a92}

/* ---- penumbra ---- */
.penumbra{cursor:ew-resize; touch-action:none}

/* ---- attitude ball ---- */
.att-wrap{display:flex; gap:16px; align-items:center; margin-top:10px}
.att-ball{position:relative; width:132px; height:132px; border-radius:50%; overflow:hidden; flex-shrink:0;
  border:1px solid var(--stroke); cursor:move; touch-action:none; background:#101014}
.att-sky{position:absolute; left:-40%; width:180%; height:200%; top:-100%;
  background:linear-gradient(to bottom,#2b2b33 0%,#2b2b33 50%,#0c0c0e 50%,#0c0c0e 100%)}
.att-horizon{position:absolute; left:0; right:0; top:50%; height:2px; background:var(--cam);
  box-shadow:0 0 8px rgba(122,162,255,.7)}
.att-ladder{position:absolute; left:50%; top:50%; width:70px; margin-left:-35px}
.att-fixed{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none}
.att-fixed .wings{width:64px; height:10px; position:relative}
.att-fixed .wings::before,.att-fixed .wings::after{content:""; position:absolute; top:4px; width:22px; height:2px; background:#f4f4f5; border-radius:1px}
.att-fixed .wings::before{left:0}.att-fixed .wings::after{right:0}
.att-fixed .dot{position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px;
  border-radius:50%; background:var(--cam); box-shadow:0 0 8px var(--cam)}
.yawtape{height:26px; border-radius:13px; background:var(--field); border:1px solid var(--stroke-soft);
  overflow:hidden; position:relative; margin-top:10px}
.yawtape .strip{position:absolute; top:0; bottom:0; display:flex; align-items:center; gap:0; white-space:nowrap;
  font-size:10px; font-weight:600; color:var(--faint); letter-spacing:1px}
.yawtape .strip b{color:var(--text); font-weight:600}
.yawtape .caret{position:absolute; left:50%; top:0; bottom:0; width:2px; margin-left:-1px; background:var(--cam)}

/* ---- sample matrix ---- */
.matrix{display:grid; grid-template-columns:repeat(8,1fr); gap:9px; padding:16px; cursor:crosshair; touch-action:none}
.matrix i{aspect-ratio:1; border-radius:50%; background:#222228; border:1px solid rgba(255,255,255,.05);
  transition:transform .08s}
.matrix i.on{background:var(--rend); border-color:transparent; box-shadow:0 0 10px -1px var(--rend)}

/* ---- kv / stats ---- */
.stat-row{display:flex; align-items:center; padding:8px 0; border-bottom:1px dashed rgba(255,255,255,.07); font-size:13px}
.stat-row:last-child{border:none}
.stat-row .k{color:var(--dim)}
.stat-row .v{margin-left:auto; font-weight:600}
.swatch{width:14px; height:14px; border-radius:50%; display:inline-block; vertical-align:-2px;
  margin-right:8px; border:1px solid rgba(255,255,255,.2)}
.kv-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px}
.kv{background:var(--field); border:1px solid var(--stroke-soft); border-radius:14px; padding:10px 13px}
.kv .k{font-size:10px; font-weight:600; letter-spacing:1.2px; color:var(--faint)}
.kv .v{font-size:15px; font-weight:600; margin-top:2px}
.kv .v em{font-style:normal; font-size:11px; color:var(--faint); font-weight:500}

/* ---- render-path pills ---- */
.pathrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:10px}
.pathpill{border-radius:16px; border:1px solid var(--stroke); background:var(--field); color:var(--faint);
  padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer;
  font:inherit; font-size:11px; font-weight:700; letter-spacing:1px; transition:all .18s var(--ease)}
.pathpill span{font-size:10px; font-weight:500; letter-spacing:0; color:var(--faint)}
.pathpill i{width:8px; height:8px; border-radius:50%; background:var(--danger); box-shadow:0 0 8px var(--danger)}
.pathpill.on{color:var(--text); border-color:rgba(95,214,138,.45)}
.pathpill.on i{background:var(--rend); box-shadow:0 0 8px var(--rend)}
.pathpill.on span{color:var(--dim)}
/* ---- dome / dial / arc / fog / cone / wheel ---- */
#sky-dome{cursor:ns-resize; touch-action:none}
#ozone{cursor:ns-resize; touch-action:none}
#phdial,#transit,#pbright{cursor:grab; touch-action:none}
#fext,#fprof,#cone{cursor:crosshair; touch-action:none}
#twheel{cursor:grab; touch-action:none}

/* ---- material chips ---- */
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.sw-chip{display:inline-flex; align-items:center; gap:7px; border-radius:999px; border:1px solid var(--stroke);
  background:var(--field); color:var(--dim); font:inherit; font-size:11.5px; font-weight:600;
  padding:7px 13px 7px 9px; cursor:pointer; transition:all .15s var(--ease)}
.sw-chip:hover{color:var(--text); border-color:rgba(255,255,255,.25)}
.sw-chip.sel{color:var(--text); border-color:var(--mesh); box-shadow:0 0 0 1px var(--mesh)}
.sw-chip .swatch{width:14px; height:14px}

/* ---- buttons ---- */
.btn{height:42px; border-radius:var(--r-pill); border:1px solid var(--stroke); width:100%; cursor:pointer;
  background:var(--inset); color:var(--text); font:inherit; font-size:13.5px; font-weight:600;
  display:flex; align-items:center; justify-content:center; gap:9px; transition:all .14s var(--ease); margin-top:12px}
.btn:hover{background:var(--raised)}
.btn:active{transform:scale(.98)}
.btn.primary{background:#f4f4f5; color:#111; border-color:transparent}
.btn.primary:hover{background:#d7d7da}
.btn .ic{width:15px; height:15px}

/* toast */
.toast-stack{position:absolute; left:20px; right:20px; bottom:18px; display:flex; flex-direction:column;
  gap:8px; z-index:50; pointer-events:none}
.toast{background:rgba(20,20,24,.94); border:1px solid var(--stroke); border-radius:16px; padding:11px 16px;
  font-size:12.5px; font-weight:500; display:flex; gap:10px; align-items:center;
  box-shadow:0 12px 32px rgba(0,0,0,.6); animation:tin .25s var(--ease)}
.toast.out{opacity:0; transform:translateY(6px); transition:all .3s}
@keyframes tin{from{opacity:0; transform:translateY(8px)}}
.toast i{width:7px; height:7px; border-radius:50%; background:var(--ok); flex-shrink:0; box-shadow:0 0 8px var(--ok)}
</style>
</head>
<body>
<div class="top-wrap">

<aside class="outliner">
  <div class="ol-head"><div class="ol-title">Outliner</div><div class="count-pill" id="ol-count">–</div></div>
  <div class="ol-search">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input id="ol-filter" type="text" placeholder="Filter entries…" spellcheck="false">
  </div>
  <div class="ol-body" id="ol-body"></div>
  <div class="ol-foot"><span>Scene <b>CornellBox</b></span><span><b id="foot-tris">36</b> tris</span></div>
</aside>

<main class="inspector"><div class="insp-scroll" id="insp-scroll"></div><div class="toast-stack" id="toasts"></div></main>
</div>

<script>
/* ================================================================
   STATE — mirrors the engine records each instrument edits.
   ================================================================ */
const state = {
  selection: 'sun',
  sun:      { az: 142.5, el: 38.0, intensity: 32000, disk: 2.2, temp: 5600, diskVisible: true, limbDark: 0.6, day: 280, solarTime: 9.4 },
  sky:      { turbidity: 3.4, haze: 6.0, ozone: 300, albedo: 0.35, saturation: 1.0, cover: 2.0, cloudAlt: 2500 },
  moon:     { t: 22.4, phase: 0.62, gain: 1.0, distance: 384400, tintOffset: 0, earthshine: 0.15 },
  fog:      { sigma: 0.9, falloff: 12.0, base: 0, aniso: 0.7, albedo: 0.95 },
  spot:     { inner: 24, outer: 41, intensity: 900, temp: 3200, throw: 4.5, pos: [-1.6,-0.8,2.6], decay: 2, srcRadius: 4, range: 12, gelHue: 0, gelSat: 0 },
  camera:   { x: 0.0, y: -1.95, z: 1.0, pitch: 0.0, yaw: 0.0, fov: 55.0, speed: 2.5, fstop: 5.6, focus: 3.0, near: 0.05, far: 200 },
  renderer: { candidates: 8, spatial: 2, exposure: 1.05, gi: true, aa: true, ambientFloor: false, ambient: 0.015, inspectFrame: 256, bounces: 2, accumTarget: 64, clamp: 10, sampler: 'Halton' },
};
const CAM_DEF = { ...state.camera };

const MESHES = {
  floor:   { name:'Floor',     tag:'MESH',  tris:2,  mat:'Wall_White', albedo:'#c2c2c2', rough:.50, metal:0, emis:0,  xyz:[0,1.0,0],      sz:[2,2,0],          n:[0,0,1] },
  ceiling: { name:'Ceiling',   tag:'MESH',  tris:2,  mat:'Wall_White', albedo:'#c2c2c2', rough:.50, metal:0, emis:0,  xyz:[0,1.0,2.0],    sz:[2,2,0],          n:[0,0,-1] },
  wallL:   { name:'Wall_Left', tag:'MESH',  tris:2,  mat:'Wall_Red',   albedo:'#d91f1f', rough:.50, metal:0, emis:0,  xyz:[-1.0,1.0,1.0], sz:[0,2,2],          n:[1,0,0] },
  wallR:   { name:'Wall_Right',tag:'MESH',  tris:2,  mat:'Wall_Green', albedo:'#1fd926', rough:.50, metal:0, emis:0,  xyz:[1.0,1.0,1.0],  sz:[0,2,2],          n:[-1,0,0] },
  boxA:    { name:'Box_Tall',  tag:'MESH',  tris:12, mat:'Box_Warm',   albedo:'#c7c7c7', rough:.40, metal:0, emis:0,  xyz:[-0.35,1.35,0.6], sz:[0.56,0.56,1.2], n:[0,0,1] },
  boxB:    { name:'Box_Short', tag:'MESH',  tris:12, mat:'Box_Cool',   albedo:'#c7c7c7', rough:.40, metal:0, emis:0,  xyz:[0.35,0.75,0.3],  sz:[0.56,0.56,0.6], n:[0,0,1] },
  lamp:    { name:'Luminaire', tag:'LIGHT', tris:2,  mat:'Lamp_32lx',  albedo:'#ffffff', rough:.10, metal:0, emis:32, xyz:[0,1.0,1.995],   sz:[0.6,0.6,0],      n:[0,0,-1] },
};
const TOTAL_TRIS = Object.values(MESHES).reduce((a,m)=>a+m.tris,0);

const OUTLINER = [
  { group:'ENVIRONMENT' },
  { id:'sun', name:'Sun', tag:'DIR', accent:'var(--sun)' },
  { id:'sky', name:'Sky_Atmosphere', tag:'SKY', accent:'#8fc3ff' },
  { id:'moon', name:'Moon', tag:'MOON', accent:'#cdd7ff' },
  { id:'fog', name:'Height_Fog', tag:'FOG', accent:'#9fd8b4' },
  { group:'LIGHTS' },
  { id:'spot', name:'Key_Spot', tag:'SPOT', accent:'#ffb469' },
  { group:'VIEW' },
  { id:'camera', name:'Camera_Main', tag:'CAM', accent:'var(--cam)' },
  { group:'GEOMETRY' },
  ...Object.entries(MESHES).map(([id,m])=>({ id:'mesh:'+id, name:m.name, tag:m.tag, accent: m.tag==='LIGHT'?'var(--sun)':'var(--mesh)' })),
  { group:'ENGINE' },
  { id:'renderer', name:'Renderer', tag:'RST', accent:'var(--rend)' },
];

/* ---------------- helpers ---------------- */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const NS='http://www.w3.org/2000/svg';
function SVG(tag,attrs,parent){ const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function toast(msg){ const box=document.getElementById('toasts');
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`<i></i><span>${msg}</span>`; box.appendChild(el);
  setTimeout(()=>el.classList.add('out'),2400); setTimeout(()=>el.remove(),2800); }
function kelvinToRgb(k){ k=clamp(k,1800,12000)/100;
  const r=k<=66?255:clamp(329.698727446*Math.pow(k-60,-0.1332047592),0,255);
  const g=k<=66?clamp(99.4708025861*Math.log(k)-161.1195681661,0,255):clamp(288.1221695283*Math.pow(k-60,-0.0755148492),0,255);
  const b=k>=66?255:(k<=19?0:clamp(138.5177312231*Math.log(k-10)-305.0447927307,0,255));
  return [Math.round(r),Math.round(g),Math.round(b)]; }
const rgbCss=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function waveColor(l){ let r=0,g=0,b=0;
  if(l<440){r=-(l-440)/60;b=1;}else if(l<490){g=(l-440)/50;b=1;}
  else if(l<510){g=1;b=-(l-510)/20;}else if(l<580){r=(l-510)/70;g=1;}
  else if(l<645){r=1;g=-(l-645)/65;}else{r=1;}
  let f=1; if(l<420)f=.3+.7*(l-380)/40; else if(l>700)f=.3+.7*(780-l)/80;
  return [Math.round(r*255*f),Math.round(g*255*f),Math.round(b*255*f)]; }
function planckBars(T){ const out=[];
  for(let i=0;i<26;i++){ const l=380+i*(400/25);
    const x=1.4388e7/(l*T), b=Math.pow(l,-5)/(Math.exp(x)-1); out.push({l,b}); }
  const m=Math.max(...out.map(o=>o.b)); out.forEach(o=>o.h=o.b/m); return out; }
const wienPeak=T=>Math.round(2.8978e6/T);
const ev100=lux=>Math.log2(Math.max(lux,.01)/2.5);
const fmtLux=v=>v>=1000?(v/1000).toFixed(1)+'k':''+Math.round(v);
const sunDir=()=>{ const S=state.sun,a=S.az*Math.PI/180,e=S.el*Math.PI/180;
  return [Math.sin(a)*Math.cos(e),Math.cos(a)*Math.cos(e),Math.sin(e)]; };
const focalMM=fov=>12/Math.tan(fov*Math.PI/360);           /* 24 mm tall full-frame sensor, vertical FoV */
const fovFromFocal=f=>2*Math.atan(12/f)*180/Math.PI;
function lensClass(f){ return f<21?'ultra-wide':f<28?'wide':f<55?'normal':f<100?'short tele':'telephoto'; }
function heroHTML(i,f,u){ return `<div class="hero num"><span class="int">${i}</span><span class="frac">${f}</span><span class="unit">${u}</span></div>`; }
function splitNum(v,dec){ const s=v.toFixed(dec).split('.'); return [s[0],dec?'.'+s[1]:'']; }
function dragify(el,onMove){ let on=false;
  el.addEventListener('pointerdown',e=>{on=true;el.setPointerCapture(e.pointerId);onMove(e);});
  el.addEventListener('pointermove',e=>{if(on)onMove(e);});
  el.addEventListener('pointerup',()=>on=false); }
function headHTML(tick,kicker,title,sub){
  return `<div class="insp-head" style="--ac:${tick}"><div class="accent-tick"></div>
    <div><div class="insp-kicker">${kicker}</div><div class="insp-title">${title}</div><div class="insp-sub">${sub}</div></div>
    <div class="spacer"></div><div class="live-dot"><i></i>LIVE</div></div>`; }
function cardLabel(t,h){ return `<div class="card-label">${t}${h?` <span class="hint">${h}</span>`:''}</div>`; }
function hsv2rgb(h,s,v){ h=((h%360)+360)%360; const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;
  let r,g,b; if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;}else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
  return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]; }
function hexRGB(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }

/* ================================================================ OUTLINER */
function buildOutliner(){ const body=document.getElementById('ol-body'); body.innerHTML=''; let n=0;
  OUTLINER.forEach(e=>{
    if(e.group){ const g=document.createElement('div'); g.className='ol-group'; g.textContent=e.group; body.appendChild(g); return; }
    n++; const el=document.createElement('div');
    el.className='ol-item'+(state.selection===e.id?' sel':''); el.style.setProperty('--ac',e.accent);
    el.dataset.name=e.name.toLowerCase();
    el.innerHTML=`<span class="ol-dot"></span><span class="ol-name">${e.name}</span><span class="ol-tag">${e.tag}</span>`;
    el.addEventListener('click',()=>{ state.selection=e.id; buildOutliner(); buildInspector(); });
    body.appendChild(el); });
  document.getElementById('ol-count').textContent=n;
  document.getElementById('foot-tris').textContent=TOTAL_TRIS;
}
document.getElementById('ol-filter').addEventListener('input',e=>{
  const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll('.ol-item').forEach(it=>it.classList.toggle('hidden',!!q&&!it.dataset.name.includes(q)));
});
function buildInspector(){ const host=document.getElementById('insp-scroll'); host.innerHTML=''; host.scrollTop=0;
  const s=state.selection;
  if(s==='sun')pageSun(host); else if(s==='camera')pageCamera(host);
  else if(s==='sky')pageSky(host); else if(s==='moon')pageMoon(host);
  else if(s==='fog')pageFog(host); else if(s==='spot')pageSpot(host);
  else if(s==='renderer')pageRenderer(host); else if(s.startsWith('mesh:'))pageMesh(host,s.slice(5));
}

/* ================================================================ SUN */
const LADDER=[[50,'dim room'],[100,'room'],[500,'office'],[1000,'overcast'],[5000,'bright sky'],[20000,'open shade'],[60000,'direct sun'],[120000,'peak']];
const ladderT=v=>(Math.log(v)-Math.log(50))/(Math.log(120000)-Math.log(50));
const ladderV=t=>50*Math.pow(120000/50,t);
const ladderName=v=>{ let n=LADDER[0][1]; for(const [a,l] of LADDER) if(v>=a*.999) n=l; return n; };

const SOLAR_LAT=-26.2;
function solarPos(N,t){ const la=SOLAR_LAT*Math.PI/180;
  const dec=-23.44*Math.cos(2*Math.PI*(N+10)/365)*Math.PI/180, H=(t-12)*15*Math.PI/180;
  const cd=Math.cos(dec),sd=Math.sin(dec),cp=Math.cos(la),sp=Math.sin(la);
  const x=-cd*Math.sin(H), y=sd*cp-cd*Math.cos(H)*sp, z=sd*sp+cd*Math.cos(H)*cp;
  const el=Math.asin(clamp(z,-1,1))*180/Math.PI, az=(Math.atan2(x,y)*180/Math.PI+360)%360;
  const m=el>0?1/Math.sin(Math.max(el,0.5)*Math.PI/180):40, dayF=clamp((el+2)/4,0,1);
  return { az, el, lux:Math.round(135000*Math.exp(-0.25*m)*dayF),
    K:Math.round(clamp(1800+4200*clamp(Math.sin(Math.max(el,0)*Math.PI/180)*2.2,0,1),1800,12000)) }; }
function solarRiseSet(N){ const la=SOLAR_LAT*Math.PI/180;
  const dec=-23.44*Math.cos(2*Math.PI*(N+10)/365)*Math.PI/180, c=-Math.tan(la)*Math.tan(dec);
  if(c<=-1||c>=1)return [null,null];
  const H=Math.acos(c)*180/Math.PI/15; return [12-H,12+H]; }
function pageSun(host){ const S=state.sun;
  host.insertAdjacentHTML('beforeend',headHTML('var(--sun)','DIRECTIONAL LIGHT','Sun','orbit · disk · power · kelvin · shadow'));

  /* hero */
  const hero=document.createElement('div'); hero.className='card';
  hero.innerHTML=`${cardLabel('Azimuth','orbit below')}<div id="h-az"></div><div id="h-st"></div><div class="seg-row" id="pres"></div>`;
  host.appendChild(hero);
  const hAz=hero.querySelector('#h-az'), hSt=hero.querySelector('#h-st');
  const pres=hero.querySelector('#pres');
  [['Dawn',96,7,9000,2900],['Noon',178,64,80000,5600],['Golden',258,11,20000,3400],['Dusk',282,-3.5,2500,2300]]
    .forEach(([n,az,el,it,tp])=>{ const b=document.createElement('button'); b.className='seg-btn'; b.textContent=n;
      b.addEventListener('click',()=>{ Object.assign(S,{az,el,intensity:it,temp:tp});
        pres.querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active');
        render(); toast(`Sun preset “${n}” applied`); });
      pres.appendChild(b); });
  const dchip=document.createElement('button'); dchip.className='btn'; dchip.id='disk-chip'; dchip.style.marginTop='10px';
  hero.appendChild(dchip);
  const paintChip=()=>{ dchip.textContent=S.diskVisible?'◉ Solar disk — on':'○ Solar disk — off'; };
  dchip.addEventListener('click',()=>{ S.diskVisible=!S.diskVisible; paintChip();
    toast(S.diskVisible?'Solar disk enabled':'Solar disk hidden'); });
  paintChip();

  /* orbit hemisphere */
  const orb=document.createElement('div'); orb.className='card';
  orb.innerHTML=`${cardLabel('Orbit hemisphere','drag the sun over the plane')}
    <div class="plot" id="orb" style="cursor:grab"><svg viewBox="0 0 340 200" id="orb-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="orb-v">—</span><span class="u">az / el</span>
      <span class="meta" id="orb-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">DIRECTION (WORLD)</div>
      <div class="v num" id="orb-d" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">SUN STATE</div><div class="v num" id="orb-s" style="font-size:12px">—</div></div></div>`;
  host.appendChild(orb);
  const orbSvg=orb.querySelector('#orb-svg');
  const OP=(x,y,z)=>[170+x*140, 118-y*52-z*96];
  function orbPick(e){ const r=orbSvg.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*340, y=(e.clientY-r.top)/r.height*200;
    let ba=0, be=0, bd=1e12;
    for(let el=-20; el<=90; el+=2) for(let az=0; az<360; az+=3){
      const a=az*Math.PI/180, v=el*Math.PI/180;
      const [px,py]=OP(Math.sin(a)*Math.cos(v), Math.cos(a)*Math.cos(v), Math.sin(v));
      const d=(px-x)*(px-x)+(py-y)*(py-y); if(d<bd){ bd=d; ba=az; be=el; } }
    return [ba,be]; }
  dragify(orb.querySelector('#orb'),e=>{ const [a,el]=orbPick(e);
    S.az=Math.round(a*10)/10; S.el=Math.round(Math.max(-20,el)*10)/10; render(); });
  /* daylight ladder (intensity chart) */
  const pw=document.createElement('div'); pw.className='card';
  pw.innerHTML=`${cardLabel('Daylight power chart','drag the sun marker along the log scale')}
    <div class="plot ladder" id="ld"><svg viewBox="0 0 320 118">
      <defs><linearGradient id="ldg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f2c267" stop-opacity=".05"/><stop offset="1" stop-color="#f2c267" stop-opacity=".5"/></linearGradient></defs>
      <rect x="8" y="30" width="304" height="34" rx="17" fill="url(#ldg)"/>
      <rect x="8" y="30" width="304" height="34" rx="17" fill="none" stroke="rgba(255,255,255,.08)"/>
      <g id="ld-ticks"></g>
      <line id="ld-x" y1="22" y2="72" class="xhair" style="--ac:var(--sun)"/>
      <circle id="ld-dot" r="10" fill="#ffe9b8" stroke="#f2c267" stroke-width="3"
        style="filter:drop-shadow(0 0 10px rgba(242,194,103,.9))"/></svg></div>
    <div class="vstrip"><span class="big num" id="pw-v">—</span><span class="u" id="pw-u">lx</span>
      <span class="meta" id="pw-m">—</span></div>`;
  host.appendChild(pw);
  const ldt=pw.querySelector('#ld-ticks');
  LADDER.forEach(([v,l])=>{ const x=8+ladderT(v)*304;
    SVG('line',{x1:x,y1:64,x2:x,y2:70,stroke:'#55555c','stroke-width':1.4},ldt);
    const t=SVG('text',{x,y:82,class:'anchor'},ldt); t.textContent=v>=1000?(v/1000)+'k':v;
    const t2=SVG('text',{x,y:94,class:'anchor'},ldt); t2.innerHTML=''; t2.textContent=l; });
  const ldx=pw.querySelector('#ld-x'),ldd=pw.querySelector('#ld-dot');
  dragify(pw.querySelector('#ld'),e=>{ const r=pw.querySelector('#ld').getBoundingClientRect();
    S.intensity=Math.round(ladderV(clamp((e.clientX-r.left-8)/r.width*320/304,0,1)));
    render(); });

  /* penumbra diagram (disk size) */
  const pn=document.createElement('div'); pn.className='card';
  pn.innerHTML=`${cardLabel('Shadow diagram','horizontal: disk ⌀ · vertical: limb darkening')}
    <div class="plot penumbra" id="pn"><svg viewBox="0 0 320 168">
      <defs><linearGradient id="png" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f2c267" stop-opacity=".34"/><stop offset="1" stop-color="#f2c267" stop-opacity="0"/></linearGradient>
        <radialGradient id="pngd"><stop id="pn-s0" offset="0" stop-color="#fff6e2"/><stop id="pn-s1" offset="1" stop-color="#8f5e1e"/></radialGradient></defs>
      <polygon id="pn-pen" fill="url(#png)"/><polygon id="pn-umb" fill="rgba(0,0,0,.55)"/>
      <circle id="pn-disk" cx="54" cy="66" r="12" fill="url(#pngd)" stroke="#f2c267" stroke-width="2.5"
        style="filter:drop-shadow(0 0 10px rgba(242,194,103,.8))"/>
      <circle id="pn-handle" cx="66" cy="66" r="6" fill="#0c0c0e" stroke="#fff" stroke-width="2"/>
      <rect x="146" y="38" width="10" height="62" rx="3" fill="#3a3a42" stroke="rgba(255,255,255,.2)"/>
      <text x="151" y="116" class="axis" text-anchor="middle">occluder</text>
      <line x1="8" y1="140" x2="312" y2="140" stroke="rgba(255,255,255,.18)"/>
      <rect id="pn-band" x="200" y="133" width="80" height="7" rx="3.5" fill="rgba(0,0,0,.7)"/>
      <text x="12" y="24" class="axis">DISK ⌀ (drag)</text>
      <text x="308" y="24" class="axis" text-anchor="end">penumbra →</text></svg></div>
    <div class="vstrip"><span class="big num" id="pn-v">—</span><span class="u">° angular ⌀</span>
      <span class="meta" id="pn-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">LIMB DARKENING</div><div class="v num" id="pn-u" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">LIMB / CENTRE</div><div class="v num" id="pn-e" style="font-size:12px">—</div></div></div>`;
  host.appendChild(pn);
  dragify(pn.querySelector('#pn'),e=>{ const r=pn.querySelector('#pn').getBoundingClientRect();
    S.disk=Math.round(clamp((e.clientX-r.left)/r.width,0,1)*98+2)/10;
    S.limbDark=Math.round(clamp(1-(e.clientY-r.top)/r.height,0,1)*100)/100;
    render(); });

  /* spectrum bar */
  const KL=[[1850,'candle'],[2700,'tungsten'],[4000,'fluorescent'],[5600,'daylight D50'],[6500,'overcast D65'],[8000,'shade'],[10000,'blue sky']];
  const klName=v=>{ let n=KL[0][1]; for(const [a,l] of KL) if(v>=a) n=l; return n; };
  const bb=document.createElement('div'); bb.className='card';
  bb.innerHTML=`${cardLabel('Spectrum bar','drag — anchored to real sources')}
    <div class="plot" style="padding:16px 14px 12px"><div class="kelvin-bar" id="kloc"><i class="kmark"></i><span class="kswatch" id="ksw"></span></div>
      <div class="kelvin-ticks"><span>2000 candle</span><span>3200 tungsten</span><span>5800 sun</span><span>9000 shade</span><span>12000</span></div></div>
    <div class="vstrip"><span class="big num" id="bb-v">—</span><span class="u">K</span>
      <span class="meta" id="bb-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">MIRED · λ PEAK</div><div class="v num" id="bb-p" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">sRGB TINT</div><div class="v num" id="bb-t" style="font-size:12px">—</div></div></div>`;
  host.appendChild(bb);
  dragify(bb.querySelector('#kloc'),e=>{ const r=bb.querySelector('#kloc').getBoundingClientRect();
    S.temp=Math.round(clamp((e.clientX-r.left)/r.width,0,1)*10200+1800); render(); });

  /* solar time */
  const st=document.createElement('div'); st.className='card';
  st.innerHTML=`${cardLabel('Solar time','strip: day · dial: hour — syncs az/el/lux/K')}
    <div class="plot" id="sol-d"><svg viewBox="0 0 320 64">
      <defs><linearGradient id="solg" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#7aa2ff"/><stop offset=".25" stop-color="#9fd8b4"/><stop offset=".5" stop-color="#f2c267"/><stop offset=".75" stop-color="#c98a4b"/><stop offset="1" stop-color="#7aa2ff"/></linearGradient></defs>
      <rect x="10" y="12" width="300" height="22" rx="11" fill="url(#solg)" opacity=".85"/>
      <g id="sol-tk"></g>
      <circle id="sol-k" r="7" cy="23" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>
      <text x="10" y="52" class="axis">JAN</text><text x="310" y="52" class="axis" text-anchor="end">DEC</text></svg></div>
    <div class="plot" id="sol-h"><svg viewBox="0 0 320 150" id="sol-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="st-v">—</span><span class="u">solar time</span>
      <span class="meta" id="st-m">—</span></div>`;
  host.appendChild(st);
  const solX=d=>10+(d-1)/364*300;
  [[80,'MAR'],[172,'JUN'],[266,'SEP'],[355,'DEC']].forEach(([d,l])=>{
    SVG('line',{x1:solX(d),y1:12,x2:solX(d),y2:34,stroke:'rgba(255,255,255,.6)','stroke-width':1.6},st.querySelector('#sol-tk'));
    const t=SVG('text',{x:solX(d),y:52,class:'axis','text-anchor':'middle'},st.querySelector('#sol-tk')); t.textContent=l; });
  const applySolar=()=>{ const p=solarPos(S.day,S.solarTime);
    S.az=Math.round(p.az*10)/10; S.el=Math.round(p.el*10)/10; S.intensity=p.lux; S.temp=p.K; render(); };
  dragify(st.querySelector('#sol-d'),e=>{ const r=st.querySelector('#sol-d').getBoundingClientRect();
    S.day=Math.round(clamp(((e.clientX-r.left)/r.width*320-10)/300,0,1)*364+1); applySolar(); });
  const solSvg=st.querySelector('#sol-svg');
  dragify(st.querySelector('#sol-h'),e=>{ const r=st.querySelector('#sol-h').getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*320-160, y=(e.clientY-r.top)/r.height*150-75;
    let a=Math.atan2(x,-y); if(a<0)a+=2*Math.PI;
    S.solarTime=Math.round(a/(2*Math.PI)*24*12)/12; applySolar(); });

  /* disk physics */
  const dp=document.createElement('div'); dp.className='card';
  dp.innerHTML=`${cardLabel('Disk physics','read-only — derived from ⌀ + lux')}
    <div class="stat-row"><span class="k">Solid angle</span><span class="v num" id="dp-o">—</span></div>
    <div class="stat-row"><span class="k">Angular diameter</span><span class="v num" id="dp-a">—</span></div>
    <div class="stat-row"><span class="k">Implied luminance</span><span class="v num" id="dp-l">—</span></div>
    <div class="stat-row"><span class="k">Photon flux ≈</span><span class="v num" id="dp-p">—</span></div>`;
  host.appendChild(dp);
  /* -------- render -------- */
  function render(){
    const az=((S.az%360)+360)%360, [hi,hf]=splitNum(az,1);
    hAz.innerHTML=heroHTML(hi,hf,'°');
    hSt.innerHTML=`<span class="delta-pill ${S.el<0?'':'hot'}">${S.el<0?'▼ below horizon — night fill':'▲ elevation '+S.el.toFixed(1)+'° · '+(S.el>50?'high sun':S.el>15?'mid sun':'low sun')}</span>`;
    /* orbit */
    const sv=sunDir(), op=OP(sv[0],sv[1],sv[2]), gp=OP(sv[0],sv[1],0), up=S.el>0;
    let ogrid=''; for(let i=0;i<7;i++){ const t=-1+i/3;
      ogrid+=`<line x1="30" y1="${118+t*52}" x2="310" y2="${118+t*52}" class="og"/>`+
             `<line x1="${170+t*140}" y1="66" x2="${170+t*140}" y2="170" class="og"/>`; }
    const ocomp=[['N',0,1.14,0],['E',1.14,0,0],['S',0,-1.14,0],['W',-1.14,0,0]].map(([n,x,y,z])=>{
      const [px,py]=OP(x,y,z); return `<text x="${px.toFixed(1)}" y="${(py+4).toFixed(1)}" class="oc${n==='N'?' n':''}">${n}</text>`; }).join('');
    let oarc=''; for(let e=0;e<=90;e+=5){ const a=S.az*Math.PI/180, v=e*Math.PI/180;
      const [px,py]=OP(Math.sin(a)*Math.cos(v), Math.cos(a)*Math.cos(v), Math.sin(v));
      oarc+=`${e?'L':'M'}${px.toFixed(1)},${py.toFixed(1)}`; }
    const azr=((S.az%360)+360)%360;
    orbSvg.innerHTML=`<defs><clipPath id="ocl"><ellipse cx="170" cy="118" rx="140" ry="52"/></clipPath></defs>
      <ellipse cx="170" cy="118" rx="140" ry="52" class="ohz"/><g clip-path="url(#ocl)">${ogrid}</g>${ocomp}
      <path d="${oarc}" class="oarc"/>
      <line x1="${gp[0].toFixed(1)}" y1="${gp[1].toFixed(1)}" x2="${op[0].toFixed(1)}" y2="${op[1].toFixed(1)}" class="odrop"/>
      <ellipse cx="${gp[0].toFixed(1)}" cy="${gp[1].toFixed(1)}" rx="5" ry="2" class="ofoot"/>
      <circle cx="${op[0].toFixed(1)}" cy="${op[1].toFixed(1)}" r="15" class="oglow${up?'':' dim'}"/>
      <circle cx="${op[0].toFixed(1)}" cy="${op[1].toFixed(1)}" r="7" class="osun${up?'':' dim'}"/>
      <text x="10" y="18" class="ostat">EL <tspan>${S.el>=0?'+':''}${S.el.toFixed(1)}°</tspan></text>
      <text x="10" y="34" class="ostat">AZ <tspan>${azr.toFixed(0)}°</tspan></text>`;
    orb.querySelector('#orb-v').textContent=`${azr.toFixed(1)}° / ${S.el.toFixed(1)}°`;
    orb.querySelector('#orb-m').innerHTML=up?'above horizon':'below horizon';
    orb.querySelector('#orb-d').textContent=`${sv[0].toFixed(2)} ${sv[1].toFixed(2)} ${sv[2].toFixed(2)}`;
    orb.querySelector('#orb-s').textContent=S.el<0?'night':S.el>50?'high sun':S.el>15?'mid sun':'golden hour';
    /* ladder */
    const lx=8+ladderT(S.intensity)*304;
    ldx.setAttribute('x1',lx); ldx.setAttribute('x2',lx);
    ldd.setAttribute('cx',lx); ldd.setAttribute('cy',47);
    pw.querySelector('#pw-v').textContent=fmtLux(S.intensity);
    pw.querySelector('#pw-u').textContent=S.intensity>=1000?'k lx':'lx';
    pw.querySelector('#pw-m').innerHTML=`EV100 ${ev100(S.intensity).toFixed(1)} · ≈ ${ladderName(S.intensity)}`;
    /* penumbra */
    const r=5+(S.disk-0.2)/9.8*24, dc=pn.querySelector('#pn-disk');
    dc.setAttribute('r',r);
    pn.querySelector('#pn-handle').setAttribute('cx',54+r);
    const ray=(y0,y1)=>{ const m=(y1-y0)/(151-54); return y0+m*(312-54); };
    const yT=ray(66-r,38),yB=ray(66+r,100), yTi=ray(66-r,100),yBi=ray(66+r,38);
    pn.querySelector('#pn-pen').setAttribute('points',`156,38 156,100 312,${yB} 312,${yT}`);
    pn.querySelector('#pn-umb').setAttribute('points',`156,50 156,88 312,${yBi} 312,${yTi}`);
    const band=pn.querySelector('#pn-band');
    band.setAttribute('x',236-r*3.2); band.setAttribute('width',40+r*6.4);
    pn.querySelector('#pn-v').textContent=S.disk.toFixed(1);
    const lbf=1-0.75*S.limbDark;
    pn.querySelector('#pn-s1').setAttribute('stop-color',rgbCss([Math.round(255*lbf),Math.round(190*lbf),Math.round(110*lbf)]));
    pn.querySelector('#pn-u').textContent=`u ${S.limbDark.toFixed(2)}`;
    pn.querySelector('#pn-e').textContent=`${(lbf*100).toFixed(0)}%`;
    pn.querySelector('#pn-m').innerHTML=S.disk<1?'hard-edged shadows':S.disk<4?'soft penumbra':'very soft · overcast-like';
    /* spectrum */
    const kfrac=clamp((S.temp-1800)/10200,0,1);
    bb.querySelector('#kloc').style.setProperty('--p',(kfrac*100)+'%');
    const tc=kelvinToRgb(S.temp);
    bb.querySelector('#ksw').style.background=rgbCss(tc);
    bb.querySelector('#bb-v').textContent=Math.round(S.temp);
    bb.querySelector('#bb-m').innerHTML=`≈ ${klName(S.temp)}`;
    bb.querySelector('#bb-t').innerHTML=`<span class="swatch" style="background:${rgbCss(tc)}"></span>${tc[0]} ${tc[1]} ${tc[2]}`;
    bb.querySelector('#bb-p').textContent=`${Math.round(1e6/S.temp)} · ${wienPeak(S.temp)} nm`;
    /* solar */
    st.querySelector('#sol-k').setAttribute('cx',solX(S.day));
    const [sRise,sSet]=solarRiseSet(S.day);
    const sPt=(h,r)=>[160+r*Math.sin(h/24*2*Math.PI),75-r*Math.cos(h/24*2*Math.PI)];
    let sTicks='';
    for(let h=0;h<24;h+=3){ const [tx,ty]=sPt(h,52),[ux,uy]=sPt(h,62);
      sTicks+=`<line x1="${tx.toFixed(1)}" y1="${ty.toFixed(1)}" x2="${ux.toFixed(1)}" y2="${uy.toFixed(1)}" stroke="rgba(255,255,255,.3)" stroke-width="2"/>`
        +`<text x="${sPt(h,42)[0].toFixed(1)}" y="${(sPt(h,42)[1]+3).toFixed(1)}" class="axis" text-anchor="middle">${String(h).padStart(2,'0')}</text>`; }
    let dayArc='';
    if(sRise!==null){ dayArc=`M ${sPt(sRise,57).map(v=>v.toFixed(1)).join(' ')} A 57 57 0 ${(sSet-sRise)>12?1:0} 1 ${sPt(sSet,57).map(v=>v.toFixed(1)).join(' ')}`; }
    const [kx,ky]=sPt(S.solarTime,57);
    solSvg.innerHTML=`<circle cx="160" cy="75" r="62" fill="none" stroke="rgba(255,255,255,.12)"/>${sTicks}`
      +(dayArc?`<path d="${dayArc}" fill="none" stroke="#f2c267" stroke-width="5" stroke-linecap="round"/>`:'')
      +(sRise!==null?`<circle cx="${sPt(sRise,57)[0].toFixed(1)}" cy="${sPt(sRise,57)[1].toFixed(1)}" r="3.4" fill="#f2c267"/><circle cx="${sPt(sSet,57)[0].toFixed(1)}" cy="${sPt(sSet,57)[1].toFixed(1)}" r="3.4" fill="#f2c267"/>`:'')
      +`<line x1="160" y1="75" x2="${kx.toFixed(1)}" y2="${ky.toFixed(1)}" stroke="rgba(255,255,255,.3)"/>
      <circle cx="${kx.toFixed(1)}" cy="${ky.toFixed(1)}" r="6.5" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>
      <text x="160" y="79" text-anchor="middle" fill="#f4f4f5" font-size="15" font-weight="600" class="num">${fmtT(S.solarTime)}</text>`;
    st.querySelector('#st-v').textContent=fmtT(S.solarTime);
    st.querySelector('#st-m').innerHTML=`day ${S.day} · ↑${sRise!==null?fmtT(sRise):'—'} ↓${sSet!==null?fmtT(sSet):'—'} · φ −26.2°`;
    /* disk physics */
    const sOm=2*Math.PI*(1-Math.cos(S.disk/2*Math.PI/180)), sLum=S.el>0?S.intensity/(sOm*Math.sin(Math.max(S.el,0.5)*Math.PI/180)):0;
    dp.querySelector('#dp-o').textContent=`${(sOm*1e6).toFixed(0)} µsr`;
    dp.querySelector('#dp-a').textContent=`${(S.disk*60).toFixed(1)} arcmin`;
    dp.querySelector('#dp-l').textContent=S.el>0?(sLum>=1e9?`${(sLum/1e9).toFixed(2)} Gcd/m²`:`${(sLum/1e6).toFixed(1)} Mcd/m²`):'— night';
    dp.querySelector('#dp-p').textContent=`${(S.intensity*0.0003).toFixed(2)} ×10²⁰ /s/m²`;

  }
  render();
}

/* ================================================================ CAMERA */
function pageCamera(host){ const C=state.camera;

  dragify(lens.querySelector('#lz'),e=>{ const r=lens.querySelector('#lz').getBoundingClientRect();

    const t=clamp((232-x)/162,0,1),f=8.4*Math.pow(68/8.4,t);

  /* attitude ball */

    <div class="att-wrap"><div class="att-ball" id="ab"><div class="att-sky" id="ab-s">
      <div class="att-horizon"></div></div>
      <div class="att-fixed"><div class="wings"></div><div class="dot"></div></div></div>
      <div class="dial-side"><div class="row"><span class="k">Pitch</span><span class="v num" id="ab-p">—</span></div>
        <div class="row"><span class="k">Yaw</span><span class="v num" id="ab-y">—</span></div>
        <div class="row"><span class="k">Looking</span><span class="v num" id="ab-l">—</span></div></div></div>
    <div class="yawtape"><div class="strip" id="yt-s"></div><div class="caret"></div></div>`;
  host.appendChild(att);
  const ytS=att.querySelector('#yt-s');
  let tape=''; for(let d=-360;d<=360;d+=15){ const w=((d%360)+360)%360;
    const lab=w===0?'N':w===90?'E':w===180?'S':w===270?'W':(w%45===0?['NE','SE','SW','NW'][(w/45|0)>>0&w/45===1?0:w/45===3?1:w/45===5?2:3]:w+'°');
    tape+=`<span style="display:inline-block;width:30px;text-align:center;${w%90===0?'<b>'.length&&'font-weight:700;color:#f4f4f5':''}">${w%90===0?'<b>'+lab+'</b>':lab}</span>`; }
  ytS.innerHTML=tape;
  const abEl=att.querySelector('#ab'); let lx=0,ly=0,ad=false;
  abEl.addEventListener('pointerdown',e=>{ad=true;lx=e.clientX;ly=e.clientY;abEl.setPointerCapture(e.pointerId);});
  abEl.addEventListener('pointermove',e=>{ if(!ad)return;
    C.yaw=((C.yaw+(e.clientX-lx)*.35+540)%360)-180;
    C.pitch=clamp(C.pitch-(e.clientY-ly)*.3,-89,89);

  abEl.addEventListener('pointerup',()=>ad=false);

  /* speedometer */
  const spd=document.createElement('div'); spd.className='card';
  spd.innerHTML=`${cardLabel('Flight speedometer','drag along the arc · ⇧ boost ×3 in-engine')}
    <div class="plot" id="sm" style="cursor:grab"><svg viewBox="0 0 320 168">
      <path id="sm-bg" fill="none" stroke="#26262c" stroke-width="12" stroke-linecap="round"/>
      <path id="sm-fg" fill="none" stroke="#7aa2ff" stroke-width="12" stroke-linecap="round"
        style="filter:drop-shadow(0 0 8px rgba(122,162,255,.6))"/>
      <g id="sm-tk"></g><line id="sm-nd" stroke="#f4f4f5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="160" cy="128" r="7" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>
      <text x="160" y="112" text-anchor="middle" fill="#f4f4f5" font-size="24" font-weight="200" class="num" id="sm-v">2.5</text>
      <text x="160" y="160" text-anchor="middle" class="axis">M / S</text></svg></div>
    <div class="vstrip"><span class="big num" id="sm-b">—</span><span class="u">m/s with ⇧ boost</span>
      <span class="meta" id="sm-m">—</span></div>`;
  host.appendChild(spd);
  const pol=(a,r)=>[160+Math.cos(a*Math.PI/180)*r,128+Math.sin(a*Math.PI/180)*r];
  const arcPath=(a0,a1,r)=>{ const [x0,y0]=pol(a0,r),[x1,y1]=pol(a1,r);
    return `M ${x0} ${y0} A ${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1} ${y1}`; };
  spd.querySelector('#sm-bg').setAttribute('d',arcPath(150,390,84));
  const smTk=spd.querySelector('#sm-tk');
  for(let v=0;v<=12;v+=2){ const a=150+(v/12)*240,[x0,y0]=pol(a,70),[x1,y1]=pol(a,78);
    SVG('line',{x1:x0,y1:y0,x2:x1,y2:y1,stroke:'#55555c','stroke-width':2},smTk);
    const [tx,ty]=pol(a,60),t=SVG('text',{x:tx,y:ty+3,class:'axis','text-anchor':'middle'},smTk); t.textContent=v; }
  dragify(spd.querySelector('#sm'),e=>{ const r=spd.querySelector('#sm').getBoundingClientRect();
    const dx=e.clientX-(r.left+r.width/2),dy=(e.clientY-r.top)/r.height*168-128;
    let a=Math.atan2(dy,dx)*180/Math.PI; if(a<0)a+=360;
    let t;
    if(a>=150) t=(a-150)/240; else if(a<=30) t=(a+210)/240; else t=(a<90)?1:0;
    C.speed=Math.round((0.1+clamp(t,0,1)*11.9)*100)/100; render(); });

  const meta=document.createElement('div'); meta.className='card tight';
  meta.innerHTML=`<div class="stat-row"><span class="k">Position</span><span class="v num" id="m-p" style="font-size:12px">—</span></div>
    <div class="stat-row"><span class="k">Near plane</span><span class="v num" id="m-n">0.05 m</span></div>
    <div class="stat-row"><span class="k">Far plane</span><span class="v num" id="m-a">200 m</span></div>
    <div class="stat-row"><span class="k">Aspect</span><span class="v num">16 : 9 · auto</span></div>
    <div class="stat-row"><span class="k">Forward</span><span class="v num" id="m-f" style="font-size:12px">—</span></div>
    <button class="btn" id="cam-r"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Reset camera</button>`;
  host.appendChild(meta);
  meta.querySelector('#cam-r').addEventListener('click',()=>{ Object.assign(C,CAM_DEF); render(); toast('Camera reset to the Cornell view'); });

  /* aperture iris */
  const ir=document.createElement('div'); ir.className='card';
  ir.innerHTML=`${cardLabel('Aperture iris','drag in / out — f-stop')}
    <div class="plot" id="iris"><svg viewBox="0 0 200 168" id="ir-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="ir-v">—</span><span class="u">f-stop</span>
      <span class="meta" id="ir-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">ENTRANCE PUPIL</div><div class="v num" id="ir-p" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">NEAREST STANDARD</div><div class="v num" id="ir-s" style="font-size:12px">—</div></div></div>`;
  host.appendChild(ir);
  const irSvg=ir.querySelector('#ir-svg'), irEl=ir.querySelector('#iris');
  dragify(irEl,e=>{ const r=irEl.getBoundingClientRect();

    render(); });

  /* focus rail */
  const fr=document.createElement('div'); fr.className='card';
  fr.innerHTML=`${cardLabel('Focus rail','knob: focus · flags: clip planes')}
    <div class="plot" id="frail"><svg viewBox="0 0 320 118" id="fr-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="fr-v">—</span><span class="u">m focus</span>
      <span class="meta" id="fr-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">DOF NEAR – FAR</div><div class="v num" id="fr-d" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">HYPERFOCAL</div><div class="v num" id="fr-h" style="font-size:12px">—</div></div></div>`;
  host.appendChild(fr);
  const frSvg=fr.querySelector('#fr-svg'), frEl=fr.querySelector('#frail');
  const frX=d=>10+(Math.log10(clamp(d,0.1,50))-Math.log10(0.1))/(Math.log10(50)-Math.log10(0.1))*300;
  let frMode=null;

    const [nx,ny]=pol(sa,58);
    const nd=spd.querySelector('#sm-nd');
    nd.setAttribute('x1',160);nd.setAttribute('y1',128);nd.setAttribute('x2',nx);nd.setAttribute('y2',ny);
    spd.querySelector('#sm-v').textContent=C.speed.toFixed(1);
    spd.querySelector('#sm-b').textContent=(C.speed*3).toFixed(1);
    spd.querySelector('#sm-m').innerHTML=C.speed<2?'dolly · precise':C.speed<6?'walk · cruise':'fly · traverse';
    /* meta */
    const pr=C.pitch*Math.PI/180,yw=C.yaw*Math.PI/180;
    meta.querySelector('#m-f').textContent=
      `${(Math.sin(yw)*Math.cos(pr)).toFixed(2)} ${(Math.cos(yw)*Math.cos(pr)).toFixed(2)} ${Math.sin(pr).toFixed(2)}`;
    meta.querySelector('#m-p').textContent=`${C.x.toFixed(2)} · ${C.y.toFixed(2)} · ${C.z.toFixed(2)} m`;
    meta.querySelector('#m-n').textContent=`${C.near} m`;
    meta.querySelector('#m-a').textContent=C.far>=1000?`${(C.far/1000).toFixed(1)} km`:`${C.far} m`;
    /* iris */
    const irFrac=(Math.log(22)-Math.log(C.fstop))/(Math.log(22)-Math.log(1.2));
    const irR=8+irFrac*60, irRot=irFrac*30*Math.PI/180;
    let irHex='';

      irHex+=`${i?'L':'M'} ${(100+irR*Math.cos(ia)).toFixed(1)} ${(84+irR*Math.sin(ia)).toFixed(1)} `; }
    const irStd=[1.2,1.4,2,2.8,4,5.6,8,11,16,22].reduce((a,b)=>Math.abs(b-C.fstop)<Math.abs(a-C.fstop)?b:a);
    irSvg.innerHTML=`
      <circle cx="100" cy="84" r="78" fill="#101014" stroke="rgba(255,255,255,.15)"/>
      <circle cx="100" cy="84" r="70" fill="none" stroke="rgba(255,255,255,.08)"/>

      <text x="100" y="89" text-anchor="middle" fill="#f4f4f5" font-size="17" font-weight="600" class="num">f/${C.fstop}</text>
      <circle cx="100" cy="${(84-irR).toFixed(1)}" r="5.5" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>`;
    ir.querySelector('#ir-v').textContent=`f/${C.fstop}`;
    ir.querySelector('#ir-m').innerHTML=irFrac>0.66?'wide open · thin DoF':irFrac>0.33?'mid · versatile':'stopped down · deep DoF';
    ir.querySelector('#ir-p').textContent=`${(f/C.fstop).toFixed(1)} mm`;
    ir.querySelector('#ir-s').textContent=`f/${irStd}`;
    /* focus rail */
    const Hmm=f*f/(C.fstop*0.029), Hm=Hmm/1000, Dmm=C.focus*1000;
    const dNear=Dmm*Hmm/(Hmm+Dmm)/1000, dFar=Dmm<Hmm?Dmm*Hmm/(Hmm-Dmm)/1000:Infinity;
    const frNX=frX(C.near), frFX=frX(C.far), frHx=Hm<=50?frX(Math.max(Hm,0.1)):null;
    frSvg.innerHTML=`
      <line x1="10" y1="70" x2="310" y2="70" stroke="rgba(255,255,255,.2)" stroke-width="3" stroke-linecap="round"/>
      <rect x="${frX(dNear).toFixed(1)}" y="60" width="${Math.max(frX(Math.min(dFar,50))-frX(dNear),2).toFixed(1)}" height="20" rx="6" fill="rgba(122,162,255,.25)"/>
      ${frHx!==null?`<line x1="${frHx.toFixed(1)}" y1="56" x2="${frHx.toFixed(1)}" y2="84" stroke="rgba(255,255,255,.4)" stroke-dasharray="3 3"/><text x="${frHx.toFixed(1)}" y="95" class="axis" text-anchor="middle">H</text>`:''}
      <polygon points="${frNX.toFixed(1)},14 ${(frNX-8).toFixed(1)},30 ${(frNX+8).toFixed(1)},30" fill="#7aa2ff"/>
      <line x1="${frNX.toFixed(1)}" y1="30" x2="${frNX.toFixed(1)}" y2="58" stroke="#7aa2ff" stroke-dasharray="3 3"/>
      <polygon points="${frFX.toFixed(1)},14 ${(frFX-8).toFixed(1)},30 ${(frFX+8).toFixed(1)},30" fill="#7aa2ff"/>
      <line x1="${frFX.toFixed(1)}" y1="30" x2="${frFX.toFixed(1)}" y2="58" stroke="#7aa2ff" stroke-dasharray="3 3"/>
      <text x="10" y="108" class="axis">0.1</text><text x="121" y="108" class="axis">1</text><text x="232" y="108" class="axis">10</text><text x="310" y="108" class="axis" text-anchor="end">50 m</text>
      <circle cx="${frX(C.focus).toFixed(1)}" cy="70" r="8" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>`;
    fr.querySelector('#fr-v').textContent=C.focus.toFixed(2);
    fr.querySelector('#fr-m').innerHTML=`f/${C.fstop} · ${f.toFixed(0)} mm full-frame`;
    fr.querySelector('#fr-d').textContent=`${dNear.toFixed(2)} – ${dFar===Infinity?'∞':dFar.toFixed(2)} m`;
    fr.querySelector('#fr-h').textContent=`${Hm>=100?Hm.toFixed(0):Hm.toFixed(1)} m`;
  }
  render();
}

/* ================================================================ MESH / LUMINAIRE */
function pageMesh(host,id){ const m=MESHES[id],isLamp=m.tag==='LIGHT';

        <div class="kv"><div class="k">FLUX ≈ π·L·A</div><div class="v num" id="fo-fl">—</div></div></div>`;
    host.appendChild(fo);
    const E=d=>m.emis*0.36/(d*d+0.02),X=d=>10+(d-0.2)/2.8*300,Ymax=()=>Math.max(200,E(0.2)*1.1),Y=e=>122-clamp(e/Ymax(),0,1)*112;
    let fd=1.0; const emis0=m.emis;
    const renderFo=()=>{ let cp='',ap='M 10 122 ';
      for(let d=0.2;d<=3.001;d+=0.05){ cp+=`${d===0.2?'M':'L'} ${X(d).toFixed(1)} ${Y(E(d)).toFixed(1)} `; ap+=`L ${X(d).toFixed(1)} ${Y(E(d)).toFixed(1)} `; }
      fo.querySelector('#fo-c').setAttribute('d',cp); fo.querySelector('#fo-a').setAttribute('d',ap+'L 310 122 Z');
      fo.querySelector('#fo-x').setAttribute('x1',X(fd)); fo.querySelector('#fo-x').setAttribute('x2',X(fd));
      fo.querySelector('#fo-d').setAttribute('cx',X(fd)); fo.querySelector('#fo-d').setAttribute('cy',Y(E(fd)));
      fo.querySelector('#fo-v').textContent=E(fd)>=1000?(E(fd)/1000).toFixed(1)+'k':E(fd).toFixed(1);
      fo.querySelector('#fo-m').innerHTML=`at ${fd.toFixed(2)} m · L ${m.emis} lx`;
      fo.querySelector('#fo-eq').textContent=`E(d) = ${(m.emis*0.36).toFixed(2)} / d²`;
      fo.querySelector('#fo-fl').innerHTML=`≈${Math.round(Math.PI*m.emis*0.36)}<em> lm</em>`; };
    const foEl=fo.querySelector('#fo'); let foOn=false;
    foEl.addEventListener('pointerdown',e=>{ foOn=true; foEl.setPointerCapture(e.pointerId); foMove(e); });

    foEl.addEventListener('pointerup',()=>{ foOn=false; if(m.emis!==emis0)buildInspector(); });
    function foMove(e){ const r=foEl.getBoundingClientRect();
      fd=Math.round((0.2+clamp(((e.clientX-r.left)/r.width*320-10)/300,0,1)*2.8)*100)/100;

  } else {

  }

  /* material chips */
  const mc=document.createElement('div'); mc.className='card';

    <div class="chip-row" id="mc-fi"></div>
    <div class="chip-row" id="mc-co"></div>`;
  host.appendChild(mc);
  const mkChip=(row,txt,val,sel,fn,sw)=>{ const b=document.createElement('button');
    b.className='sw-chip'+(sel?' sel':'');
    b.innerHTML=`${sw?`<span class="swatch" style="background:${sw}"></span>`:''}${txt}`;
    b.addEventListener('click',()=>{ fn(val); buildInspector(); toast(`${m.name}: ${txt} assigned`); });
    mc.querySelector(row).appendChild(b); };
  [['Studio','#c7c7c7'],['Porcelain','#f2f4f6'],['Brick','#d91f1f'],['Moss','#1fd926'],['Ochre','#e0a458'],['Slate','#5a8ae0'],['Void','#151517']]
    .forEach(([t,v])=>mkChip('#mc-al',t,v,m.albedo.toLowerCase()===v,v2=>m.albedo=v2,v));
  [['Matte',0.9],['Satin',0.6],['Semi-gloss',0.4],['Gloss',0.2],['Mirror',0.05]]
    .forEach(([t,v])=>mkChip('#mc-fi',t,v,Math.abs(m.rough-v)<0.03,v2=>m.rough=v2));
  [['Dielectric',0],['Metal',1]]
    .forEach(([t,v])=>mkChip('#mc-co',t,v,m.metal===v,v2=>m.metal=v2));

  /* scale caliper */
  const sc=document.createElement('div'); sc.className='card';
  const scAcc=isLamp?'#f2c267':'#b79cff';
  sc.innerHTML=`${cardLabel('Scale caliper','drag the corner — uniform scale')}
    <div class="plot" id="calip"><svg viewBox="0 0 320 130" id="sc-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="sc-v">—</span><span class="u">× scale</span>
      <span class="meta" id="sc-m">—</span></div>`;
  host.appendChild(sc);
  const scSvg=sc.querySelector('#sc-svg'), scEl=sc.querySelector('#calip');
  const scK=100/Math.max(m.sz[0],m.sz[1],0.4), scCx=150, scCy=62;
  const scW0=m.sz[0]*scK, scH0=m.sz[1]*scK, scD0=Math.hypot(Math.max(scW0,8),Math.max(scH0,8))/2;
  let scF=1, scOn=false;
  const scDraw=()=>{ const w=Math.max(scW0*scF,4), h=Math.max(scH0*scF,4), zh=m.sz[2]*scK*scF;
    scSvg.innerHTML=`
      <rect x="${(scCx-w/2).toFixed(1)}" y="${(scCy-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="rgba(183,156,255,.12)" stroke="${scAcc}" stroke-width="2"/>
      <line x1="270" y1="110" x2="270" y2="${Math.max(110-zh,6).toFixed(1)}" stroke="${scAcc}" stroke-width="3"/>
      <text x="270" y="122" class="axis" text-anchor="middle">Z</text>
      <circle cx="150" cy="62" r="3" fill="rgba(255,255,255,.4)"/>
      <circle cx="${(scCx+w/2).toFixed(1)}" cy="${(scCy-h/2).toFixed(1)}" r="7" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>
      <text x="14" y="20" class="axis">${(m.sz[0]*scF).toFixed(2)} × ${(m.sz[1]*scF).toFixed(2)} × ${(m.sz[2]*scF).toFixed(2)} m</text>`;
    sc.querySelector('#sc-v').textContent=`×${scF.toFixed(2)}`;
    sc.querySelector('#sc-m').innerHTML=`dims ${(m.sz[0]*scF).toFixed(2)} × ${(m.sz[1]*scF).toFixed(2)} × ${(m.sz[2]*scF).toFixed(2)} m`; };
  scEl.addEventListener('pointerdown',e=>{ scOn=true; scEl.setPointerCapture(e.pointerId); scMove(e); });
  scEl.addEventListener('pointermove',e=>{ if(scOn)scMove(e); });
  scEl.addEventListener('pointerup',()=>{ if(!scOn)return; scOn=false;
    if(Math.abs(scF-1)>0.005){ m.sz=m.sz.map(v=>Math.round(v*scF*1000)/1000);
      toast(`${m.name} scaled ×${scF.toFixed(2)} — now ${m.sz.map(v=>v.toFixed(2)).join(' × ')} m`); }
    buildInspector(); });
  function scMove(e){ const r=scEl.getBoundingClientRect();
    const x=(e.clientX-r.left)/r.width*320-scCx, y=(e.clientY-r.top)/r.height*130-scCy;
    scF=Math.round(clamp(Math.hypot(x,y)/scD0,0.1,5)*200)/200; scDraw(); }
  scDraw();
  /* dolly curve — drag dollies Camera_Main */
  const C=state.camera;
  const mbr=0.5*Math.hypot(m.sz[0],m.sz[1],m.sz[2]);
  const macc=isLamp?'#f2c267':'#b79cff';
  const doX=d=>10+(d-0.3)/7.7*300, doY=f=>80-clamp(f,0,1.5)/1.5*66;
  const doFill=d=>(2*Math.atan(mbr/Math.max(d,1e-3))*180/Math.PI)/C.fov;
  let doPath='', doArea='M 10 80 ';
  for(let d=0.3; d<=8.001; d+=0.1){ doPath+=`${d===0.3?'M':'L'} ${doX(d).toFixed(1)} ${doY(doFill(d)).toFixed(1)} `;
    doArea+=`L ${doX(d).toFixed(1)} ${doY(doFill(d)).toFixed(1)} `; }
  const ff=document.createElement('div'); ff.className='card';
  ff.innerHTML=`${cardLabel('Dolly curve','drag along the curve — dollies Camera_Main')}
    <div class="plot" id="dolly" style="cursor:ew-resize"><svg viewBox="0 0 320 96">
      <defs><linearGradient id="dog" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${macc}" stop-opacity=".4"/><stop offset="1" stop-color="${macc}" stop-opacity="0"/></linearGradient></defs>
      <path d="${doArea}L 310 80 Z" fill="url(#dog)"/><path d="${doPath}" fill="none" stroke="${macc}" stroke-width="2"/>
      <line x1="10" y1="${doY(1).toFixed(1)}" x2="310" y2="${doY(1).toFixed(1)}" stroke="rgba(255,255,255,.3)" stroke-dasharray="4 3"/>
      <text x="304" y="${(doY(1)-5).toFixed(1)}" class="axis" text-anchor="end">fills frame</text>
      <line id="do-x" y1="8" y2="80" class="xhair" style="--ac:${macc}"/>
      <circle id="do-k" r="5.5" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>
      <text x="10" y="93" class="axis">0.3 m</text><text x="310" y="93" class="axis" text-anchor="end">8 m</text></svg></div>
    <div class="vstrip"><span class="big num" id="do-v">—</span><span class="u">m dolly</span>
      <span class="meta" id="do-m">—</span></div>`;
  host.appendChild(ff);
  const doEl=ff.querySelector('#dolly');
  function doRender(){ const dx=C.x-m.xyz[0], dy=C.y-m.xyz[1], dz=C.z-m.xyz[2];
    const dd=Math.sqrt(dx*dx+dy*dy+dz*dz), f=doFill(clamp(dd,0.3,8));
    ff.querySelector('#do-x').setAttribute('x1',doX(clamp(dd,0.3,8))); ff.querySelector('#do-x').setAttribute('x2',doX(clamp(dd,0.3,8)));

    ff.querySelector('#do-v').textContent=dd.toFixed(2);
    ff.querySelector('#do-m').innerHTML=`fills ${(f*100).toFixed(0)}% of ${C.fov.toFixed(0)}° FoV`; }
  let doOn=false;
  doEl.addEventListener('pointerdown',e=>{ doOn=true; doEl.setPointerCapture(e.pointerId); doMove(e); });
  doEl.addEventListener('pointermove',e=>{ if(doOn) doMove(e); });
  doEl.addEventListener('pointerup',()=>{ if(doOn){ doOn=false;
    const dx=C.x-m.xyz[0], dy=C.y-m.xyz[1], dz=C.z-m.xyz[2];
    toast(`Camera dollied to ${Math.sqrt(dx*dx+dy*dy+dz*dz).toFixed(2)} m from ${m.name}`); } });
  function doMove(e){ const r=doEl.getBoundingClientRect();
    const d=0.3+clamp(((e.clientX-r.left)/r.width*320-10)/300,0,1)*7.7;
    let vx=C.x-m.xyz[0], vy=C.y-m.xyz[1], vz=C.z-m.xyz[2];
    let L=Math.sqrt(vx*vx+vy*vy+vz*vz);
    if(L<1e-3){ vx=0; vy=-1; vz=0.3; L=Math.sqrt(vx*vx+vy*vy+vz*vz); }
    C.x=m.xyz[0]+vx/L*d; C.y=m.xyz[1]+vy/L*d; C.z=Math.max(0.05,m.xyz[2]+vz/L*d);
    doRender(); }
  doRender();
  /* sun incidence — unshadowed N·L at the centre */
  const sL=sunDir(), cosT=m.n[0]*sL[0]+m.n[1]*sL[1]+m.n[2]*sL[2];
  const isDay=state.sun.el>0, isLit=isDay&&cosT>0.02, surfE=isLit?state.sun.intensity*cosT:0;
  const inD=document.createElement('div'); inD.className='card';

      <text x="160" y="90" text-anchor="middle" fill="#f4f4f5" font-size="26" font-weight="200" class="num">${cosT.toFixed(2)}</text>
      <text x="160" y="118" class="axis" text-anchor="middle">COS θ RESPONSE</text></svg></div>
    <div class="vstrip"><span class="big num">${surfE>=1000?(surfE/1000).toFixed(1)+'k':Math.round(surfE)}</span><span class="u">lx on surface</span>
      <span class="meta">${!isDay?'sun below horizon':'sun '+fmtLux(state.sun.intensity)+' lx × '+cosT.toFixed(2)}</span></div>
    <div><span class="delta-pill ${isLit?'hot':''}">${!isDay?'▼ night':cosT>0.5?'▲ direct sun':cosT>0.02?'▲ grazing light':'▼ shadow side'}</span></div>`;
  host.appendChild(inD);
  /* placement + frame */
  const mArea=(()=>{ const [aa,bb2,cc]=m.sz; return [aa,bb2,cc].some(v=>v<1e-6)?(aa*bb2+bb2*cc+cc*aa):2*(aa*bb2+bb2*cc+cc*aa); })();
  const pl=document.createElement('div'); pl.className='card';
  pl.innerHTML=`${cardLabel('Placement','read-only — authored in the modelling tool')}
    <div class="stat-row"><span class="k">Centre (world)</span><span class="v num" style="font-size:12px">${m.xyz.map(v=>v.toFixed(2)).join(' · ')} m</span></div>
    <div class="stat-row"><span class="k">Albedo</span><span class="v num"><span class="swatch" style="background:${m.albedo}"></span>${m.albedo}</span></div>
    <div class="stat-row"><span class="k">Rough · Metal${m.emis?' · Emis':''}</span><span class="v num">${m.rough.toFixed(2)} · ${m.metal.toFixed(2)}${m.emis?' · '+m.emis+' lx':''}</span></div>
    <div class="stat-row"><span class="k">Size</span><span class="v num" style="font-size:12px">${m.sz.map(v=>v.toFixed(2)).join(' × ')} m</span></div>
    <div class="stat-row"><span class="k">Area · B-sphere</span><span class="v num">${mArea.toFixed(2)} m² · r ${mbr.toFixed(2)} m</span></div>

    <button class="btn primary" id="fr-b"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><circle cx="12" cy="12" r="3.2"/></svg>Frame in view</button>`;
  host.appendChild(pl);
  pl.querySelector('#fr-b').addEventListener('click',()=>{ const C=state.camera;
    C.x=m.xyz[0]; C.y=m.xyz[1]-2.2; C.z=m.xyz[2]+0.6; C.pitch=-12; C.yaw=0;
    toast(`Camera framed to ${m.name} — open Camera_Main to see it`); });
}

/* ================================================================ SKY */
function skyColors(T){ const t=clamp((T-1)/9,0,1);
  const mix=(a,b)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
  return { zen:mix([36,78,158],[148,168,188]), hor:mix([168,198,236],[216,216,208]) }; }
function pageSky(host){ const K=state.sky;
  host.insertAdjacentHTML('beforeend',headHTML('#8fc3ff','PHYSICAL SKY','Sky_Atmosphere','turbidity · haze · ozone'));
  const hero=document.createElement('div'); hero.className='card';
  hero.innerHTML=`${cardLabel('Turbidity')}<div id="h-t"></div><div><span class="delta-pill" id="h-pill">—</span></div>`;
  host.appendChild(hero);

  /* dome section */
  const dm=document.createElement('div'); dm.className='card';
  dm.innerHTML=`${cardLabel('Dome section','drag dome: turbidity · drag band edge: haze height')}
    <div class="plot" id="sky-dome"><svg viewBox="0 0 320 168" id="dome-svg"></svg></div>
    <div class="vstrip"><span class="big num" id="dm-v">—</span><span class="u">° haze band</span>
      <span class="meta" id="dm-m">—</span></div>
    <div class="kv-grid"><div class="kv"><div class="k">RAYLEIGH / MIE MIX</div><div class="v num" id="dm-x" style="font-size:12px">—</div></div>
      <div class="kv"><div class="k">SECTION FACES</div><div class="v num" id="dm-s" style="font-size:12px">—</div></div></div>`;
  host.appendChild(dm);
  const dSvg=dm.querySelector('#dome-svg'), dEl=dm.querySelector('#sky-dome');
  const dPos=e=>{ const r=dEl.getBoundingClientRect();
    return [(e.clientX-r.left)/r.width*320,(e.clientY-r.top)/r.height*168]; };
  let dMode=null;
  dEl.addEventListener('pointerdown',e=>{ const [,y]=dPos(e);
    dMode=Math.abs(y-(132-K.haze*2.6))<13?'haze':'turb';
    dEl.setPointerCapture(e.pointerId); dMove(e); });
  dEl.addEventListener('pointermove',e=>{ if(dMode) dMove(e); });
  dEl.addEventListener('pointerup',()=>dMode=null);
  function dMove(e){ const [,y]=dPos(e);
    if(dMode==='haze') K.haze=Math.round(clamp((132-y)/2.6,0,20)*10)/10;
    else K.turbidity=Math.round(clamp(1+(1-(y-14)/118)*9,1,10)*10)/10;
    render(); }

  /* ozone */
  const oz=document.createElement('div'); oz.className='card';
  oz.innerHTML=`${cardLabel('Ozone · Chappuis bands','drag vertically — scales the 600 nm dip')}
    <div class="plot" id="ozone"><svg viewBox="0 0 320 122">
      <text x="10" y="114" class="axis">500 nm</text>

/* ================================================================ MOON */
const MOON_PHI=-26.19*Math.PI/180, MOON_DEC=-10*Math.PI/180;
function moonDir(t){ const H=(t-24)*15*Math.PI/180;
  const cd=Math.cos(MOON_DEC),sd=Math.sin(MOON_DEC),cp=Math.cos(MOON_PHI),sp=Math.sin(MOON_PHI);
  const x=-cd*Math.sin(H), y=sd*cp-cd*Math.cos(H)*sp, z=sd*sp+cd*Math.cos(H)*cp;
  return { az:(Math.atan2(x,y)*180/Math.PI+360)%360, el:Math.asin(clamp(z,-1,1))*180/Math.PI }; }
const moonAlt=t=>moonDir(t).el;
function moonRiseSet(){ let up=null,dn=null,prev=moonAlt(12);
  for(let t=12.05;t<=36;t+=0.05){ const a=moonAlt(t);
    if(prev<0&&a>=0&&up===null)up=t; if(prev>=0&&a<0)dn=t; prev=a; }
  return [up,dn]; }
const fmtT=t=>{ t=((t%24)+24)%24; const h=Math.floor(t),m=Math.floor((t-h)*60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; };
const phaseName=p=>['New','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'][Math.floor((((p%1)+1)%1)*8+0.5)%8];
const illumFrac=p=>(1-Math.cos(2*Math.PI*p))/2;
const moonMlx=(p,g)=>105*Math.pow(Math.max(illumFrac(p),0),1.5)*g;
function moonPhasePath(p,cx,cy,r){ const a=2*Math.PI*(((p%1)+1)%1);
  if(a<0.06||a>2*Math.PI-0.06)return '';
  if(Math.abs(a-Math.PI)<0.06)return `M ${cx-r} ${cy} A ${r} ${r} 0 1 0 ${cx+r} ${cy} A ${r} ${r} 0 1 0 ${cx-r} ${cy} Z`;
  const wax=a<Math.PI, cres=Math.cos(a)>0, rx=Math.max(r*Math.abs(Math.cos(a)),0.01);
  return `M ${cx} ${cy-r} A ${r} ${r} 0 0 ${wax?1:0} ${cx} ${cy+r} A ${rx.toFixed(2)} ${r} 0 0 ${(cres===wax)?0:1} ${cx} ${cy-r} Z`; }

      <line x1="100" y1="100" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="rgba(255,255,255,.25)"/>
      <circle cx="${hx.toFixed(1)}" cy="${hy.toFixed(1)}" r="6" fill="#0c0c0e" stroke="#fff" stroke-width="2.5"/>`;

    const md=moonDir(M.t), mx=trX(M.t), my=trY(md.el), upM=md.el>=0;
    const [rise,set]=moonRiseSet();
    let grid='';
    [[18,'18'],[21,'21'],[24,'00'],[27,'03'],[30,'06']].forEach(([t,l])=>{
