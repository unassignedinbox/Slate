<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slate — Scene Browser (design proof)</title>
<style>
  /* ══════════════════════════════════════════════════════════════════════════════════════════════════════════
     SCENE BROWSER — design proof for the engine-side InterfaceOutlinerSequence.
     Tokens are lifted verbatim from References/UIComponents.html so the C++ renderer has one source of truth.
     Layout follows OutlinerV2: [ tree | details ] with a whole-card slide to per-object properties.
     ══════════════════════════════════════════════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#050505; --panel:#121212; --inset:#1a1a1a; --field:#000000;
    --raised:#222222; --selected:#2a2a2a;
    --stroke:rgba(255,255,255,.05); --stroke-strong:#2e2e2e;
    --text:#f0f0f0; --text-dim:#888888; --text-faint:#5c5c5c;
    --accent:#ffffff; --accent-soft:rgba(255,255,255,.12);
    --hi:#6c77ff; --danger:#ef4444; --ok:#22c55e; --caution:#f59e0b;
    --ax-x:#ef5350; --ax-y:#69d06d; --ax-z:#5b8cff;
    --r-panel:24px; --r-inset:18px; --r-pill:999px;
    --row-h:32px; --ctl-h:40px;
    --ease:cubic-bezier(.22,.61,.36,1);
    --shadow-panel:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.03);
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;user-select:none;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;}

  .card{width:min(1040px,97vw);height:min(700px,94vh);background:var(--panel);border-radius:var(--r-panel);
    box-shadow:var(--shadow-panel);display:flex;flex-direction:column;overflow:hidden;}
  .card-head,.card-foot{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:0 20px;}
  .card-head{height:56px;border-bottom:1px solid var(--stroke);}
  .card-foot{height:40px;border-top:1px solid var(--stroke);color:var(--text-faint);font-size:11.5px;}
  .h-title{font-size:14px;font-weight:600;letter-spacing:.4px;}
  .h-sub{font-size:11px;color:var(--text-faint);}
  .spacer{flex:1;}
  .iconbtn{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;background:var(--raised);
    color:var(--text-dim);display:grid;place-items:center;
    transition:background .18s var(--ease),color .18s var(--ease),transform .18s var(--ease);}
  .iconbtn:hover{background:#2e2e2e;color:var(--text);transform:scale(1.08);}
  .iconbtn:active{transform:scale(.94);}
  .iconbtn.on{background:var(--accent);color:#000;}

  .view-wrap{flex:1;overflow:hidden;min-height:0;}
  .view-track{display:flex;width:200%;height:100%;transition:transform .34s var(--ease);}
  .view{flex:0 0 50%;height:100%;display:flex;min-width:0;}

  .tree-pane{flex:0 0 54%;min-width:0;display:flex;flex-direction:column;border-right:1px solid var(--stroke);
    transition:flex-basis .32s var(--ease),border-color .32s var(--ease);}
  .det-pane{flex:1;min-width:0;display:flex;flex-direction:column;overflow-y:auto;scrollbar-width:none;
    padding:14px 18px 16px;transition:opacity .22s var(--ease);}
  .det-pane::-webkit-scrollbar{display:none;}
  .view.compact .tree-pane{flex-basis:100%;border-right-color:transparent;}
  .view.compact .det-pane{opacity:0;pointer-events:none;}

  .sec-label{font-size:10px;letter-spacing:1.6px;color:var(--text-faint);text-transform:uppercase;padding:14px 20px 8px;
    display:flex;align-items:center;gap:8px;}
  .filter-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 20px 12px;}
  .chip{height:26px;padding:0 12px;border:none;border-radius:var(--r-pill);cursor:pointer;background:var(--field);
    color:var(--text-dim);font-size:11.5px;font-weight:600;transition:all .16s var(--ease);}
  .chip:hover{color:var(--text);}
  .chip.on{background:var(--accent);color:#000;}

  .tree{flex:1;overflow-y:auto;padding:0 12px 10px;scrollbar-width:none;}
  .tree::-webkit-scrollbar{display:none;}
  .row{display:flex;align-items:center;gap:8px;height:var(--row-h);padding:0 8px;cursor:pointer;
    transition:background .14s var(--ease);}
  .row:hover{background:#1c1c1c;}
  .row.sel{background:var(--selected);box-shadow:inset 2px 0 0 var(--accent);}
  .row .tw{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;color:var(--text-faint);
    transition:transform .18s var(--ease);}
  .row .tw.open{transform:rotate(90deg);}
  .row .tw.leaf{visibility:hidden;}
  .row .ni{width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;}
  .row .nm{font-size:12.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row.locked .nm{color:var(--text-faint);}
  .row .st{width:20px;height:20px;flex:0 0 20px;border:none;background:transparent;color:var(--text-faint);
    cursor:pointer;display:grid;place-items:center;transition:color .15s var(--ease);}
  .row .st:hover{color:var(--text);}
  .row .st.off{color:#333;}
  .row .st.act{color:var(--hi);}

  .pcard{background:var(--inset);border-radius:var(--r-inset);padding:14px 16px 16px;margin-bottom:12px;
    animation:cardIn .28s var(--ease);}
  @keyframes cardIn{from{transform:translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
  .pcard h4{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px;}
  .prow{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .prow:last-child{margin-bottom:0;}
  .prow .pl{flex:0 0 84px;font-size:11.5px;color:var(--text-dim);}
  .vec{display:flex;gap:6px;flex:1;}
  .vfield{flex:1;background:var(--field);border-radius:8px;height:30px;display:flex;align-items:center;
    padding:0 8px;gap:6px;font-size:11.5px;border:1px solid transparent;transition:border-color .15s var(--ease);}
  .vfield:hover{border-color:var(--stroke-strong);}
  .vfield .ax{font-weight:700;font-size:10px;}
  .vfield.x .ax{color:var(--ax-x);} .vfield.y .ax{color:var(--ax-y);} .vfield.z .ax{color:var(--ax-z);}
  .vfield input{background:none;border:none;color:var(--text);font-size:11.5px;width:100%;outline:none;font-family:inherit;}
  /* switch — UIComponents verbatim: 46 x 26, knob 20, on = accent fill + #111 knob */
  .switch{width:46px;height:26px;border-radius:var(--r-pill);flex-shrink:0;cursor:pointer;
    background:var(--raised);border:1px solid var(--stroke);position:relative;transition:background .18s var(--ease);}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;
    background:#bdbdbd;transition:transform .18s var(--ease),background .18s var(--ease);}
  .switch[data-on="true"]{background:var(--accent);}
  .switch[data-on="true"]::after{transform:translateX(20px);background:#111;}

  /* slider — UIComponents verbatim: 28 px pill track, 26 px thumb, filled left side.
     .thin is the quiet variant for dense property panels (10 px / 18 px). */
  input[type=range].slider{appearance:none;-webkit-appearance:none;outline:none;flex:1;min-width:80px;
    height:28px;border-radius:var(--r-pill);cursor:pointer;border:none;
    background:linear-gradient(to right,#7a7a7a 50%,var(--raised) 50%);}
  input[type=range].slider::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:26px;height:26px;
    border-radius:50%;background:#e0e0e0;border:none;transition:transform .12s var(--ease);}
  input[type=range].slider::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#e0e0e0;border:none;}
  input[type=range].slider:active::-webkit-slider-thumb{transform:scale(1.1);}
  input[type=range].slider.thin{height:10px;}
  input[type=range].slider.thin::-webkit-slider-thumb{width:18px;height:18px;}
  input[type=range].slider.thin::-moz-range-thumb{width:18px;height:18px;}
  input[type=range].slider.hi{background:linear-gradient(to right,var(--hi) 50%,var(--raised) 50%);}

  /* value pill — UIComponents .vpill, 118 px: number cell + 44 px unit cell */
  .vpill{width:118px;height:32px;flex:0 0 118px;display:flex;border-radius:var(--r-pill);overflow:hidden;
    border:1px solid var(--stroke);}
  .vpill .num{flex:1;background:var(--field);display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:600;letter-spacing:.4px;font-variant-numeric:tabular-nums;}
  .vpill .unit{width:40px;background:var(--inset);border-left:1px solid var(--stroke);display:flex;
    align-items:center;justify-content:center;color:var(--text-faint);font-size:11px;font-weight:500;}

  /* search field — UIComponents .field */
  .field{flex:1;height:34px;border-radius:var(--r-pill);background:var(--field);border:1px solid var(--stroke);
    display:flex;align-items:center;gap:10px;padding:0 14px;min-width:0;}
  .field:focus-within{border-color:var(--stroke-strong);}
  .field input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);
    font:inherit;font-size:12.5px;}
  .field input::placeholder{color:var(--text-faint);}
  .field .ic{color:var(--text-faint);display:grid;place-items:center;}
  .field .clr{width:18px;height:18px;border:none;border-radius:50%;background:var(--raised);color:var(--text-dim);
    cursor:pointer;display:grid;place-items:center;font-size:11px;line-height:1;}
  .field .clr:hover{background:var(--danger);color:#fff;}
  .search-row{display:flex;align-items:center;gap:8px;padding:0 20px 10px;}
  .hitcount{font-size:11px;color:var(--text-faint);white-space:nowrap;font-variant-numeric:tabular-nums;}
  mark{background:rgba(108,119,255,.35);color:var(--text);border-radius:2px;padding:0 1px;}
  .nohits{padding:18px 20px;color:var(--text-faint);font-size:12px;text-align:center;}
  /* plain readout for non-editable values (child counts, material names, status) */
  .val{font-size:11.5px;color:var(--text-dim);min-width:44px;text-align:right;font-variant-numeric:tabular-nums;}
  .empty{display:grid;place-items:center;height:100%;color:var(--text-faint);font-size:12px;text-align:center;padding:24px;}
  .badge{font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;padding:2px 7px;border-radius:var(--r-pill);
    background:var(--raised);color:var(--text-dim);font-weight:600;}
  .badge.dyn{background:rgba(108,119,255,.18);color:#9aa2ff;}
</style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <button class="iconbtn" id="btnBack" style="display:none" title="Back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div><div class="h-title" id="hTitle">Scene Browser</div>
         <div class="h-sub" id="hSub">Cornell Box · 8 objects</div></div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btnCompact" title="Compact — tree only">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <button class="iconbtn props" id="btnProps" title="Properties">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
  </div>

  <div class="view-wrap"><div class="view-track" id="viewTrack">
    <!-- view 0 -->
    <div class="view" id="mainView">
      <div class="tree-pane">
        <div class="sec-label">Outliner</div>
        <div class="search-row">
          <div class="field">
            <span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
            <input id="search" type="text" placeholder="Search objects…" autocomplete="off" spellcheck="false">
            <button class="clr" id="clrSearch" title="Clear" style="display:none">✕</button>
          </div>
          <span class="hitcount" id="hitcount"></span>
        </div>
        <div class="filter-row" id="filters"></div>
        <div class="tree" id="tree"></div>
      </div>
      <div class="det-pane" id="details"></div>
    </div>
    <!-- view 1 -->
    <div class="view"><div style="flex:1;overflow-y:auto;padding:14px 20px 16px;scrollbar-width:none" id="props"></div></div>
  </div></div>

  <div class="card-foot"><span id="footSel">1 selected</span><div class="spacer"></div>
    <span>InterfaceOutlinerSequence · design proof</span></div>
</div>

<script>
/* ── icons ─────────────────────────────────────────────────────────────────────────────────── */
const S=(p,c,sz)=>`<svg width="${sz||14}" height="${sz||14}" viewBox="0 0 24 24" fill="none" stroke="${c||'currentColor'}"
  stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const P={
  folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  mesh  :'<path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M12 22V12"/><path d="m3 7 9 5 9-5"/>',
  light :'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.2 2.2M16.9 16.9l2.2 2.2M19.1 4.9l-2.2 2.2M7.1 16.9 4.9 19.1"/>',
  camera:'<rect x="2" y="6" width="13" height="12" rx="2"/><path d="m15 10 7-4v12l-7-4z"/>',
  sky   :'<path d="M4 16a5 5 0 1 1 3-9 6 6 0 1 1 5 9z"/>',
  sun   :'<circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>',
  moon  :'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  cube  :'<path d="M12 2 3 7v10l9 5 9-5V7z"/>',
};
const COL={folder:'#c9a24b',mesh:'#9aa0a6',light:'#f5d34b',camera:'#69c3ff',sky:'#8fd3ff',sun:'#ffb14b',moon:'#b8c4d6'};
const IC={
  eye:()=>S('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'),
  eyeoff:()=>S('<path d="M2 12s3.5-7 10-7c2 0 3.8.7 5.3 1.6M22 12s-3.5 7-10 7c-2 0-3.8-.7-5.3-1.6"/><path d="m3 3 18 18"/>'),
  lock:()=>S('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'),
  unlock:()=>S('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>'),
  motion:()=>S('<path d="M3 12h4l3-8 4 16 3-8h4"/>'),
  chev:()=>S('<path d="m9 6 6 6-6 6"/>'),
};

/* ── model ─────────────────────────────────────────────────────────────────────────────────── */
let UID=0;
const N=(name,type,kids,x)=>({id:++UID,name,type,kids:kids||[],open:true,vis:true,locked:false,dynamic:false,
  pos:[0,0,0],rot:[0,0,0],...(x||{})});
const scene=[
  N('Environment','folder',[
    N('Sky Atmosphere','sky',[],{locked:true}),
    N('Sun','sun',[],{dynamic:true}),
    N('Moon','moon',[],{dynamic:true}),
  ]),
  N('Geometry','folder',[
    N('Floor','mesh',[],{locked:true}),
    N('Ceiling','mesh',[],{locked:true}),
    N('Back Wall','mesh',[],{locked:true}),
    N('Left Wall (Red)','mesh',[],{locked:true}),
    N('Right Wall (Green)','mesh',[],{locked:true}),
    N('Tall Box','mesh',[],{dynamic:true,pos:[-0.35,1.35,0.60],rot:[0,0,22]}),
    N('Short Box','mesh',[],{dynamic:true,pos:[0.35,0.75,0.30],rot:[0,0,-18]}),
  ]),
  N('Lighting','folder',[ N('Ceiling Luminaire','light',[],{pos:[0,1.0,1.995]}) ]),
  N('Cameras','folder',[ N('Main Camera','camera',[],{pos:[0,-1.95,1.0]}) ]),
];
const LABEL={folder:'Folder',mesh:'Mesh',light:'Light',camera:'Camera',sky:'Sky',sun:'Sun',moon:'Moon'};

const flat=[]; const walk=(l,d,p)=>l.forEach(n=>{n.depth=d;n.parent=p;flat.push(n);walk(n.kids,d+1,n);});
const reflat=()=>{flat.length=0;walk(scene,0,null);};
let selId=null; const filters=new Set(); let query='';
const cur=()=>flat.find(n=>n.id===selId)||null;

/* A node survives if it matches the search AND the type filter, or if a descendant does — otherwise searching
   would hide the folders the hits live in and the tree would collapse into an unreadable flat list. */
const selfMatch=n=>{
  const q = !query || n.name.toLowerCase().includes(query);
  const t = !filters.size || filters.has(LABEL[n.type]);
  return q && t;
};
const subtreeMatch=n=>selfMatch(n)||n.kids.some(subtreeMatch);
const countHits=()=>flat.filter(n=>n.type!=='folder'&&selfMatch(n)).length;
const mark=name=>{
  if(!query) return name;
  const i=name.toLowerCase().indexOf(query);
  if(i<0) return name;
  return name.slice(0,i)+'<mark>'+name.slice(i,i+query.length)+'</mark>'+name.slice(i+query.length);
};

/* ── view slide ────────────────────────────────────────────────────────────────────────────── */
const track=document.getElementById('viewTrack'), mainView=document.getElementById('mainView');
const hT=document.getElementById('hTitle'), hS=document.getElementById('hSub');
const bBack=document.getElementById('btnBack'), bProps=document.getElementById('btnProps'), bComp=document.getElementById('btnCompact');
function viewTo(i){
  track.style.transform=`translateX(-${i*50}%)`;
  const n=cur();
  if(i===1&&n){ hT.textContent=n.name; hS.textContent=LABEL[n.type]+' Properties';
    bBack.style.display=''; bComp.style.display='none'; bProps.style.display='none'; renderProps(); }
  else{ hT.textContent='Scene Browser'; hS.textContent='Cornell Box · '+flat.filter(x=>x.type!=='folder').length+' objects';
    bBack.style.display='none'; bComp.style.display=''; bProps.style.display=''; }
}
bProps.onclick=()=>{ if(cur()) viewTo(1); };
bBack.onclick=()=>viewTo(0);
bComp.onclick=()=>{ const on=mainView.classList.toggle('compact'); bComp.classList.toggle('on',on); };

/* ── tree ──────────────────────────────────────────────────────────────────────────────────── */
const treeEl=document.getElementById('tree');
function renderTree(){
  reflat(); treeEl.innerHTML='';
  let shown=0;
  const build=list=>list.forEach(n=>{
    if(!subtreeMatch(n)) return;
    shown++;
    const row=document.createElement('div');
    row.className='row'+(n.id===selId?' sel':'')+(n.locked?' locked':'');
    row.style.paddingLeft=(8+n.depth*18)+'px';
    const leaf=!n.kids.length;
    // While a query is live every branch is forced open, otherwise a hit inside a collapsed folder is invisible.
    const open = query ? true : n.open;
    row.innerHTML=
      `<span class="tw ${leaf?'leaf':''} ${open?'open':''}">${IC.chev()}</span>`+
      `<span class="ni">${S(P[n.type]||P.cube,COL[n.type],14)}</span>`+
      `<span class="nm">${mark(n.name)}</span>`+
      (n.dynamic?`<span class="badge dyn">dyn</span>`:'')+
      (n.type!=='folder'?`<button class="st ${n.locked?'act':''}" data-a="lock" title="Locked">${n.locked?IC.lock():IC.unlock()}</button>`:'')+
      (n.type!=='folder'?`<button class="st ${n.dynamic?'act':''}" data-a="dyn" title="Dynamic">${IC.motion()}</button>`:'')+
      `<button class="st ${n.vis?'':'off'}" data-a="vis" title="Visible">${n.vis?IC.eye():IC.eyeoff()}</button>`;
    if(!leaf) row.querySelector('.tw').onclick=e=>{e.stopPropagation();n.open=!n.open;renderTree();};
    row.querySelectorAll('.st').forEach(b=>b.onclick=e=>{
      e.stopPropagation(); const a=b.dataset.a;
      if(a==='vis')n.vis=!n.vis; if(a==='lock')n.locked=!n.locked; if(a==='dyn')n.dynamic=!n.dynamic;
      renderTree(); renderDetails();});
    row.onclick=()=>{selId=n.id;renderTree();renderDetails();};
    row.ondblclick=()=>{selId=n.id;viewTo(1);};
    treeEl.appendChild(row);
    if(open) build(n.kids);
  });
  build(scene);
  if(!shown) treeEl.innerHTML=`<div class="nohits">No objects match “${query}”</div>`;
  const hits=countHits();
  document.getElementById('hitcount').textContent=(query||filters.size)?`${hits} of ${flat.filter(n=>n.type!=='folder').length}`:'';
  document.getElementById('clrSearch').style.display=query?'grid':'none';
  document.getElementById('footSel').textContent=(selId?1:0)+' selected';
}
function renderFilters(){
  const f=document.getElementById('filters');
  f.innerHTML='';
  ['Mesh','Light','Camera','Sky','Sun'].forEach(t=>{
    const b=document.createElement('button');
    b.className='chip'+(filters.has(t)?' on':''); b.textContent=t;
    b.onclick=()=>{filters.has(t)?filters.delete(t):filters.add(t);renderFilters();renderTree();};
    f.appendChild(b);
  });
}

/* ── shared property blocks ────────────────────────────────────────────────────────────────── */
const vec=(n,key,label,dis)=>`<div class="prow"><span class="pl">${label}</span><div class="vec">
  ${['x','y','z'].map((a,i)=>`<div class="vfield ${a}"><span class="ax">${a.toUpperCase()}</span>
  <input value="${n[key][i].toFixed(2)}" ${dis?'disabled':''}></div>`).join('')}</div></div>`;
const sw=(label,on)=>`<div class="prow"><span class="pl">${label}</span>
  <div class="switch" data-on="${on?'true':'false'}"></div></div>`;

/* Kit slider: a real input[type=range] carrying .slider so it inherits the 28 px track / 26 px thumb rules
   verbatim, with the filled-left-side gradient recomputed on input. `.thin` is used in the dense property
   panels, matching how UIComponents describes the quiet variant. */
const sl=(label,v,min,max,unit,step)=>{
  const st=step||((max-min)/200);
  return `<div class="prow"><span class="pl">${label}</span>
    <input type="range" class="slider thin" min="${min}" max="${max}" step="${st}" value="${v}"
           data-unit="${unit||''}">
    <div class="vpill"><div class="num">${v}</div><div class="unit">${(unit||'').trim()||'—'}</div></div></div>`;
};

/* Paint the filled portion, exactly as UIComponents does for its own sliders. */
function paintSlider(el){
  const t=(el.value-el.min)/(el.max-el.min)*100;
  const lit=el.classList.contains('hi')?'var(--hi)':'#7a7a7a';
  el.style.background=`linear-gradient(to right,${lit} ${t}%,var(--raised) ${t}%)`;
  const pill=el.parentElement.querySelector('.vpill .num');
  if(pill){ const d=(+el.step<1)?2:0; pill.textContent=(+el.value).toFixed(d); }
}
function bindControls(root){
  root.querySelectorAll('input[type=range].slider').forEach(el=>{
    paintSlider(el);
    el.addEventListener('input',()=>paintSlider(el));
  });
  root.querySelectorAll('.switch').forEach(el=>{
    el.addEventListener('click',()=>el.dataset.on = el.dataset.on==='true'?'false':'true');
  });
}

function bodyFor(n){
  if(n.type==='sun') return `<div class="pcard"><h4>Orbit</h4>
      ${sl('Elevation',34,-90,90,'°')}${sl('Azimuth',127,0,360,'°')}${sl('Time of day',14.2,0,24,' h')}
      ${sw('Animate',true)}${sl('Rate',60,0,600,'×')}</div>
    <div class="pcard"><h4>Disc</h4>${sl('Angular size',0.53,0.1,3,'°')}${sl('Intensity',120,0,200,' klx')}</div>`;
  if(n.type==='sky') return `<div class="pcard"><h4>Atmosphere</h4>
      ${sl('Planet radius',6360,1000,10000,' km')}${sl('Thickness',100,10,200,' km')}
      ${sl('Rayleigh height',8.0,1,20,' km')}${sl('Mie height',1.2,0.1,5,' km')}
      ${sl('Mie asymmetry',0.80,-1,1,'')}${sl('Ozone centre',25,0,60,' km')}</div>
    <div class="pcard"><h4>Rendering</h4>${sw('Aerial perspective',true)}${sw('Sky lights scene',true)}</div>`;
  if(n.type==='moon') return `<div class="pcard"><h4>Orbit</h4>
      ${sl('Period',27.3,1,100,' d')}${sl('Phase',0.62,0,1,'')}${sl('Inclination',5.1,0,90,'°')}</div>
    <div class="pcard"><h4>Appearance</h4>${sl('Angular size',0.52,0.1,3,'°')}${sl('Albedo',0.12,0,1,'')}</div>`;
  if(n.type==='camera') return `<div class="pcard"><h4>Transform</h4>${vec(n,'pos','Position')}${vec(n,'rot','Rotation')}</div>
    <div class="pcard"><h4>Movement</h4>${sl('Speed',2.5,0.1,20,' m/s')}${sl('Field of view',55,20,120,'°')}
      ${sl('Boost',3,1,10,'×')}</div>
    <div class="pcard"><h4>Render Settings</h4>${sl('Candidates',4,1,64,'')}${sl('Extra candidates',2,0,16,'')}
      ${sl('Exposure',1.05,0.05,4,'')}${sw('Temporal reuse',true)}${sw('Spatial reuse',true)}
      ${sw('Alias pick',true)}${sw('Denoise',true)}</div>`;
  if(n.type==='light') return `<div class="pcard"><h4>Transform</h4>${vec(n,'pos','Position',n.locked)}</div>
    <div class="pcard"><h4>Emission</h4>${sl('Illuminance',32,0,200,' lx')}${sw('Two sided',false)}</div>`;
  if(n.type==='folder') return `<div class="pcard"><h4>Folder</h4>
    <div class="prow"><span class="pl">Children</span><span class="val">${n.kids.length}</span></div>
    ${sw('Visible',n.vis)}${sw('Locked',n.locked)}</div>`;
  return `<div class="pcard"><h4>Transform</h4>${vec(n,'pos','Position',n.locked)}${vec(n,'rot','Rotation',n.locked)}</div>
    <div class="pcard"><h4>Object</h4>${sw('Visible',n.vis)}${sw('Locked',n.locked)}${sw('Dynamic',n.dynamic)}
    <div class="prow"><span class="pl">Material</span><span class="val">material_${(n.id%6)}</span></div></div>`;
}
function renderDetails(){
  const d=document.getElementById('details'), n=cur();
  if(!n){ d.innerHTML=`<div class="empty">Select an object to see its details</div>`; return; }
  d.innerHTML=`<div class="pcard"><h4>${LABEL[n.type]}</h4>
      <div class="prow"><span class="pl">Name</span><span style="font-size:12.5px">${n.name}</span></div>
      <div class="prow"><span class="pl">Status</span><span class="val" style="min-width:auto">
        ${n.vis?'visible':'hidden'}${n.locked?' · locked':''}${n.dynamic?' · dynamic':''}</span></div></div>`
    + bodyFor(n);
  bindControls(d);
}
function renderProps(){ const n=cur(); if(!n) return;
  const el=document.getElementById('props'); el.innerHTML=bodyFor(n); bindControls(el); }

/* ── boot ──────────────────────────────────────────────────────────────────────────────────── */
const searchEl=document.getElementById('search');
searchEl.addEventListener('input',()=>{ query=searchEl.value.trim().toLowerCase(); renderTree(); });
searchEl.addEventListener('keydown',e=>{ if(e.key==='Escape'){ searchEl.value=''; query=''; renderTree(); } });
document.getElementById('clrSearch').addEventListener('click',()=>{
  searchEl.value=''; query=''; renderTree(); searchEl.focus(); });

reflat(); selId=flat.find(n=>n.name==='Sun').id;
renderFilters(); renderTree(); renderDetails(); viewTo(0);
</script>
