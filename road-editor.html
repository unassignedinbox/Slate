/* ════════════════ validation ════════════════ */
function runChecks(){
  S.checks=[];if(!S.project)return;
  const P=S.project,LANE_MIN={motorway:3.5,arterial:3.25,collector:3.0,local:2.75,track:2.5};
  for(const r of P.roads){
    const c=r._c,cls=ROAD_CLASSES.find(k=>k.id===r.class)||ROAD_CLASSES[2];
    const push=(level,title,desc,s)=>S.checks.push({level,road:r.id,title,desc,s});
    if(r.nodes.length<2){push('err',`${r.name}: unfinished`,'Road needs at least 2 control nodes.');continue;}
    if(r.closed&&r.nodes.length<3)push('err',`${r.name}: degenerate loop`,'Closed roads need at least 3 nodes.');
    for(let i=0;i<r.nodes.length-1;i++){const a=r.nodes[i],b=r.nodes[i+1];
      if(Math.hypot(a.x-b.x,a.z-b.z)<0.5)push('warn',`${r.name}: coincident nodes`,`${a.id} and ${b.id} are under 0.5 m apart — spline may kink.`);}
    for(let i=1;i<r.nodes.length-1;i++){const a=r.nodes[i-1],b=r.nodes[i],d=r.nodes[i+1];
      const v1=Math.atan2(b.z-a.z,b.x-a.x),v2=Math.atan2(d.z-b.z,d.x-b.x);
      let da=Math.abs(v2-v1);if(da>Math.PI)da=TAU-da;
      if(da>70*DEG)push('warn',`${r.name}: sharp node angle`,`${b.id} turns ${fmt(da/DEG,0)}° — consider an intermediate node.`);}
    if(!c||c.length<5)continue;
    const rMin=rMinFor(r.designSpeed);
    if(c.minR<rMin){let ws=0;for(const p of c.pts){const R=Math.abs(p.k)>1e-7?1/Math.abs(p.k):1e9;if(R<c.minR+1){ws=p.s;break;}}
      push('err',`${r.name}: radius ${fmt(c.minR,0)} m < ${rMin} m`,`Below minimum for ${r.designSpeed} km/h near ${ch(ws)}. Ease the curve or lower design speed.`,ws);}
    else if(c.minR<rMin*1.5){let ws=0;for(const p of c.pts){const R=Math.abs(p.k)>1e-7?1/Math.abs(p.k):1e9;if(R<c.minR+1){ws=p.s;break;}}
      push('warn',`${r.name}: radius margin thin`,`${fmt(c.minR,0)} m vs ${rMin} m minimum near ${ch(ws)}.`);}
    if(c.maxGrade>cls.maxGrade)push('err',`${r.name}: grade ${fmt(c.maxGrade,1)}%`,`Exceeds ${cls.maxGrade}% for ${cls.name}. Lengthen the vertical curve.`);
    else if(c.maxGrade>cls.maxGrade*0.85)push('warn',`${r.name}: grade near limit`,`${fmt(c.maxGrade,1)}% vs ${cls.maxGrade}% max for ${cls.name}.`);
    if(r.laneWidth<2.5)push('err',`${r.name}: lanes too narrow`,`${fmt(r.laneWidth,2)} m lanes are below any standard.`);
    else if(r.laneWidth<(LANE_MIN[r.class]||3))push('warn',`${r.name}: narrow lanes`,`${fmt(r.laneWidth,2)} m vs ${LANE_MIN[r.class]} m usual for ${cls.name}.`);
    if(r.superAuto&&r.superMax>0){const frac=c.pts.filter(p=>Math.abs(p.e)>=r.superMax/100*0.99).length/c.pts.length;
      if(frac>0.08)push('warn',`${r.name}: super capped ${fmt(frac*100,0)}% of length`,`Banking demand exceeds the ${r.superMax}% cap over long stretches — ease curves or raise the cap.`);}
    // runoff rate
    let worst=0,ws=0;for(let i=1;i<c.pts.length;i++){const ds=c.pts[i].s-c.pts[i-1].s;if(ds<0.01)continue;
      const rt=Math.abs(c.pts[i].e-c.pts[i-1].e)/ds;if(rt>worst){worst=rt;ws=c.pts[i].s;}}
    if(worst>1/150)push('warn',`${r.name}: super runoff steep`,`${fmt(1/worst,0)}:1 edge gradient near ${ch(ws)} — lengthen transitions.`,ws);
    push('ok',`${r.name}: geometry`,`${r.nodes.length} nodes · ${fmt(c.length,0)} m · R ${c.minR===Infinity?'∞':fmt(c.minR,0)+' m'} · ${fmt(c.maxGrade,1)}% · e ${fmt(c.maxE,1)}%.`);
  }
  // overlaps / grade separations (coarse)
  for(let i=0;i<P.roads.length;i++)for(let k=i+1;k<P.roads.length;k++){
    const A=P.roads[i],B=P.roads[k];if(!A._c||!B._c||A._c.pts.length<2||B._c.pts.length<2)continue;
    const wA=extents(A),wB=extents(B),need=(wA.dMax-wA.dMin)/2+(wB.dMax-wB.dMin)/2;
    const pa=A._c.pts,pb=B._c.pts,sa=Math.max(1,Math.floor(pa.length/120)),sb=Math.max(1,Math.floor(pb.length/120));
    let near=null;
    for(let a=0;a<pa.length-1;a+=sa)for(let b=0;b<pb.length-1;b+=sb){
      const h=segInt(pa[a],pa[a+1],pb[b],pb[b+1]);if(!h)continue;
      const yA=lerp(pa[a].y,pa[a+1].y,h.t),yB=lerp(pb[b].y,pb[b+1].y,h.u);
      if(Math.abs(yA-yB)>3.5){near={grade:true,x:h.x,z:h.z,dy:Math.abs(yA-yB)};}
      else near={grade:false};
      break;}
    if(near&&near.grade)S.checks.push({level:'ok',road:A.id,title:`${A.name} × ${B.name}: grade-separated`,desc:`${fmt(near.dy,1)} m apart vertically near X ${fmt(near.x,0)}, Z ${fmt(near.z,0)} — bridge / tunnel assumed.`});
  }
  // overlap proximity (no crossing but too close)
  for(let i=0;i<P.roads.length;i++)for(let k=i+1;k<P.roads.length;k++){
    const A=P.roads[i],B=P.roads[k];if(!A._c||!B._c)continue;
    const need=(extents(A).dMax-extents(A).dMin+extents(B).dMax-extents(B).dMin)/2*0.85;
    const pa=A._c.pts,pb=B._c.pts,sa=Math.max(1,Math.floor(pa.length/80)),sb=Math.max(1,Math.floor(pb.length/80));
    let bd=1e9,bs=0;
    for(let a=0;a<pa.length;a+=sa)for(let b=0;b<pb.length;b+=sb){
      const d=Math.hypot(pa[a].x-pb[b].x,pa[a].z-pb[b].z);if(d<bd){bd=d;bs=pa[a].s;}}
    if(bd<need){let hasJx=S.jx.some(j=>j.legs.some(l=>l.road===A.id)&&j.legs.some(l=>l.road===B.id));
      if(!hasJx)S.checks.push({level:'warn',road:A.id,title:`${A.name} runs close to ${B.name}`,desc:`Centrelines ${fmt(bd,1)} m apart near ${ch(bs)} with no junction — separate them or add a crossing.`,s:bs});}
  }
}
function renderChecks(){
  const box=$('checkList');if(!box)return;
  const order={err:0,warn:1,ok:2};
  const items=[...S.checks].sort((a,b)=>order[a.level]-order[b.level]);
  box.innerHTML=items.length?items.map((c,i)=>{
    const r=roadById(c.road);
    return `<div class="check ${c.level}" data-i="${i}"><span class="ic">${icon(c.level==='err'?'x':c.level==='warn'?'warn':'check','ico14')}</span>
      <div><div class="tt">${esc(c.title)}</div><div class="ds">${esc(c.desc)}</div></div>
      <span class="st">${r?esc(r.id):''}${c.s!==undefined?' · '+ch(c.s):''}</span></div>`;}).join('')
    :'<div class="empty"><p>No checks yet.</p></div>';
  box.querySelectorAll('.check').forEach(elm=>elm.onclick=()=>{
    const c=items[+elm.dataset.i];if(!c||!c.road)return;const r=roadById(c.road);if(!r)return;

    else frameRoad(r);

  });
  const errs=S.checks.filter(c=>c.level==='err').length,warns=S.checks.filter(c=>c.level==='warn').length;
  renderDockTabs();
}

const r3=v=>+v.toFixed(3);
function engineJSON(){
  return {app:'frontier-road',version:1,units:'m',up:'Y',exportedAt:new Date().toISOString(),project:S.project.name,grid:S.gridSize,
    roads:S.project.roads.map(r=>{const c=r._c||{pts:[],length:0,minR:0,maxGrade:0,maxE:0};
      return {id:r.id,name:r.name,tint:r.tint,class:r.class,designSpeed:r.designSpeed,closed:!!r.closed,surface:r.surface,
        centerMark:r.centerMark,edgeMark:r.edgeMark,
        crossSection:{lanes:r.lanes,laneWidth:r.laneWidth,median:r.median,shoulderL:r.shL,shoulderR:r.shR,crown:r.crown,shoulderSlope:r.shSlope,kerbL:!!r.kerbL,kerbR:!!r.kerbR,kerbH:r.kerbH,walkL:r.walkL,walkR:r.walkR,railL:!!r.railL,railR:!!r.railR,lights:!!r.lights,lightSpacing:r.lightSpacing,posts:!!r.posts,postSpacing:r.postSpacing,studs:!!r.studs},
        sampling:{step:r.step,smoothV:r.smoothV},superAuto:!!r.superAuto,superMax:r.superMax,superManual:r.superManual,
        nodes:r.nodes.map(n=>({id:n.id,x:r3(n.x),y:r3(n.y),z:r3(n.z)})),
        centerline:{count:c.pts.length,length:r3(c.length),
          stations:c.pts.map(p=>r3(p.s)),points:c.pts.map(p=>[r3(p.x),r3(p.y),r3(p.z)]),
          grade:c.pts.map(p=>r3(p.grade)),curvature:c.pts.map(p=>+p.k.toFixed(6)),superelevation:c.pts.map(p=>r3(p.e*100))},
        minRadius:c.minR===Infinity?null:r3(c.minR),maxGrade:r3(c.maxGrade),maxSuper:r3(c.maxE),
        junctions:S.jx.filter(j=>j.legs.some(l=>l.road===r.id)).map(j=>({id:j.id,station:r3(j.legs.find(l=>l.road===r.id).s)}))};}),
    junctions:S.jx.map(j=>({id:j.id,x:r3(j.x),z:r3(j.z),legs:j.legs.map(l=>({road:l.road,station:r3(l.s)}))}))};
}
function saveJSON(){
  download(new Blob([JSON.stringify(engineJSON(),null,1)],{type:'application/json'}),S.project.name.replace(/[^\w\-]+/g,'-').toLowerCase()+'.road.json');
  S.dirty=false;$('saveState').innerHTML='<span class="dirtydot" style="display:inline-block;background:var(--green)"></span>saved · rev '+S.rev;
  toast('Project saved as engine JSON');

function importJSON(text){
  const o=JSON.parse(text);const arr=o.roads||o;
  if(!Array.isArray(arr))throw 0;
  const seen=new Set();
  const roads=arr.map((src,i)=>{
    const r=defaultRoad(src.name||('Road '+(i+1)));
    if(src.id&&!seen.has(src.id)){r.id=src.id;}seen.add(r.id);
    if(src.tint)r.tint=src.tint;
    for(const k of ['class','designSpeed','closed','surface','centerMark','edgeMark','lanes','laneWidth','median','step','smoothV','superAuto','superMax','superManual','visible','locked'])if(src[k]!==undefined)r[k]=src[k];
    const cs=src.crossSection||src;
    for(const [a,b] of [['shL','shoulderL'],['shR','shoulderR'],['crown','crown'],['shSlope','shoulderSlope'],['kerbL','kerbL'],['kerbR','kerbR'],['kerbH','kerbH'],['walkL','walkL'],['walkR','walkR'],['railL','railL'],['railR','railR'],['lights','lights'],['lightSpacing','lightSpacing'],['posts','posts'],['postSpacing','postSpacing'],['studs','studs']])if(cs[b]!==undefined)r[a]=cs[b];
    r.nodes=(src.nodes||[]).map((n,j)=>({id:n.id||uid('N'),x:+n.x||0,y:+n.y||0,z:+n.z||0}));
    r.tint=TINTS[i%TINTS.length];rebuildRoad(r);return r;});
  S.project={name:o.project||'Imported corridor',grid:o.grid||10,roads};
  S.gridSize=S.project.grid;syncUid();
  S.sel={road:roads[0]?roads[0].id:null,nodes:new Set(),jx:null};
  S.history=[];S.hIndex=-1;rebuildJunctions();$('projName').value=S.project.name;
  commit('Import');frameAll();fullRefresh();toast(`Imported <b>${roads.length}</b> road(s)`);
}
function buildOBJ(step){
  const L=['# Frontier road network | units: meters | Y-up','# Exported by Frontier Road Editor '+new Date().toISOString()];
  L.push('# Roads: '+S.project.roads.map(r=>`${r.id}(${r.nodes.length}n)`).join(' '));
  for(const jx of S.jx)L.push(`# Junction ${jx.id} @ X ${r3(jx.x)} Z ${r3(jx.z)} :: `+jx.legs.map(l=>`${l.road}@${r3(l.s)}`).join(' '));
  let vi=1,tris=0;
  const V=(p)=>{L.push(`v ${r3(p.x)} ${r3(p.y)} ${r3(p.z)}`);};
  for(const r of S.project.roads){
    const c=r._c;if(!c||c.length<2)continue;
    const ex=extents(r),ht=halfTravel(r);
    const across=[...new Set([ex.dMin,-ht,-ht/2,0,ht/2,ht,ex.dMax].map(v=>+v.toFixed(4)))].sort((a,b)=>a-b);
    const n=Math.min(3000,Math.max(8,Math.ceil(c.length/step)));
    const cols=across.length,base=vi;
    const grid=[];
    for(let i=0;i<=n;i++){const s=c.length*i/n,p=pointAt(r,s);const row=[];
      for(let j=0;j<cols;j++){const w=worldAt(r,p,across[j]);row.push(w);V(w);vi++;}
      grid.push(row);}
    // normals (numeric, up)
    for(let i=0;i<=n;i++)for(let j=0;j<cols;j++){
      const i0=Math.max(0,i-1),i1=Math.min(n,i+1),j0=Math.max(0,j-1),j1=Math.min(cols-1,j+1);
      const A=grid[i0][j],B=grid[i1][j],C0=grid[i][j0],D=grid[i][j1];
      const sx=B.x-A.x,sy=B.y-A.y,sz=B.z-A.z,dx=D.x-C0.x,dy=D.y-C0.y,dz=D.z-C0.z;
      let nx=dy*sz-dz*sy,ny=dz*sx-dx*sz,nz=dx*sy-dy*sx; // d × s = up
      const l=Math.hypot(nx,ny,nz)||1;L.push(`vn ${r3(nx/l)} ${r3(ny/l)} ${r3(nz/l)}`);}
    L.push(`o ${r.id}_${r.name.replace(/\s+/g,'_')}`,`g ${r.id}_surface`);
    for(let i=0;i<n;i++)for(let j=0;j<cols-1;j++){
      const a=base+i*cols+j,b=a+1,cc=a+cols+1,e=a+cols;
      L.push(`f ${a}//${a} ${b}//${b} ${cc}//${cc}`);L.push(`f ${a}//${a} ${cc}//${cc} ${e}//${e}`);tris+=2;}
    // markings
    if(S.exportMarkings){
      const strips=[];
      const ribbon=(d,w)=>strips.push({d0:d-w/2,d1:d+w/2,s0:0,s1:c.length,cont:true});
      if(r.edgeMark!=='none'){ribbon(ht-0.18,0.15);ribbon(-ht+0.18,0.15);}
      if(r.centerMark==='single')ribbon(0,0.15);
      if(r.centerMark==='double'){ribbon(0.28,0.14);ribbon(-0.28,0.14);}
      const dashStrips=[];
      const dashes=(d,w,len,gap)=>{for(let s=0;s<c.length-len;s+=len+gap)dashStrips.push({d0:d-w/2,d1:d+w/2,s0:s,s1:s+len});};
      if(r.centerMark==='dash')dashes(0,0.15,3,9);
      for(const d of laneDividerOffsets(r))dashes(d,0.15,3,6);
      if(r.studs){for(let s=6;s<c.length;s+=12)dashStrips.push({d0:-0.1,d1:0.1,s0:s,s1:s+0.2});}
      const emit=(arr,lift)=>{for(const st of arr){
        const pa=pointAt(r,st.s0),pb=pointAt(r,st.s1);if(!pa||!pb)continue;
        const A0=worldAt(r,pa,st.d0),A1=worldAt(r,pa,st.d1),B0=worldAt(r,pb,st.d0),B1=worldAt(r,pb,st.d1);
        A0.y+=lift;A1.y+=lift;B0.y+=lift;B1.y+=lift;
        const b0=vi;V(A0);V(A1);V(B1);V(B0);vi+=4;
        L.push(`f ${b0} ${b0+1} ${b0+2}`,`f ${b0} ${b0+2} ${b0+3}`);tris+=2;}};
      // continuous strips follow curves: subdivide along length BEFORE emitting
      const extra=[];
      for(const st of strips){const segs=Math.min(400,Math.max(8,Math.ceil(c.length/8)));
        for(let i=0;i<segs;i++)extra.push({d0:st.d0,d1:st.d1,s0:c.length*i/segs,s1:c.length*(i+1)/segs});}
      if(extra.length||dashStrips.length){L.push(`g ${r.id}_markings`);emit(extra,0.02);emit(dashStrips,0.02);}
    }
    // kerb walls
    if(S.exportKerbs&&(r.kerbL||r.kerbR)){
      L.push(`g ${r.id}_kerbs`);
      for(const [on,d] of [[r.kerbL,ex.dMax],[r.kerbR,ex.dMin]]){if(!on)continue;
        const segs=Math.min(600,Math.max(8,Math.ceil(c.length/4)));let prev=null;
        for(let i=0;i<=segs;i++){const p=pointAt(r,c.length*i/segs);const t=worldAt(r,p,d);t.y+=0.005;const b={x:t.x,y:t.y-0.3,z:t.z};
          const b0=vi;V(t);V(b);vi+=2;
          if(prev!==null){L.push(`f ${prev} ${prev+1} ${b0+1}`,`f ${prev} ${b0+1} ${b0}`);L.push(`f ${prev} ${b0} ${b0+1}`,`f ${prev} ${b0+1} ${prev+1}`);tris+=4;}
          prev=b0;}}
    }
  }
  return {text:L.join('\n')+'\n',tris,verts:vi-1};
}
function estimateTris(){
  let t=0;for(const r of S.project.roads){const c=r._c;if(!c||c.length<2)continue;
    const n=Math.min(3000,Math.max(8,Math.ceil(c.length/S.exportStep)));t+=n*6*2*1.25;}
  return Math.round(t);
}
function exportOBJ(){
  const t0=performance.now(),{text,tris,verts}=buildOBJ(S.exportStep);
  download(new Blob([text],{type:'text/plain'}),S.project.name.replace(/[^\w\-]+/g,'-').toLowerCase()+'.obj');
  toast(`OBJ exported · ${fmtInt(tris)} tris · ${fmtInt(verts)} verts · ${fmt((performance.now()-t0)/1000,2)}s`);
}
function exportCSV(){
  const L=['road,station,x,y,z,tan_x,tan_z,grade_pct,radius_m,super_pct'];
  for(const r of S.project.roads){const c=r._c;if(!c)continue;
    for(const p of c.pts){const R=Math.abs(p.k)>1e-7?1/Math.abs(p.k):0;
      L.push([r.id,r3(p.s),r3(p.x),r3(p.y),r3(p.z),r3(p.tx),r3(p.tz),r3(p.grade),r3(R),r3(p.e*100)].join(','));}}
  download(new Blob([L.join('\n')],{type:'text/csv'}),S.project.name.replace(/[^\w\-]+/g,'-').toLowerCase()+'.csv');
  toast('Centerline CSV exported');
}

    <div class="expcard"><b>${icon('camera','ico16')}Snapshots</b><p>Pixel captures of the current views, exactly as styled on screen.</p>
      <div class="btnrow"><button class="btn sm" data-e="png-plan">Plan</button><button class="btn sm" data-e="png-profile">Profile</button><button class="btn sm" data-e="png-section">Section</button><button class="btn sm" data-e="png-3d">3D</button></div></div>
    <div class="expcard"><b>${icon('warn','ico16')}Danger zone</b><p>Start over with the bundled sample corridor. Current work is discarded (undo history cleared).</p>
      <div class="btnrow"><button class="btn danger" data-e="reset">Reset to sample</button></div></div>`;
  wireControls(box,{range:k=>RANGES[k]||{min:0,max:1,step:1},get:k=>S[k],
    set:(k,v)=>{S[k]=v;const est=box.querySelector('#objEst');
      if(est)est.textContent=`Y-up, metre mesh: surface, markings, kerbs — grouped per road. ≈ ${fmtInt(estimateTris())} tris at ${S.exportStep} m`;},commit:()=>{}});
  box.querySelector('[data-e="json"]').onclick=saveJSON;
  box.querySelector('[data-e="copy"]').onclick=()=>navigator.clipboard.writeText(json).then(()=>toast('Engine JSON copied to clipboard')).catch(()=>toast('Clipboard blocked by browser'));
  box.querySelector('[data-e="obj"]').onclick=exportOBJ;
  box.querySelector('[data-e="csv"]').onclick=exportCSV;
  box.querySelector('[data-e="png-plan"]').onclick=()=>exportPNG('plan');
  box.querySelector('[data-e="png-profile"]').onclick=()=>exportPNG('profile');
  box.querySelector('[data-e="png-section"]').onclick=()=>exportPNG('section');
  box.querySelector('[data-e="png-3d"]').onclick=()=>exportPNG('3d');
  box.querySelector('[data-e="reset"]').onclick=()=>{if(!confirm('Reset to the sample corridor?'))return;
    S.project=sampleProject();S.sel={road:'R1',nodes:new Set(),jx:null};S.history=[];S.hIndex=-1;
    $('projName').value=S.project.name;commit('Reset');frameAll();fullRefresh();};
}

/* ════════════════ dialogs ════════════════ */
function openDlg(html){$('dlg').innerHTML=html;$('scrim').classList.add('open');}
function closeDlg(){$('scrim').classList.remove('open');}
$('scrim').addEventListener('pointerdown',e=>{if(e.target===$('scrim'))closeDlg();});
function showHelp(){
  openDlg(`<h2>${icon('help','ico18')}Road Editor — guide</h2>
  <div class="sub">Spline roads for the Frontier engine · metres · Y-up · OBJ + JSON export</div>
  <div class="keys">
    <div><span>Select / Draw / Measure / Pan</span><span><span class="kbd">V</span> <span class="kbd">D</span> <span class="kbd">M</span> <span class="kbd">P</span></span></div>
    <div><span>New road (then click to trace)</span><span class="kbd">N</span></div>
    <div><span>Finish draw / clear measure</span><span class="kbd">Enter</span></div>
    <div><span>Insert node on road</span><span>double-click</span></div>
    <div><span>Delete node</span><span><span class="kbd">Alt</span>+click · <span class="kbd">Del</span></span></div>
    <div><span>Nudge selected nodes</span><span class="kbd">←↑↓→</span></div>
    <div><span>Snapping on/off</span><span class="kbd">G</span></div>
    <div><span>Frame all / selected road</span><span><span class="kbd">F</span> <span class="kbd">Shift</span>+<span class="kbd">F</span></span></div>
    <div><span>Step section station</span><span><span class="kbd">[</span> <span class="kbd">]</span></span></div>
    <div><span>Undo / redo</span><span><span class="kbd">Ctrl Z</span> <span class="kbd">Ctrl Y</span></span></div>
    <div><span>Save JSON / open JSON</span><span><span class="kbd">Ctrl S</span> <span class="kbd">Ctrl O</span></span></div>
    <div><span>Temporary pan (hold)</span><span class="kbd">Space</span></div>
  </div>
  <div class="hint" style="margin-top:12px"><b style="color:var(--t1)">Workflow.</b> Trace centrelines in plan, tune elevations in the profile (drag the handles), set the cross-section in the inspector, then check curvature / grade / super overlays. Junctions appear automatically where centrelines cross near level — right-click a road to split it there. Export OBJ for meshes, JSON for the live engine format, CSV for analysis.</div>
  <div class="hint"><b style="color:var(--t1)">Conventions.</b> Stations run along driving direction (first → last node). Lateral + is the left of travel. Superelevation banks into curves automatically from design speed; crowns, shoulders and kerbs stack in the section view.</div>
  <div class="btnrow" style="margin-top:14px"><button class="btn primary" id="dlgClose">Back to editing</button></div>`);
  $('dlgClose').onclick=closeDlg;
}

/* ════════════════ keyboard ════════════════ */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  if(tag==='input'&&e.key!=='Escape')return;
  if(e.key===' '){spaceDown=true;if(e.target===document.body)e.preventDefault();return;}
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();redo();return;}
  if((e.ctrlKey||e.metaKey)&&k==='s'){e.preventDefault();saveJSON();return;}
  if((e.ctrlKey||e.metaKey)&&k==='o'){e.preventDefault();$('fileOpen').click();return;}
  if(e.key==='Escape'){
    if($('scrim').classList.contains('open'))closeDlg();
    else if(S.tool==='draw'){setTool('select');}
    else if(S.tool==='measure'){S.measure=[];drawPlan();}
    else{S.sel.nodes.clear();S.sel.jx=null;fullRefresh();}
    stageToast(null);return;}
  if(e.key==='Enter'&&S.tool==='draw'){setTool('select');stageToast(null);return;}
  if(k==='v')setTool('select');else if(k==='d')setTool('draw');else if(k==='m')setTool('measure');else if(k==='p')setTool('pan');
  else if(k==='g')$('btnSnap').click();else if(k==='n')newRoad();
  else if(k==='f'){e.shiftKey&&selRoad()?frameRoad(selRoad()):frameAll();}
  else if(k==='h')showHelp();
  else if((e.key==='Delete'||e.key==='Backspace')&&S.sel.nodes.size&&selRoad()&&!selRoad().locked)deleteNodes(selRoad(),new Set(S.sel.nodes));
  else if(e.key==='['||e.key===']'){const r=selRoad();if(r&&r._c){S.station=clamp(S.station+(e.key===']'?5:-5),0,r._c.length);drawPlan();drawProfile();drawXsec();renderXsecSide();}}
  else if(e.key.startsWith('Arrow')&&S.sel.nodes.size&&selRoad()&&!selRoad().locked){
    e.preventDefault();const st=e.shiftKey?S.gridSize:0.5;
    const dx=e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,dz=e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0;
    for(const id of S.sel.nodes){const nd=nodeById(selRoad(),id);if(nd){nd.x=+(nd.x+dx).toFixed(2);nd.z=+(nd.z+dz).toFixed(2);}}
    rebuildRoad(selRoad());rebuildJunctions();commit('Nudge');fullRefresh();}
});
document.addEventListener('keyup',e=>{if(e.key===' ')spaceDown=false;});
window.addEventListener('resize',()=>{drawPlan();drawProfile();drawXsec();draw3D();});

/* ════════════════ boot ════════════════ */
function boot(){
  initToolbar();
  let restored=false;
  try{const raw=localStorage.getItem('frontier-road-editor:v1');
    if(raw){const o=JSON.parse(raw);
      if(o&&o.project&&Array.isArray(o.project.roads)&&o.project.roads.length){
        S.project={name:o.project.name,grid:o.project.grid||10,roads:o.project.roads};
        S.project.roads.forEach(r=>{r._c=null;rebuildRoad(r);});
        S.gridSize=S.project.grid;syncUid();restored=true;}}}catch(e){}
  if(!restored)S.project=sampleProject();
  S.sel={road:S.project.roads[0]?S.project.roads[0].id:null,nodes:new Set(),jx:null};
  S.project.roads.forEach(r=>S.expanded.add(r.id));
  $('projName').value=S.project.name;
  rebuildJunctions();runChecks();
  S.history=[];S.hIndex=-1;commit('Open');
  S.dirty=false;$('saveState').innerHTML='<span class="dirtydot" style="display:inline-block;background:var(--green)"></span>ready';
  renderDockTabs();fullRefresh();frameAll();
  $('planLegend').innerHTML=[['#2c2d33','Formation'],['rgba(240,240,240,.8)','Markings'],['#FFB454','Junction'],['#7BDEDA','Measure']]
    .map(([c,n])=>`<span class="li"><span class="sw" style="background:${c}"></span>${n}</span>`).join('');
  toast(restored?'Autosave restored — keep editing, or reset in the Export tab':'Sample corridor loaded — press <span class="kbd">H</span> for the guide, <span class="kbd">N</span> to trace a road');
}
boot();
</script>
