<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frontier — Foliage Sketcher</title>
<link rel="stylesheet" href="SlateKit.css">
</head>
<body>

<canvas id="Viewport"></canvas>

<!-- ══ brand chip ══════════════════════════════════════════════════════════════════════════════════════════════ -->
<div id="Brand">
  <div class="bmark">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
    </svg>
  </div>
  <div>
    <div class="bt">Foliage Sketcher</div>
    <div class="bs">Frontier · Tools</div>
  </div>
</div>

<!-- ══ live readout ════════════════════════════════════════════════════════════════════════════════════════════ -->
<div id="Readout">
  <div class="rrow"><span class="rk">Frame</span><span class="rv" id="ReadFrame">—</span></div>
  <div class="rrow"><span class="rk">Solve (GPU)</span><span class="rv" id="ReadSolve">—</span></div>
  <div class="rrow"><span class="rk">Joints</span><span class="rv" id="ReadJoints">—</span></div>
  <div class="rrow"><span class="rk">Cards</span><span class="rv" id="ReadCards">—</span></div>
  <div class="rrow"><span class="rk">Draws</span><span class="rv" id="ReadDraws">—</span></div>
</div>

<!-- ══ hints ═══════════════════════════════════════════════════════════════════════════════════════════════════ -->
<div id="Hint">
  <span class="kbd"><b>LMB</b> orbit</span>
  <span class="kbd"><b>RMB</b> / <b>MMB</b> pan</span>
  <span class="kbd"><b>Wheel</b> dolly</span>
  <span class="kbd"><b>Drag the sphere</b> to push the plants</span>
  <span class="kbd"><b>Space</b> gust</span>
</div>

<!-- ══ docket ══════════════════════════════════════════════════════════════════════════════════════════════════ -->
<div id="Docket" class="panel">

  <div class="panel-header">
    <div class="ph-icon">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v8"/><path d="M12 22v-6"/><path d="M5 10a7 7 0 0 0 7 6 7 7 0 0 0 7-6"/><path d="M8 5a4 4 0 0 1 8 0"/>
      </svg>
    </div>
    <div>
      <div class="ph-title">Plant Generator</div>
      <div class="ph-sub" id="DocketSub">Procedural growth · GPU filament physics</div>
    </div>
    <div class="spacer"></div>
    <button class="riconbtn" id="ShufflePlant" title="New seed">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
      </svg>
    </button>
  </div>

  <div style="padding:14px 20px 0;flex-shrink:0">
    <div class="chips" id="TabStrip"></div>
  </div>

  <div class="panel-body" id="DocketBody"></div>

  <div class="panel-footer">
    <div class="hint" id="DocketHint">—</div>
    <button class="btn ghost small" id="ResetSpecies">Reset</button>
    <button class="btn primary small" id="RegrowPlant">Regrow</button>
  </div>
</div>

<!-- ══ boot curtain ════════════════════════════════════════════════════════════════════════════════════════════ -->
<div id="Curtain">
  <div class="cmark">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
    </svg>
  </div>
  <div class="ct">Foliage Sketcher</div>
  <div class="cs" id="CurtainNote">Decoding foliage sheet…</div>
</div>

<script type="module" src="SketcherHost.mjs"></script>
</body>
</html>
