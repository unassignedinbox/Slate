name: Windows MSVC

on:
  push:
    branches: [main, arena/01a0fd48-slate]
    paths:
      - '.github/workflows/windows-msvc.yml'
      - 'Frontier/**'
      - 'VisualProof/DistanceFieldGI/**'
      - 'Exhibits/Assets/ShaderBall/**'
      - '.gitattributes'
  pull_request:
    paths:
      - '.github/workflows/windows-msvc.yml'
      - 'Frontier/**'
      - 'VisualProof/DistanceFieldGI/**'
      - 'Exhibits/Assets/ShaderBall/**'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      export_browser_run:
        description: 'Optional: export an already-executed browser proof run instead of building'
        required: false
        default: ''
      export_sdf_run:
        description: 'The already-executed SDF proof run to retain alongside the browser'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-msvc-${{ github.ref }}-${{ inputs.export_browser_run || (contains(github.event.head_commit.message, '[export-executed-pixels]') && 'export') || 'build' }}
  cancel-in-progress: true

jobs:
  export-executed-pixels:
    if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.export_browser_run && inputs.export_sdf_run) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[export-executed-pixels]'))) && github.ref == 'refs/heads/arena/01a0fd48-slate' }}
    name: Retain already-executed native and SDF pixels
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Download exact readbacks and retain on the session branch
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RUN: ${{ inputs.export_browser_run || '37194740044' }}
          SDF_RUN: ${{ inputs.export_sdf_run || '37194740044' }}
        run: |
          python3 VisualProof/ProjectOpening/ExportExecutionProofs.py "$BROWSER_RUN" "$SDF_RUN"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VisualProof/ProjectOpening/ProjectBrowserWindows.png VisualProof/ProjectOpening/Provenance.json VisualProof/DistanceFieldGI
          if ! git diff --cached --quiet; then
            git commit -m 'Retain executed DX11 card and production SDF pixel proofs [skip ci]'
            git push origin HEAD:arena/01a0fd48-slate
          fi

  sdf-execution:
    if: ${{ !inputs.export_browser_run && !contains(github.event.head_commit.message, '[export-executed-pixels]') }}
    name: SDF production Vulkan execution and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install software Vulkan and validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslc spirv-tools gdb
      - name: Execute production SDF shaders with synchronization validation
        run: python3 VisualProof/DistanceFieldGI/RunDistanceFieldExecution.py
      - name: Retain Vulkan execution evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sdf-vulkan-execution-${{ github.sha }}
          retention-days: 14
          path: |
            _AgentScratch/build/sdf-execution/*.log
            _AgentScratch/build/sdf-execution/Images/*.png
            _AgentScratch/build/sdf-execution/Images/*.ppm
            _AgentScratch/build/sdf-execution/Shaders/

  project-opening:
    if: ${{ !inputs.export_browser_run && !contains(github.event.head_commit.message, '[export-executed-pixels]') }}
    name: Project browser real Win32 DX11 and shared ImGui checks
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: Frontier
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile and execute the actual Windows project browser
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$VisualStudio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VisualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python Tools/Bootstrap.py --package imgui --package stb
          if ($LASTEXITCODE -ne 0) { throw 'Browser dependencies failed' }
          python Tools/Tests/CheckProjectOpening.py
          if ($LASTEXITCODE -ne 0) { throw 'Native project browser checks failed' }
      - name: Retain actual DX11 readback and shared UI proofs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: project-opening-${{ github.sha }}
          retention-days: 14
          path: |
            _AgentScratch/build/project-opening/*.log
            _AgentScratch/build/project-opening/*.png
            _AgentScratch/build/project-opening/*.ppm

  solidarc:
    if: ${{ !inputs.export_browser_run && !contains(github.event.head_commit.message, '[export-executed-pixels]') }}
    name: SolidArc MSVC and document checks
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: Frontier
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile and verify with real MSVC
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { throw 'Visual Studio C++ workload not found' }
          Import-Module "$VisualStudio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VisualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python Tools/Build/CheckMsvcSolidArc.py
          if ($LASTEXITCODE -ne 0) { throw 'SolidArc MSVC verification failed' }
      - name: Retain compiler logs and rendered proofs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solidarc-msvc-${{ github.sha }}
          retention-days: 14
          path: |
            _AgentScratch/build/msvc-solidarc/logs/
            _AgentScratch/build/msvc-solidarc/proofs/
            _AgentScratch/build/msvc-solidarc/*.exe

  drive-playback:
    if: ${{ !inputs.export_browser_run && !contains(github.event.head_commit.message, '[export-executed-pixels]') }}
    name: Drive MSVC playback and outliner checks
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
        working-directory: Frontier
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Exercise native project and scene callbacks
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$VisualStudio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VisualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python Tools/Bootstrap.py --package vulkan-headers --package cgltf --package stb --package ufbx
          if ($LASTEXITCODE -ne 0) { throw 'Drive check dependencies failed' }
          python Tools/Tests/CheckDrivePlayback.py
          if ($LASTEXITCODE -ne 0) { throw 'Drive playback or scene placement checks failed' }

  frontier:
    permissions:
      contents: write
    needs: [sdf-execution, project-opening]
    # Retain failure diagnostics, but do not launch another build from a superseded run.
    if: ${{ always() && !cancelled() && !inputs.export_browser_run && !contains(github.event.head_commit.message, '[export-executed-pixels]') }}
    name: Frontier + Project-Zero + Project-Drive
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: Frontier
    env:
      SDF_VULKAN_EXECUTION_VERIFIED: ${{ needs.sdf-execution.result == 'success' && '1' || '0' }}
      VULKAN_VERSION: '1.4.328.1'
      VULKAN_SDK: 'C:\VulkanSDK\1.4.328.1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install signed Vulkan SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK.exe'
          $Url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Invoke-WebRequest -Uri $Url -OutFile $Installer
          $Signature = Get-AuthenticodeSignature $Installer
          if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notmatch 'LunarG') {
            throw "Unexpected SDK installer signature: $($Signature.Status) $($Signature.SignerCertificate.Subject)"
          }
          Get-FileHash $Installer -Algorithm SHA256
          $Installation = Start-Process -FilePath $Installer -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait -PassThru
          if ($Installation.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($Installation.ExitCode)" }
          if (-not (Test-Path "$env:VULKAN_SDK\Include\vulkan\vulkan.h")) { throw 'SDK headers not installed' }
      - name: Build the Windows host and project code image
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { throw 'Visual Studio C++ workload not found' }
          Import-Module "$VisualStudio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VisualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Force ../_AgentScratch/logs/msvc-ci | Out-Null
          Start-Transcript -Path ../_AgentScratch/logs/msvc-ci/FrontierBuild.log
          try {
            & ./Tools/Build/ToolchainSequence.ps1 -Configuration Release -SetupDependencies -Parallel 2 *>&1 | Tee-Object -FilePath ../_AgentScratch/logs/msvc-ci/CompilerOutput.log
            if ($LASTEXITCODE -ne 0) { throw 'Frontier build failed' }
            if (-not (Test-Path Build/Output/Windows/Release/Binary/Frontier.exe)) { throw 'Frontier.exe was not produced' }
            python Tools/Tests/CheckViewportPrograms.py
            if ($LASTEXITCODE -ne 0) { throw 'Compiled viewport program checks failed' }
            python Tools/Tests/CheckDrivePlayback.py
            if ($LASTEXITCODE -ne 0) { throw 'Drive playback or scene placement checks failed' }
            & ../VisualProof/DistanceFieldGI/BuildDistanceFieldGIProof.ps1 *>&1 | Tee-Object -FilePath ../_AgentScratch/logs/msvc-ci/SdfProof.log
            if ($LASTEXITCODE -ne 0) { throw 'SDF CPU proof or GPU dispatch refusal checks failed' }
          } catch {
            $CompilerLog = Get-Content ../_AgentScratch/logs/msvc-ci/CompilerOutput.log, ../_AgentScratch/logs/msvc-ci/SdfProof.log -ErrorAction SilentlyContinue
            $Failures = $CompilerLog | Select-String -Pattern '(fatal error|error [A-Z]+[0-9]+|error:|LNK[0-9]+|FAILED)'
            $Diagnostic = ($_ | Out-String) + ($Failures | Out-String -Width 4096)
            if (-not $Failures) { $Diagnostic += ($CompilerLog | Select-Object -Last 30 | Out-String -Width 4096) }
            for ($Offset = 0; $Offset -lt $Diagnostic.Length; $Offset += 3000) {
              $Part = $Diagnostic.Substring($Offset, [Math]::Min(3000, $Diagnostic.Length - $Offset))
              $Part = $Part.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Frontier build::$Part"
            }
            throw
          } finally {
            Stop-Transcript
          }
      - name: Package and verify project DLLs and opening-scene imports
        run: |
          $env:PATH = "$env:VULKAN_SDK\Bin;$env:PATH"
          python Tools/Build/PackageWindowsProjects.py *>&1 | Tee-Object -FilePath ../_AgentScratch/logs/msvc-ci/ProjectPackage.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows project packaging, DLL or scene-import verification failed' }
      - name: Retain runnable Windows ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontier-windows-zip-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: |
            _AgentScratch/build/Frontier-Windows-x64-*.zip
            _AgentScratch/build/Frontier-Windows-x64-*.sha256
            _AgentScratch/build/Frontier-Windows-Release/Docs/ProjectBrowser.png
            _AgentScratch/build/Frontier-Windows-Release/BuildManifest.json
      - name: Publish downloadable Windows test build
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/arena/01a0fd48-slate' && needs.project-opening.result == 'success' && needs.sdf-execution.result == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Revision = $env:GITHUB_SHA.Substring(0,7)
          $Tag = "frontier-browser-$Revision"
          $Archive = "../_AgentScratch/build/Frontier-Windows-x64-$Revision.zip"
          $Checksum = "../_AgentScratch/build/Frontier-Windows-x64-$Revision.sha256"
          $Preview = "../_AgentScratch/build/Frontier-Windows-Release/Docs/ProjectBrowser.png"
          $Manifest = "../_AgentScratch/build/Frontier-Windows-Release/BuildManifest.json"
          gh release create $Tag $Archive $Checksum $Preview $Manifest --target $env:GITHUB_SHA --prerelease --title "Frontier Windows x64 - OLED project browser ($Revision)" --notes "Extract the entire ZIP and run Frontier.exe. OLED-black browser with white pill controls, circular close button and folder-configurable project previews. Both projects, content, shaders and app-local Visual C++ runtime included. Put an image in Projects/Project-Drive/Preview or Projects/Project-Zero/Preview, then Scan; any image filename overrides the bundled picture. Native DX11 browser and packaged scene imports verified in CI; physical-GPU gameplay still requires testing. Unsigned test build."
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP release publication failed' }
      - name: Build and exercise runnable SolidArc application
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module "$VisualStudio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VisualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python Tools/Build/BuildSolidArcApplication.py
          if ($LASTEXITCODE -ne 0) { throw 'SolidArc application build/presentation verification failed' }
      - name: Retain SolidArc application diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solidarc-application-evidence-${{ github.sha }}
          retention-days: 14
          path: |
            _AgentScratch/build/solidarc-application/*.log
            _AgentScratch/build/solidarc-application/Presentation/
      - name: Retain runnable SolidArc
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solidarc-application-windows-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: _AgentScratch/build/SolidArc-Windows-Release/
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontier-msvc-${{ github.sha }}
          retention-days: 14
          path: |
            _AgentScratch/logs/msvc-ci/
            _AgentScratch/build/distancefield/VisualProof/DistanceFieldGI/
            Frontier/build/dependencies-Release/CMakeFiles/CMakeConfigureLog.yaml
            Frontier/Build/Output/Windows/Release/Object/*.rsp
      - name: Retain Windows binary
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontier-windows-release-${{ github.sha }}
          retention-days: 14
          path: |
            Frontier/Build/Output/Windows/Release/Binary/
            Frontier/Projects/Project-Zero/Build/*.dll
            Frontier/Projects/Project-Drive/Build/*.dll
      - name: Retain Frontier with both projects
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontier-projects-windows-release-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: _AgentScratch/build/Frontier-Windows-Release/
