name: Windows MSVC

on:
  push:
    branches: [main, arena/01a0fd48-slate]
    paths:
      - '.github/workflows/windows-msvc.yml'
      - 'Frontier/**'
      - '.gitattributes'
  pull_request:
    paths:
      - '.github/workflows/windows-msvc.yml'
      - 'Frontier/**'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msvc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solidarc:
    name: SolidArc MSVC and document checks
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: Frontier
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Compile and verify with real MSVC
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { throw 'Visual Studio C++ workload not found' }
          Import-Module "$VisualStudio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VisualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          python Tools/Build/CheckMsvcSolidArc.py
          if ($LASTEXITCODE -ne 0) { throw 'SolidArc MSVC verification failed' }
      - name: Retain compiler logs and rendered proofs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: solidarc-msvc-${{ github.sha }}
          retention-days: 14
          path: |
            _AgentScratch/build/msvc-solidarc/logs/
            _AgentScratch/build/msvc-solidarc/proofs/
            _AgentScratch/build/msvc-solidarc/*.exe

  frontier:
    name: Frontier + Project-Zero + Project-Drive
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: Frontier
    env:
      VULKAN_VERSION: '1.4.328.1'
      VULKAN_SDK: 'C:\VulkanSDK\1.4.328.1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install signed Vulkan SDK
        run: |
          $ErrorActionPreference = 'Stop'
          $Installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK.exe'
          $Url = "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          Invoke-WebRequest -Uri $Url -OutFile $Installer
          $Signature = Get-AuthenticodeSignature $Installer
          if ($Signature.Status -ne 'Valid' -or $Signature.SignerCertificate.Subject -notmatch 'LunarG') {
            throw "Unexpected SDK installer signature: $($Signature.Status) $($Signature.SignerCertificate.Subject)"
          }
          Get-FileHash $Installer -Algorithm SHA256
          $Installation = Start-Process -FilePath $Installer -ArgumentList '--accept-licenses --default-answer --confirm-command install' -Wait -PassThru
          if ($Installation.ExitCode -ne 0) { throw "Vulkan SDK installation failed: $($Installation.ExitCode)" }
          if (-not (Test-Path "$env:VULKAN_SDK\Include\vulkan\vulkan.h")) { throw 'SDK headers not installed' }
      - name: Build the Windows host and project code image
        run: |
          $ErrorActionPreference = 'Stop'
          $VsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $VisualStudio = & $VsWhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $VisualStudio) { throw 'Visual Studio C++ workload not found' }
          Import-Module "$VisualStudio\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $VisualStudio -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          New-Item -ItemType Directory -Force ../_AgentScratch/logs/msvc-ci | Out-Null
          Start-Transcript -Path ../_AgentScratch/logs/msvc-ci/FrontierBuild.log
          try {
            & ./Tools/Build/ToolchainSequence.ps1 -Configuration Release -SetupDependencies -Parallel 2 *>&1 | Tee-Object -FilePath ../_AgentScratch/logs/msvc-ci/CompilerOutput.log
            if ($LASTEXITCODE -ne 0) { throw 'Frontier build failed' }
            if (-not (Test-Path Build/Output/Windows/Release/Binary/Frontier.exe)) { throw 'Frontier.exe was not produced' }
          } catch {
            $CompilerLog = Get-Content ../_AgentScratch/logs/msvc-ci/CompilerOutput.log -ErrorAction SilentlyContinue
            $Failures = $CompilerLog | Select-String -Pattern '(fatal error|error [A-Z]+[0-9]+|error:|LNK[0-9]+|FAILED)'
            $Diagnostic = ($_ | Out-String) + ($Failures | Out-String -Width 4096)
            if (-not $Failures) { $Diagnostic += ($CompilerLog | Select-Object -Last 30 | Out-String -Width 4096) }
            for ($Offset = 0; $Offset -lt $Diagnostic.Length; $Offset += 3000) {
              $Part = $Diagnostic.Substring($Offset, [Math]::Min(3000, $Diagnostic.Length - $Offset))
              $Part = $Part.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error title=Frontier build::$Part"
            }
            throw
          } finally {
            Stop-Transcript
          }
      - name: Package and verify Project-Zero and Project-Drive
        run: |
          python Tools/Build/PackageWindowsProjects.py *>&1 | Tee-Object -FilePath ../_AgentScratch/logs/msvc-ci/ProjectPackage.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows project packaging or DLL verification failed' }
      - name: Retain build diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontier-msvc-${{ github.sha }}
          retention-days: 14
          path: |
            _AgentScratch/logs/msvc-ci/
            Frontier/build/dependencies-Release/CMakeFiles/CMakeConfigureLog.yaml
            Frontier/Build/Output/Windows/Release/Object/*.rsp
      - name: Retain Windows binary
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontier-windows-release-${{ github.sha }}
          retention-days: 14
          path: |
            Frontier/Build/Output/Windows/Release/Binary/
            Frontier/Projects/Project-Zero/Build/*.dll
            Frontier/Projects/Project-Drive/Build/*.dll
      - name: Retain Frontier with both projects
        if: success()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontier-projects-windows-release-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: _AgentScratch/build/Frontier-Windows-Release/
