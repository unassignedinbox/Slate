// ------------------------------------------------------------------------------------------------------------------------------------------------------------
//  OrbitSolver — minimal orbiting camera over a Z-up scene.
// ------------------------------------------------------------------------------------------------------------------------------------------------------------
function Mat4Perspective(fovY, aspect, near, far)
{
    const f = 1 / Math.tan(fovY * 0.5);
    return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) / (near - far), -1,
        0, 0, (2 * far * near) / (near - far), 0
    ]);
}

function Mat4LookAt(eye, centre, up)
{
    let zx = eye[0] - centre[0], zy = eye[1] - centre[1], zz = eye[2] - centre[2];
    let l = Math.hypot(zx, zy, zz) || 1; zx /= l; zy /= l; zz /= l;
    let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
    l = Math.hypot(xx, xy, xz) || 1; xx /= l; xy /= l; xz /= l;
    const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
    return new Float32Array([
        xx, yx, zx, 0,
        xy, yy, zy, 0,
        xz, yz, zz, 0,
        -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
        -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
        -(zx * eye[0] + zy * eye[1] + zz * eye[2]), 1
    ]);
}

function Mat4Multiply(a, b)
{
    const o = new Float32Array(16);
    for (let c = 0; c < 4; c++)
        for (let r = 0; r < 4; r++)
        {
            let s = 0;
            for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
            o[c * 4 + r] = s;
        }
    return o;
}

const OrbitSolver =
{
    yaw: 0.85, pitch: 0.18, distance: 1.15,
    target: [0, 0, 0.30],

    eye()
    {
        const cp = Math.cos(this.pitch);
        return [
            this.target[0] + this.distance * cp * Math.cos(this.yaw),
            this.target[1] + this.distance * cp * Math.sin(this.yaw),
            this.target[2] + this.distance * Math.sin(this.pitch)
        ];
    },

    viewProjection(aspect)
    {
        const proj = Mat4Perspective(50 * Math.PI / 180, aspect, 0.01, 60);
        const view = Mat4LookAt(this.eye(), this.target, [0, 0, 1]);
        return Mat4Multiply(proj, view);
    },

    attach(canvas)
    {
        let dragging = false, mode = 0, lx = 0, ly = 0;
        canvas.addEventListener('pointerdown', (e) =>
        {
            dragging = true; mode = (e.button === 2 || e.shiftKey) ? 1 : 0;
            lx = e.clientX; ly = e.clientY; canvas.setPointerCapture(e.pointerId);
        });
        canvas.addEventListener('pointerup', (e) => { dragging = false; canvas.releasePointerCapture(e.pointerId); });
        canvas.addEventListener('pointermove', (e) =>
        {
            if (!dragging) return;
            const dx = e.clientX - lx, dy = e.clientY - ly;
            lx = e.clientX; ly = e.clientY;
            if (mode === 0)
            {
                this.yaw -= dx * 0.008;
                this.pitch = Clamp(this.pitch + dy * 0.008, -1.35, 1.35);
            }
            else
            {
                const pan = this.distance * 0.0016;
                const right = [Math.sin(this.yaw), -Math.cos(this.yaw), 0];
                for (let i = 0; i < 3; i++) this.target[i] -= right[i] * dx * pan;
                this.target[2] += dy * pan;
            }
        });
        canvas.addEventListener('wheel', (e) =>
        {
            e.preventDefault();
            this.distance = Clamp(this.distance * Math.exp(e.deltaY * 0.0012), 0.18, 8);
        }, { passive: false });
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    }
};

// ------------------------------------------------------------------------------------------------------------------------------------------------------------
//  Shaders
// ------------------------------------------------------------------------------------------------------------------------------------------------------------
const ShaderSource =
{
    piecesVertex: `#version 300 es
    precision highp float;
    in vec3 aPosition;
    in vec3 aNormal;
    in vec3 aColor;
    in vec3 aDebug;
    uniform mat4 uViewProjection;
    out vec3 vNormal;
    out vec3 vColor;
    out vec3 vDebug;
    out vec3 vWorld;
    void main()
    {
        vNormal = aNormal;
        vColor = aColor;
        vDebug = aDebug;
        vWorld = aPosition;
        gl_Position = uViewProjection * vec4(aPosition, 1.0);
    }`,

    piecesFragment: `#version 300 es
    precision highp float;
    in vec3 vNormal;
    in vec3 vColor;
    in vec3 vDebug;
    in vec3 vWorld;
    uniform vec3 uEye;
    uniform int uDebugMode;
    out vec4 outColour;
    void main()
    {
        vec3 base = vColor;
        if (uDebugMode == 1) base = vDebug;
        vec3 N = normalize(vNormal);
        vec3 V = normalize(uEye - vWorld);
        if (dot(N, V) < 0.0) N = -N;

        vec3 keyDir = normalize(vec3(0.55, -0.75, 0.65));
        vec3 fillDir = normalize(vec3(-0.6, 0.4, 0.25));
        float key = max(dot(N, keyDir), 0.0);
        float fill = max(dot(N, fillDir), 0.0);
        float sky = 0.5 + 0.5 * N.z;

        vec3 lit = base * (0.10 + 0.95 * key + 0.22 * fill + 0.20 * sky);
        vec3 H = normalize(keyDir + V);
        float spec = pow(max(dot(N, H), 0.0), 42.0) * 0.16;
        lit += vec3(spec);
        lit = pow(clamp(lit, 0.0, 1.0), vec3(1.0 / 2.2));
        outColour = vec4(lit, 1.0);
    }`,

    trunkVertex: `#version 300 es
    precision highp float;
    in vec3 aPosition;
    in vec3 aNormal;
    in vec2 aUv;
    uniform mat4 uViewProjection;
    out vec3 vNormal;
    out vec2 vUv;
    out vec3 vWorld;
    void main()
    {
        vNormal = aNormal;
        vUv = aUv;
        vWorld = aPosition;
        gl_Position = uViewProjection * vec4(aPosition, 1.0);
    }`,

    trunkFragment: `#version 300 es
    precision highp float;
    in vec3 vNormal;
    in vec2 vUv;
    in vec3 vWorld;
    uniform vec3 uEye;
    uniform vec3 uInnerColour;
    uniform float uInnerRoughness;
    uniform int uHasTextures;
    uniform sampler2D uAlbedo;
    uniform sampler2D uNormal;
    uniform sampler2D uOrm;
    out vec4 outColour;

    void main()
    {
        vec3 N = normalize(vNormal);
        vec3 V = normalize(uEye - vWorld);
        if (dot(N, V) < 0.0) N = -N;

        // Tangent frame: X runs along +u (increasing theta), Y along +v (up the trunk).
        vec3 T = normalize(cross(vec3(0.0, 0.0, 1.0), N));
        vec3 B = cross(N, T);

        vec3 base = uInnerColour;
        float rough = uInnerRoughness;
        float ao = 1.0;

        if (uHasTextures == 1)
        {
            vec4 albedo = texture(uAlbedo, vUv);
            vec3 nt = texture(uNormal, vUv).xyz * 2.0 - 1.0;
            vec3 orm = texture(uOrm, vUv).xyz;
            base = albedo.rgb;
            rough = orm.g;
            ao = orm.r;
            N = normalize(T * nt.x + B * nt.y + N * nt.z);
            if (dot(N, V) < 0.0) N = -N;
        }

        vec3 keyDir = normalize(vec3(0.55, -0.75, 0.65));
        vec3 fillDir = normalize(vec3(-0.6, 0.4, 0.25));
        float key = max(dot(N, keyDir), 0.0);
        float fill = max(dot(N, fillDir), 0.0);
        float sky = 0.5 + 0.5 * N.z;

        float gloss = mix(70.0, 6.0, rough);
        float specStrength = mix(0.30, 0.03, rough);

        vec3 lit = base * ao * (0.10 + 0.95 * key + 0.22 * fill + 0.20 * sky);
        vec3 H = normalize(keyDir + V);
        lit += vec3(specStrength * pow(max(dot(N, H), 0.0), gloss));
        lit = pow(clamp(lit, 0.0, 1.0), vec3(1.0 / 2.2));
        outColour = vec4(lit, 1.0);
    }`
};

// ------------------------------------------------------------------------------------------------------------------------------------------------------------
//  Compilation helpers
// ------------------------------------------------------------------------------------------------------------------------------------------------------------
function CompileProgram(gl, vertexSource, fragmentSource, label)
{
    const build = (type, source) =>
    {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS))
            throw new Error(`${label} ${type === gl.VERTEX_SHADER ? 'vertex' : 'fragment'} shader: ${gl.getShaderInfoLog(shader)}`);
        return shader;
    };
    const program = gl.createProgram();
    gl.attachShader(program, build(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, build(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS))
        throw new Error(`${label} link: ${gl.getProgramInfoLog(program)}`);
    return program;
}

function UniformMap(gl, program, names)
{
    const map = {};
    for (const n of names) map[n] = gl.getUniformLocation(program, n);
    return map;
}

// ------------------------------------------------------------------------------------------------------------------------------------------------------------
//  Colour helpers for the debug shading modes
// ------------------------------------------------------------------------------------------------------------------------------------------------------------
function HueColour(index)
{
    const h = (index * 0.381966) % 1;
    const a = h * 6, s = a - Math.floor(a);
    const c = [0, 0, 0];
    const sector = Math.floor(a) % 6;
    if (sector === 0) { c[0] = 1; c[1] = s; }
    else if (sector === 1) { c[0] = 1 - s; c[1] = 1; }
    else if (sector === 2) { c[1] = 1; c[2] = s; }
    else if (sector === 3) { c[1] = 1 - s; c[2] = 1; }
    else if (sector === 4) { c[0] = s; c[2] = 1; }
    else { c[0] = 1; c[2] = 1 - s; }
    const lift = 0.45;
    return [lift + c[0] * (1 - lift), lift + c[1] * (1 - lift), lift + c[2] * (1 - lift)];
}

function RampColour(t)
{
    const stops = [[0.10, 0.18, 0.55], [0.15, 0.62, 0.72], [0.35, 0.78, 0.35], [0.95, 0.82, 0.25], [0.92, 0.28, 0.18]];
    const x = Clamp(t, 0, 1) * (stops.length - 1);
    const i = Math.min(stops.length - 2, Math.floor(x));
    const f = x - i;
    return [
        Lerp(stops[i][0], stops[i + 1][0], f),
        Lerp(stops[i][1], stops[i + 1][1], f),
        Lerp(stops[i][2], stops[i + 1][2], f)
    ];
}

function BuildDebugFields(structure)
{
    const n = structure.vertexCount;
    const byCluster = new Float32Array(n * 3);
    const byPlate = new Float32Array(n * 3);
    const byRelief = new Float32Array(n * 3);
    let peak = 0;
    for (const piece of structure.pieces) if (piece.maxLift > peak) peak = piece.maxLift;
    const inv = peak > 0 ? 1 / peak : 0;

    for (const group of structure.ranges)
    {
        const piece = structure.pieces[group.piece];
        const c = HueColour(Math.max(0, piece.cluster) + 1);
        const p = HueColour(group.piece);
        const r = RampColour((piece.maxLift || 0) * inv);
        for (let v = group.start; v < group.start + group.count; v++)
        {
            const o = v * 3;
            byCluster[o] = c[0]; byCluster[o + 1] = c[1]; byCluster[o + 2] = c[2];
            byPlate[o] = p[0]; byPlate[o + 1] = p[1]; byPlate[o + 2] = p[2];
            byRelief[o] = r[0]; byRelief[o + 1] = r[1]; byRelief[o + 2] = r[2];
        }
    }
    return { byCluster, byPlate, byRelief };
}

                    });
                }
                else
                {
                    control = document.createElement('input');
                    control.type = 'range';
                    control.min = item.min; control.max = item.max; control.step = item.step;
                    control.value = state[item.key];
                    paint = () =>
                    {
                        const digits = item.digits === undefined ? 0 : item.digits;
                        readout.textContent = Number(control.value).toFixed(digits) + (item.unit ? ' ' + item.unit : '');
                    };
                    if (paint) paint();
                    control.addEventListener('input', () =>
                    {
                        state[item.key] = Number(control.value);
                        if (paint) paint();
                        onInput(item.key, false);
                    });
                    control.addEventListener('change', () => onInput(item.key, true));
                }

                field.appendChild(control);
                section.appendChild(field);
                this.inputs[item.key] = { control, item, paint };
            }
            container.appendChild(section);
        }

        const viewSection = document.createElement('div');
        viewSection.className = 'sec';
        const viewHeading = document.createElement('div');
        viewHeading.className = 'h';
        viewHeading.textContent = 'View';
        viewSection.appendChild(viewHeading);

        viewSection.appendChild(this.segmented('Surface', [['pieces', 'Simulated pieces'], ['baked', 'Baked texture']], state.view,
            (v) => { state.view = v; onInput('view', true); }));

        const shadeLabel = document.createElement('div');
        shadeLabel.className = 'h';
        shadeLabel.style.marginTop = '12px';
        shadeLabel.textContent = 'Shading';
        viewSection.appendChild(shadeLabel);
        viewSection.appendChild(this.segmented('shading', [['shaded', 'Lit'], ['clusters', 'Clusters'], ['plates', 'Plates'], ['relief', 'Relief']], state.shading,
            (v) => { state.shading = v; onInput('shading', true); }));
        container.appendChild(viewSection);

        const actionSection = document.createElement('div');
        actionSection.className = 'sec';
        const actionHeading = document.createElement('div');
        actionHeading.className = 'h';
        actionHeading.textContent = 'Output';
        actionSection.appendChild(actionHeading);
        const note = document.createElement('div');
        note.className = 'note';
        note.textContent = 'Albedo, normal and ORM are baked from the plates above. Normal is tangent space, X = +u, Y = +v, green = +v.';
        actionSection.appendChild(note);

        const pair = document.createElement('div');
        pair.className = 'row2';
        pair.style.marginBottom = '7px';
        const pngButton = document.createElement('button');
        pngButton.className = 'btn ghost';
        pngButton.textContent = 'PNG set';
        pngButton.addEventListener('click', () => onInput('exportPng', true));
        const jsonButton = document.createElement('button');
        jsonButton.className = 'btn ghost';
        jsonButton.textContent = 'Recipe';
        jsonButton.addEventListener('click', () => onInput('exportJson', true));
        pair.appendChild(pngButton);
        pair.appendChild(jsonButton);
        actionSection.appendChild(pair);

        const objButton = document.createElement('button');
        objButton.className = 'btn ghost';
        objButton.textContent = 'Plates as OBJ';
        objButton.addEventListener('click', () => onInput('exportObj', true));
        actionSection.appendChild(objButton);

        container.appendChild(actionSection);
    },

    segmented(key, options, current, onPick)
    {
        const wrap = document.createElement('div');
        wrap.className = 'seg';
        const buttons = [];
        for (const [value, text] of options)
        {
            const button = document.createElement('button');
            button.textContent = text;
            if (value === current) button.classList.add('on');
            button.addEventListener('click', () =>
            {
                for (const b of buttons) b.classList.remove('on');
                button.classList.add('on');
                onPick(value);
            });
            buttons.push(button);
            wrap.appendChild(button);
        }
        return wrap;
    },

    sync(state)
    {
        for (const key in this.inputs)
        {
            const entry = this.inputs[key];
            if (String(entry.control.value) === String(state[key])) continue;
            entry.control.value = state[key];
            if (entry.paint) entry.paint();
        }
    }
};

// ------------------------------------------------------------------------------------------------------------------------------------------------------------
//  BarkHost — root coordinator: owns the GL context, the rebuild pipeline and the export actions.
// ------------------------------------------------------------------------------------------------------------------------------------------------------------
const BarkHost =
{
    state: null,
    result: null,
    gl: null,
    canvas: null,

    init()
    {
        this.canvas = document.getElementById('stage');
        const gl = this.canvas.getContext('webgl2', { antialias: true, alpha: false });
        if (!gl)
        {
            document.getElementById('err').style.display = 'block';
            document.getElementById('err').textContent = 'WebGL2 is not available in this browser.';
            return false;
        }
        this.gl = gl;

        this.piecesProgram = CompileProgram(gl, ShaderSource.piecesVertex, ShaderSource.piecesFragment, 'pieces');
        this.trunkProgram = CompileProgram(gl, ShaderSource.trunkVertex, ShaderSource.trunkFragment, 'trunk');
        this.piecesUniforms = UniformMap(gl, this.piecesProgram, ['uViewProjection', 'uEye', 'uDebugMode']);
        this.trunkUniforms = UniformMap(gl, this.trunkProgram,
            ['uViewProjection', 'uEye', 'uInnerColour', 'uInnerRoughness', 'uHasTextures', 'uAlbedo', 'uNormal', 'uOrm']);

        this.piecesAttrib = {
            aPosition: gl.getAttribLocation(this.piecesProgram, 'aPosition'),
            aNormal: gl.getAttribLocation(this.piecesProgram, 'aNormal'),
            aColor: gl.getAttribLocation(this.piecesProgram, 'aColor'),
            aDebug: gl.getAttribLocation(this.piecesProgram, 'aDebug')
        };
        this.trunkAttrib = {
            aPosition: gl.getAttribLocation(this.trunkProgram, 'aPosition'),
            aNormal: gl.getAttribLocation(this.trunkProgram, 'aNormal'),
            aUv: gl.getAttribLocation(this.trunkProgram, 'aUv')
        };

        this.buffers = {};
        this.textures = {};
        for (const name of ['albedo', 'normal', 'orm'])
        {
            const texture = gl.createTexture();
            gl.bindTexture(gl.TEXTURE_2D, texture);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
            gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
            this.textures[name] = texture;
        }

        OrbitSolver.attach(this.canvas);
        gl.enable(gl.DEPTH_TEST);
        gl.enable(gl.CULL_FACE);
        gl.clearColor(0.027, 0.027, 0.039, 1);
        return true;
    },

    defaultState()
    {
        const preset = BarkSpecification.presets[0];
        return {
            species: preset.key, seed: 20250808, resolution: 1024,
            spacing: preset.spacing * 1000, stretch: preset.stretch,
            thickness: preset.thickness * 1000, gap: preset.gap * 1000,
            roughen: preset.roughen, coverage: preset.coverage * 100,
            clusterSize: preset.clusterSize * 1000,
            bareChance: preset.bareChance * 100, voidChance: preset.voidChance * 100,
            relaxIterations: preset.relaxIterations,
            view: 'pieces', shading: 'shaded'
        };
    },

    adoptPreset()
    {
        const preset = BarkSpecification.find(this.state.species);
        this.state.spacing = preset.spacing * 1000;
        this.state.stretch = preset.stretch;
        this.state.thickness = preset.thickness * 1000;
        this.state.gap = preset.gap * 1000;
        this.state.roughen = preset.roughen;
        this.state.coverage = preset.coverage * 100;
        this.state.clusterSize = preset.clusterSize * 1000;
        this.state.bareChance = preset.bareChance * 100;
        this.state.voidChance = preset.voidChance * 100;
        this.state.relaxIterations = preset.relaxIterations;
    },

    specification()
    {
        const s = this.state;
        return BarkSpecification.resolve(s.species, {
            spacing: s.spacing / 1000,
            stretch: s.stretch,
            thickness: s.thickness / 1000,
            gap: s.gap / 1000,
            roughen: s.roughen,
            coverage: s.coverage / 100,
            clusterSize: s.clusterSize / 1000,
            bareChance: s.bareChance / 100,
            voidChance: s.voidChance / 100,
            relaxIterations: s.relaxIterations
        });
    },

    async rebuild()
    {
        const veil = document.getElementById('veil');
        veil.classList.add('on');
        await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
        try
        {
            const spec = this.specification();
            const t0 = performance.now();
            this.result = BarkSequence.run(spec, {}, this.state.seed | 0, this.state.resolution);
            this.result.elapsed = performance.now() - t0;
            this.upload();
            this.refreshTextures();
            this.refreshReadout();
        }
        catch (error)
        {
            const box = document.getElementById('err');
            box.style.display = 'block';
            box.textContent = String(error && error.stack || error);
        }
        finally
        {
            veil.classList.remove('on');
        }
    },

    upload()
    {
        const gl = this.gl;
        const { trunk, structure } = this.result;
        const debug = BuildDebugFields(structure);
        this.debugFields = debug;

        const make = (name, data, target) =>
        {
            if (!this.buffers[name]) this.buffers[name] = gl.createBuffer();
            gl.bindBuffer(target, this.buffers[name]);
            gl.bufferData(target, data, gl.STATIC_DRAW);
        };

        make('piecePosition', structure.positions, gl.ARRAY_BUFFER);
        make('pieceNormal', structure.normals, gl.ARRAY_BUFFER);
        make('pieceColour', structure.colors, gl.ARRAY_BUFFER);
        make('pieceCluster', debug.byCluster, gl.ARRAY_BUFFER);
        make('piecePlate', debug.byPlate, gl.ARRAY_BUFFER);
        make('pieceRelief', debug.byRelief, gl.ARRAY_BUFFER);
        make('pieceIndex', structure.indices, gl.ELEMENT_ARRAY_BUFFER);

        make('trunkPosition', trunk.positions, gl.ARRAY_BUFFER);
        make('trunkNormal', trunk.normals, gl.ARRAY_BUFFER);
        make('trunkUv', trunk.uvs, gl.ARRAY_BUFFER);
        make('trunkIndex', trunk.indices, gl.ELEMENT_ARRAY_BUFFER);

        this.pieceIndexCount = structure.indices.length;
        this.trunkIndexCount = trunk.indices.length;
    },

    async refreshTextures()
    {
        const gl = this.gl;
        const projection = this.result.projection;
        const N = projection.resolution;
        for (const [name, data] of [['albedo', projection.albedo], ['normal', projection.normal], ['orm', projection.orm]])
        {
            gl.bindTexture(gl.TEXTURE_2D, this.textures[name]);
            // Row 0 of every field is v = 0 (the base of the trunk), so flip into the image's top-down order.
            gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB8, N, N, 0, gl.RGB, gl.UNSIGNED_BYTE, data, 0);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            gl.generateMipmap(gl.TEXTURE_2D);
        }
        this.updateStrip();
    },

    async updateStrip()
    {
        const strip = document.getElementById('strip');
        if (!this.result) return;
        const projection = this.result.projection;
        const N = projection.resolution;
        for (const [name, data] of [['albedo', projection.albedo], ['normal', projection.normal], ['orm', projection.orm]])
        {
            const png = await TextureCodec.encodePng(data, N, N, true);
            let element = strip.querySelector(`img[data-name="${name}"]`);
            if (!element)
            {
                const figure = document.createElement('figure');
                const caption = document.createElement('figcaption');
                caption.textContent = name;
                element = document.createElement('img');
                element.dataset.name = name;
                figure.appendChild(caption);
                figure.appendChild(element);
                strip.appendChild(figure);
            }
            if (this.stripUrls && this.stripUrls[name]) URL.revokeObjectURL(this.stripUrls[name]);
            const url = URL.createObjectURL(new Blob([png], { type: 'image/png' }));
            this.stripUrls = this.stripUrls || {};
            this.stripUrls[name] = url;
            element.src = url;
        }
    },

    refreshReadout()
    {
        const r = this.result;
        const st = r.structure.stats;
        const p = r.projection;
        document.getElementById('ro-species').textContent =
            `${r.spec.label} — ${r.trunk.width.toFixed(3)} m around × ${r.trunk.height.toFixed(2)} m tall`;
        TextureMetrics.render(document.getElementById('ro-list'), [
            ['clusters', st.clusters],
            ['seeds', st.seeds],
            ['plates', st.pieces + (st.lenticels ? ` +${st.lenticels}` : '')],
            ['triangles', r.structure.triangleCount.toLocaleString()],
            ['bake', `${p.resolution}²`],
            ['coverage', `${(p.coverage * 100).toFixed(1)} %`],
            ['relief', `${(p.maxHeight * 1000).toFixed(2)} mm`],
            ['bake time', `${p.elapsed.toFixed(0)} ms`],
            ['total', `${r.elapsed.toFixed(0)} ms`, r.elapsed > 1500 ? 'warn' : 'on']
        ]);
    },

    debugBuffer()
    {
        const mode = this.state.shading;
        if (mode === 'clusters') return { buffer: this.buffers.pieceCluster, mode: 1 };
        if (mode === 'plates') return { buffer: this.buffers.piecePlate, mode: 1 };
        if (mode === 'relief') return { buffer: this.buffers.pieceRelief, mode: 1 };
        return { buffer: this.buffers.pieceColour, mode: 0 };
    },

    draw()
    {
        const gl = this.gl;
        const canvas = this.canvas;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.round(canvas.clientWidth * dpr));
        const height = Math.max(1, Math.round(canvas.clientHeight * dpr));
        if (canvas.width !== width || canvas.height !== height) { canvas.width = width; canvas.height = height; }
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        if (!this.result) return;

        const viewProjection = OrbitSolver.viewProjection(canvas.clientWidth / Math.max(1, canvas.clientHeight));
        const eye = OrbitSolver.eye();
        const spec = this.result.spec;
        const inner = HexToRgb(spec.inner);

        // The trunk surface always draws: in "pieces" mode it is the inner bark showing through the fissures.
        const baked = this.state.view === 'baked';
        gl.disable(gl.CULL_FACE);
        gl.useProgram(this.trunkProgram);
        gl.uniformMatrix4fv(this.trunkUniforms.uViewProjection, false, viewProjection);
        gl.uniform3fv(this.trunkUniforms.uEye, eye);
        gl.uniform3f(this.trunkUniforms.uInnerColour, inner[0], inner[1], inner[2]);
        gl.uniform1f(this.trunkUniforms.uInnerRoughness, spec.roughInner);
        gl.uniform1i(this.trunkUniforms.uHasTextures, baked ? 1 : 0);
        if (baked)
        {
            gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, this.textures.albedo); gl.uniform1i(this.trunkUniforms.uAlbedo, 0);
            gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, this.textures.normal); gl.uniform1i(this.trunkUniforms.uNormal, 1);
            gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, this.textures.orm); gl.uniform1i(this.trunkUniforms.uOrm, 2);
        }
        this.bindTrunk();
        gl.drawElements(gl.TRIANGLES, this.trunkIndexCount, gl.UNSIGNED_INT, 0);

        if (!baked)
        {
            gl.enable(gl.CULL_FACE);
            const debug = this.debugBuffer();
            gl.useProgram(this.piecesProgram);
            gl.uniformMatrix4fv(this.piecesUniforms.uViewProjection, false, viewProjection);
            gl.uniform3fv(this.piecesUniforms.uEye, eye);
            gl.uniform1i(this.piecesUniforms.uDebugMode, debug.mode);
            this.bindPieces(debug.buffer);
            gl.drawElements(gl.TRIANGLES, this.pieceIndexCount, gl.UNSIGNED_INT, 0);
        }
    },

    bindTrunk()
    {
        const gl = this.gl, a = this.trunkAttrib;
        const attach = (location, buffer, size) =>
        {
            if (location < 0) return;
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.enableVertexAttribArray(location);
            gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
        };
        attach(a.aPosition, this.buffers.trunkPosition, 3);
        attach(a.aNormal, this.buffers.trunkNormal, 3);
        attach(a.aUv, this.buffers.trunkUv, 2);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.buffers.trunkIndex);
    },

    bindPieces(debugBuffer)
    {
        const gl = this.gl, a = this.piecesAttrib;
        const attach = (location, buffer, size) =>
        {
            if (location < 0) return;
            gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
            gl.enableVertexAttribArray(location);
            gl.vertexAttribPointer(location, size, gl.FLOAT, false, 0, 0);
        };
        attach(a.aPosition, this.buffers.piecePosition, 3);
        attach(a.aNormal, this.buffers.pieceNormal, 3);
        attach(a.aColor, this.buffers.pieceColour, 3);
        attach(a.aDebug, debugBuffer, 3);
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.buffers.pieceIndex);
    },

    save(name, blob)
    {
        try
        {
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = name;
            document.body.appendChild(anchor);
            anchor.click();
            anchor.remove();
            setTimeout(() => URL.revokeObjectURL(url), 4000);
            return true;
        }
        catch (error)
        {
            window.open(URL.createObjectURL(blob), '_blank');
            return false;
        }
    },

    async exportPngs()
    {
        if (!this.result) return;
        const projection = this.result.projection;
        const N = projection.resolution;
        const tag = this.result.spec.key;
        for (const [name, data] of [['albedo', projection.albedo], ['normal', projection.normal], ['orm', projection.orm]])
        {
            const png = await TextureCodec.encodePng(data, N, N, true);
            this.save(`BarkSolver_${tag}_${name}_${N}.png`, new Blob([png], { type: 'image/png' }));
        }
    },

    async exportJson()
    {
        if (!this.result) return;
        const r = this.result;
        const recipe = TextureCodec.recipe(r.spec, r.trunk, r.clustering, r.structure, r.projection, this.state.seed | 0);
        this.save(`BarkSolver_${r.spec.key}_recipe.json`,
            new Blob([JSON.stringify(recipe, null, 2)], { type: 'application/json' }));
    },

    exportObj()
    {
        if (!this.result) return;
        const text = GeometryCodec.toObj(this.result.trunk, this.result.structure, true);
        this.save(`BarkSolver_${this.result.spec.key}_plates.obj`, new Blob([text], { type: 'text/plain' }));
    }
};

// ------------------------------------------------------------------------------------------------------------------------------------------------------------
//  Entry point
// ------------------------------------------------------------------------------------------------------------------------------------------------------------
function StartBarkHost()
{
    if (!BarkHost.init()) return;
    BarkHost.state = BarkHost.defaultState();

    let debounce = 0;
    const schedule = (immediate) =>
    {
        clearTimeout(debounce);
        debounce = setTimeout(() => BarkHost.rebuild(), immediate ? 0 : 180);
    };

    BarkPanel.build(document.getElementById('panel-scroll'), BarkHost.state, (key, settled) =>
    {
        if (key === 'species') { BarkHost.adoptPreset(); BarkPanel.sync(BarkHost.state); schedule(true); return; }
        if (key === 'exportPng') { BarkHost.exportPngs(); return; }
        if (key === 'exportJson') { BarkHost.exportJson(); return; }
        if (key === 'exportObj') { BarkHost.exportObj(); return; }
        if (key === 'view' || key === 'shading') return;
        schedule(settled);
    });

    const frame = () => { BarkHost.draw(); requestAnimationFrame(frame); };
    requestAnimationFrame(frame);
    BarkHost.rebuild();
}

StartBarkHost();
window.__SlateBark = { BarkHost, BarkSequence, BarkSpecification, OrbitSolver };
