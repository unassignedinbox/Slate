<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project-Zero — editor</title>
<!--
  Project-Zero editor, spoken in HTML.

  Every figure below is read out of the native sources, not invented:
    Engine/Editor/EditorStyleSpecification.h   the tab sheet and the colour tokens
    Engine/Editor/EditorHost.cpp               three columns: 316 px outliner, centre viewport, 340 px inspector
    Engine/Editor/OutlinerPanel.cpp            head 22/22/12, 18 px tiles, 40 px search, 26 px pills, 39 px rows,
                                               the four-column foot, the --t2/--t3/--g2/--g3 inks
    Engine/Editor/ViewportPanel.cpp            the 44 px rail (three zones), the 2 px convergence hairline,
                                               the orbit compass, the console, the FPS/TRIS/INSTANCES/CAMERA foot
    Engine/Editor/InspectorPanel.cpp           56 px ident, 18 px radius cards, INSTANCE and NOTES, the foot
    Engine/Editor/ControlPanel.cpp             slider pill 92+34, switch 44x25, axis cells, colour chip, drop-down
    Exhibits/Workbench/Editor/EditorProof.cpp  the Showcase roster: labels, tints, meta, glyphs, standings
  The artwork is the shipped set in EngineContent/Icons — nothing redrawn here.
-->
<style>
  :root{
    /* EditorStyleSpecification.h + OutlinerPanel.cpp tokens, as bytes. */
    --text:#f0f0f0; --t2:rgba(255,255,255,.56); --t3:rgba(255,255,255,.32);
    --dim:#888; --faint:#5c5c5c;
    --g2:rgba(255,255,255,.045); --g3:rgba(255,255,255,.08);
    --stroke:rgba(255,255,255,.07); --stroke2:rgba(255,255,255,.13);
    --wash:rgba(255,255,255,.02); --selbg:rgba(255,255,255,.09);
    --tilebg:rgba(255,255,255,.035); --tileico:rgba(255,255,255,.06);
    --glass:rgba(15,16,18,.74);
    --window:#121212; --strip:#0a0a0a; --tab:#26262c; --tabhover:#32323a;
    --inset:#1a1a1a; --strong:#2e2e2e; --field:#000; --hover:#222; --seated:#2a2a2a;
    --view:#07090c;
    --red:#ff3b30; --green:#34c759; --orange:#ffb454; --amber:#f59e0b;
    --hi:#6c77ff; --thumb:#e0e0e0;
    --axX:#ef5350; --axY:#69d06d; --axZ:#5b8cff;
    --pillLights:#ffb454; --pillSky:#5aa9ff; --pillBodies:#dfe6f5; --pillGeometry:#e2e8f0; --pillCamera:#34c759;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--strip);color:var(--text);overflow:hidden;
       font:13px/1.4 "DM Sans",ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
       -webkit-font-smoothing:antialiased;font-weight:300}
  .mono{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-variant-numeric:tabular-nums}
  .caps{text-transform:uppercase;letter-spacing:.1em}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  ::-webkit-scrollbar{width:8px}
  ::-webkit-scrollbar-thumb{background:#242424;border-radius:9px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ── the dock: a tab strip over three columns ───────────────────────────── */
  #app{display:flex;flex-direction:column;height:100vh;background:var(--strip)}
  #columns{flex:1;display:flex;min-height:0;background:var(--strip)}
  .col{display:flex;flex-direction:column;min-height:0;background:var(--window);position:relative}
  .col.left{width:316px;flex:none}
  .col.left.compact{width:236px}
  .col.centre{flex:1;min-width:0}
  .col.right{width:340px;flex:none}
  .gutter{width:1px;background:rgba(255,255,255,.05);flex:none}

  /* tab strip: TabHeight 24, TabStripPadTop 4, TabSlant 14, square corners */
  .tabstrip{height:28px;padding-top:4px;display:flex;align-items:flex-end;gap:0;background:var(--strip);
            padding-left:6px;padding-right:6px;position:relative}
  .tab{height:24px;min-width:110px;display:inline-flex;align-items:center;gap:8px;padding:0 20px;
       font-size:11.5px;color:var(--t2);background:var(--tab);cursor:pointer;position:relative;
       clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 100%,0 100%);margin-right:-14px}
  .tab:hover{background:var(--tabhover);color:var(--text)}
  .tab.sel{background:var(--window);color:var(--text);z-index:2}
  .tab .x{opacity:.45;font-size:11px}
  .tab .x:hover{opacity:1}
  .tabadd{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;margin-left:20px;
          background:var(--tab);color:var(--t2);z-index:3}
  .tabadd:hover{background:var(--tabhover);color:var(--text)}
  .strip-spacer{flex:1}

  /* ── outliner ───────────────────────────────────────────────────────────── */
  .panelbody{flex:1;display:flex;flex-direction:column;min-height:0}
  .o-head{padding:22px 22px 12px;display:flex;align-items:center;gap:10px}
  .compact .o-head{padding:16px 16px 8px}
  .o-head h1{margin:0;font-size:20px;font-weight:300;letter-spacing:-.01em}
  .compact .o-head h1{font-size:16px}
  .o-head .sub{font-size:12px;color:var(--t3);margin-left:4px}
  .cbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--stroke);margin-left:auto;
        display:grid;place-items:center;color:var(--t3)}
  .cbtn:hover,.cbtn.on{background:var(--g3);color:var(--text)}

  .tiles{display:flex;gap:8px;padding:0 14px 10px}
  .tile{flex:1;border:1px solid var(--stroke);background:var(--tilebg);border-radius:18px;
        padding:12px 14px 10px;position:relative;min-width:0}
  .tile .ico{width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
  .tile .lbl{font-size:12px;color:var(--t2);margin-top:4px}
  .tile .fig{position:absolute;right:14px;bottom:6px;font-size:30px;font-weight:200;line-height:1}
  .tile.ok .ico{background:var(--green)}
  .tile.warn .ico{background:rgba(255,80,80,.15)}
  .tile.idle .ico{background:var(--tileico)}

  .search{display:flex;gap:8px;padding:0 14px 8px;align-items:center}
  .sfield{flex:1;height:40px;border-radius:999px;background:var(--g2);border:1px solid var(--stroke);
          display:flex;align-items:center;gap:10px;padding:0 14px;min-width:0}
  .compact .sfield{height:32px}
  .sfield input{flex:1;background:none;border:0;outline:none;font-size:13px;min-width:0}
  .sfield input::placeholder{color:var(--t3)}
  .filterbtn{height:40px;width:92px;border-radius:999px;background:var(--g2);border:1px solid var(--stroke);
             display:inline-flex;align-items:center;gap:6px;padding:0 11px;color:var(--t3);font-size:12px;flex:none}
  .compact .filterbtn{height:32px;width:82px}
  .filterbtn:hover,.filterbtn.open{background:var(--g3);border-color:var(--stroke2);color:var(--text)}
  .filterbtn .count{margin-left:auto;background:var(--g3);color:var(--text);border-radius:9px;
                    font-size:10px;padding:1px 5px}
  .fmenu{position:absolute;z-index:40;width:170px;background:var(--glass);backdrop-filter:blur(14px);
         border:1px solid var(--stroke2);border-radius:16px;padding:8px;display:none}
  .fmenu.open{display:block}
  .fmenu .row{height:28px;border-radius:14px;display:flex;align-items:center;gap:13px;padding:0 10px;
              font-size:11px;color:var(--t2)}
  .fmenu .row:hover{background:var(--g3);color:var(--text)}
  .fmenu .row.on{background:var(--g2);color:var(--text)}
  .fmenu .dot,.chip .dot{width:6px;height:6px;border-radius:50%;flex:none}
  .fmenu .tick{margin-left:auto;color:var(--green);font-size:11px;visibility:hidden}
  .fmenu .row.on .tick{visibility:visible}

  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 14px 8px}
  .chips:empty{padding:0}
  .chip{height:26px;border-radius:13px;border:1px solid var(--stroke);background:var(--g2);
        display:inline-flex;align-items:center;gap:6px;padding:0 10px;font-size:11px}
  .chip:hover{background:var(--g3);border-color:var(--stroke2)}
  .chip .x{color:var(--t3);margin-left:4px}

  .tree{flex:1;overflow-y:auto;padding:2px 10px 10px;min-height:0}
  .node{height:39px;display:flex;align-items:center;gap:7px;padding-right:6px;border-radius:7px;
        position:relative;color:var(--t2);cursor:default;user-select:none}
  .compact .node{height:34px}
  .node:hover{background:var(--g2);color:var(--text)}
  .node.sel{background:var(--selbg);color:var(--text);box-shadow:inset 0 0 0 1px var(--stroke2)}
  .node.sel .accent{position:absolute;left:0;top:0;bottom:0;width:3px}
  .node.dim .nname,.node.dim .nico{opacity:.4}
  .chev{width:14px;height:14px;flex:none;display:grid;place-items:center;color:var(--t3);font-size:9px;
        transition:transform .12s}
  .chev.open{transform:rotate(90deg)}
  .nico{width:30px;height:30px;flex:none;display:grid;place-items:center}
  .nico img{width:22px;height:22px;display:block}
  .nname{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .node.folder .nname{font-size:13px}
  .tag{border:1px solid var(--stroke);border-radius:7px;font-size:9px;letter-spacing:.07em;
       padding:1px 6px;color:var(--t3);flex:none}
  .nmeta{font-size:11px;color:var(--t3);flex:none}
  .nstat{width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:9px}
  .nstat.ok{background:var(--green);color:#0b1a12}
  .nstat.warn{background:rgba(255,180,84,.16);color:var(--orange)}
  .nstat.err{background:rgba(255,80,80,.16);color:var(--red)}
  .nstat.quiet{background:rgba(255,255,255,.08);color:var(--t3)}
  .eye{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--t3);
       opacity:0}
  .node:hover .eye,.node.sel .eye,.node.hidden .eye{opacity:1}
  .node.hidden .eye{color:var(--red)}
  .eye:hover{background:var(--g3);color:var(--text)}
  .empty{padding:30px 10px;text-align:center;color:var(--t3);font-size:12px}

  /* shared 40 px sill */
  .foot{height:40px;flex:none;background:var(--wash);border-top:1px solid var(--stroke);
        display:flex;align-items:center}
  .o-foot{padding:0 16px;gap:4px}
  .compact .o-foot{padding:0 14px}
  .fitem{display:flex;flex-direction:column;justify-content:center;min-width:0}
  .fitem .k{font-size:9px;letter-spacing:.09em;color:var(--t3)}
  .fitem .v{font-size:12px;white-space:nowrap}
  .fitem .v .u{font-size:9px;color:var(--t3);margin-left:3px}

  /* ── viewport ───────────────────────────────────────────────────────────── */
  .rail{height:44px;flex:none;display:flex;align-items:center;gap:0;padding:0 10px;position:relative}
  .brandtile{width:28px;height:28px;border-radius:8px;background:#222;border:1px solid var(--stroke);
             display:grid;place-items:center;font-size:13px;flex:none}
  .zone{display:flex;align-items:center;gap:4px}
  .pair{width:56px;height:26px;border-radius:13px;background:#121416;border:1px solid var(--stroke);
        display:flex;padding:2px;margin-left:10px}
  .pair button{width:26px;height:22px;border-radius:11px;display:grid;place-items:center;color:var(--faint)}
  .pair button.on{background:var(--strong);color:var(--text)}
  .vpill{height:26px;border-radius:13px;border:1px solid var(--stroke);background:rgba(255,255,255,.03);
         display:inline-flex;align-items:center;gap:7px;padding:0 10px;color:var(--dim);font-size:10.5px}
  .vpill:hover{background:var(--hover);color:var(--text)}
  .vpill.on{background:var(--strong);color:var(--text);border-color:var(--stroke2)}
  .mode{display:inline-flex;align-items:center;gap:2px;padding:2px;border-radius:13px;
        border:1px solid var(--stroke);background:#121416}
  .mode button{height:22px;border-radius:11px;padding:0 12px;font-size:10.5px;color:var(--dim);
               display:inline-flex;align-items:center;gap:6px}
  .mode button .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
  .mode button.sel[data-m="edit"]{background:var(--strong);color:var(--text)}
  .mode button.sel[data-m="sim"]{background:rgba(108,119,255,.24);color:#aeb4ff}
  .mode button.sel[data-m="play"]{background:rgba(52,199,89,.22);color:#7ee7a5}
  .transport{display:inline-flex;align-items:center;gap:2px;overflow:hidden;max-width:0;opacity:0;
             transition:max-width .22s cubic-bezier(.2,.7,.2,1),opacity .16s}
  .transport.show{max-width:140px;opacity:1}
  .sep{width:1px;height:18px;background:var(--stroke2);margin:0 6px;flex:none}
  .status{height:26px;border-radius:13px;border:1px solid var(--stroke);display:inline-flex;align-items:center;
          gap:8px;padding:0 10px;color:var(--dim);font-size:10.5px}
  .status b{color:var(--text);font-weight:400}
  .live{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(52,199,89,.18)}
  .live.held{background:var(--amber);box-shadow:0 0 0 3px rgba(245,158,11,.18)}
  .live.static{background:var(--faint);box-shadow:none}
  .hair{height:2px;background:transparent;flex:none;border-top:1px solid var(--stroke);position:relative}
  .hair i{position:absolute;left:0;top:0;bottom:0;width:42%;background:#59c9a5;transition:width .3s}
  .hair.done i{background:#4f9ad8}

  .view{flex:1;margin:0 10px;border-radius:12px;background:var(--view);border:1px solid var(--stroke);
        position:relative;overflow:hidden;min-height:0}
  .view svg{position:absolute;inset:0;width:100%;height:100%}
  .viewhint{position:absolute;inset:0;display:grid;place-content:center;text-align:center;color:var(--dim);
            pointer-events:none}
  .viewhint small{display:block;color:var(--faint);font-size:11px;margin-top:4px}
  .console{height:40px;flex:none;margin:0 10px;display:flex;align-items:center;gap:10px;color:var(--faint)}
  .console input{flex:1;background:none;border:0;outline:none;font-size:13px}
  .v-foot{padding:0 4px;gap:0}
  .counter{display:inline-flex;align-items:baseline;gap:6px;padding:0 10px;font-size:11px;position:relative}
  .counter + .counter::before{content:"";position:absolute;left:0;top:50%;height:12px;width:1px;
                              margin-top:-6px;background:var(--stroke)}
  .counter .k{font-size:10px;letter-spacing:.12em;color:var(--faint)}
  .counter .v{color:var(--text)}
  .counter .s{color:var(--faint)}

  /* ── inspector ──────────────────────────────────────────────────────────── */
  .ident{height:56px;flex:none;background:var(--wash);border-bottom:1px solid var(--stroke);
         display:flex;align-items:center;gap:10px;padding:0 14px}
  .ident .swatch{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
  .ident .swatch i{width:10px;height:10px;border-radius:50%;display:block}
  .ident .who{flex:1;min-width:0}
  .ident input{width:100%;background:none;border:0;outline:none;font-size:13px;padding:2px 0}
  .ident input:focus{box-shadow:0 0 0 1px var(--strong);border-radius:6px;padding-left:4px}
  .ident .kind{font-size:11px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
  .ident .kind span{color:var(--faint);text-transform:none;letter-spacing:0}
  .disc{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.05);display:grid;
        place-items:center;color:var(--faint);flex:none}
  .disc:hover{background:rgba(255,255,255,.09)}
  .disc.on{color:var(--text)}
  .props{flex:1;overflow-y:auto;padding:10px 14px 0;min-height:0}
  .card{background:var(--inset);border:1px solid rgba(255,255,255,.05);border-radius:18px;padding:12px 14px 14px;
        margin-bottom:10px}
  .card > h4{margin:0;height:24px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:400;
             letter-spacing:.1em;text-transform:uppercase;color:var(--dim);cursor:pointer}
  .card > h4 .tri{width:10px;color:var(--dim);font-size:8px}
  .card.shut > .body{display:none}
  .card .cap{font-size:11px;color:var(--dim);margin:8px 0 0}
  .body{padding-top:8px}
  .prow{display:flex;align-items:center;gap:0;min-height:26px;margin-bottom:8px}
  .prow .plabel{width:78px;flex:none;font-size:11px;color:var(--dim)}
  .prow .pzone{flex:1;min-width:0;display:flex;align-items:center;justify-content:flex-end}
  .prow.stacked{display:block}
  .prow.stacked .plabel{width:auto;margin-bottom:4px}

  .spill{display:flex;align-items:center;gap:10px;width:100%}
  .numcell{height:28px;min-width:58px;border:1px solid var(--stroke);border-right:0;background:var(--field);
           border-radius:14px 0 0 14px;display:grid;place-items:center;font-size:12px}
  .numcell input{width:52px;background:none;border:0;outline:none;text-align:center;font-size:12px}
  .unitcell{height:28px;width:34px;border:1px solid var(--stroke);background:var(--inset);
            border-radius:0 14px 14px 0;display:grid;place-items:center;font-size:11px;color:var(--faint)}
  .track{flex:1;height:26px;display:flex;align-items:center;position:relative;min-width:40px}
  .track .bed{position:absolute;left:0;right:0;height:26px;border-radius:13px;background:var(--hover)}
  .track .fill{position:absolute;left:0;height:26px;border-radius:13px;background:#4a4a4a}
  .track.hi .fill{background:var(--hi)}
  .track .knob{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--thumb);
               transform:translateX(-50%);box-shadow:0 1px 0 rgba(0,0,0,.5)}
  .switch{width:44px;height:25px;border-radius:12.5px;background:var(--hover);border:1px solid var(--stroke);
          position:relative;flex:none}
  .switch i{position:absolute;top:2.5px;left:2px;width:19px;height:19px;border-radius:50%;background:#bdbdbd;
            transition:left .14s,background .14s}
  .switch.on{background:#fff}
  .switch.on i{left:23px;background:#111}
  .axis{display:flex;gap:8px;width:100%}
  .axis .cell{flex:1;height:26px;border:1px solid var(--stroke);background:var(--field);border-radius:8px;
              display:flex;align-items:center;min-width:0}
  .axis .cell b{width:22px;text-align:center;font-size:11px;font-weight:400}
  .axis .cell input{flex:1;min-width:0;background:none;border:0;outline:none;text-align:center;font-size:11px;
                    color:var(--faint)}
  .chipcolour{display:flex;align-items:center;gap:10px}
  .chipcolour .sw{width:52px;height:26px;border-radius:8px;border:1px solid var(--strong)}
  .chipcolour .hex{font-size:11px;color:var(--dim)}
  .swatchrow{display:flex;gap:8px}
  .swatchrow i{width:18px;height:18px;border-radius:50%;border:1px solid var(--strong);display:block}
  .swatchrow i.on{box-shadow:0 0 0 2px #fff}
  .dd{width:100%;height:32px;border:1px solid var(--stroke);border-radius:16px;background:var(--field);
      display:flex;align-items:center;padding-left:16px;font-size:13px;position:relative}
  .dd .caret{margin-left:auto;width:36px;height:100%;background:#222;border-radius:0 16px 16px 0;
             display:grid;place-items:center;color:var(--dim);border-left:1px solid var(--stroke)}
  .readout{font-size:11px;color:var(--dim);text-align:right}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
  .ptoggle{height:22px;padding:0 10px;border-radius:11px;background:rgba(255,255,255,.03);
           border:1px solid var(--stroke);font-size:11px;color:var(--dim);letter-spacing:.06em}
  .ptoggle.on{background:var(--inset);border-color:var(--strong);color:var(--text)}
  .specline{display:flex;align-items:center;height:18px;margin-bottom:6px}
  .specline .k{width:78px;font-size:11px;color:var(--dim);letter-spacing:.1em}
  .specline .v{flex:1;text-align:right;font-size:11px;color:var(--dim)}
  textarea.notes{width:100%;height:64px;background:#000;border:1px solid rgba(255,255,255,.05);
                 border-radius:8px;padding:8px;resize:none;outline:none;font-size:13px}
  textarea.notes:focus{border-color:#2e2e2e}
  .i-foot{justify-content:space-between;padding:0 14px;font-size:11px;color:var(--faint)}
  .i-foot .right{display:flex;gap:6px;align-items:baseline}
  .i-foot .right b{color:var(--text);font-weight:400}
  .nothing{border:1px solid rgba(255,255,255,.05);background:var(--inset);border-radius:18px;height:120px;
           display:grid;place-content:center;text-align:center;color:var(--dim)}
  .nothing small{display:block;color:var(--faint);font-size:11px;margin-top:6px}

  /* ── the Sun-reference inspector grammar ────────────────────────────────
     SunInspectorPanel.cpp / CameraInspectorPanel.cpp / StarsInspectorPanel.cpp /
     CloudsInspectorPanel.cpp / FogInspectorPanel.cpp / WeatherInspectorPanel.cpp /
     MoonInspectorPanel.cpp / AtmosphereSkyInspectorPanel.cpp / LensFlareInspectorPanel.cpp:
     Ink #e9e9e9 · Muted #919191 · card = radius 22, #252525→#202020 gradient, #343434 hairline,
     title 12 px at (24,23) behind a 17 px accent mark · slider block = 11 px muted label + 30 px
     SliderPill · tile = 65 px, radius 13, #222 on #383838 · wrap prose 11 px muted.         */
  .env{padding:20px 20px 24px;color:#e9e9e9}
  .env .crumb{font-size:9px;color:#919191;letter-spacing:.02em}
  .env .big{font-size:25px;font-weight:300;margin:12px 0 0;line-height:1.1}

  .env .kicker{font-size:10px;color:#919191;margin-top:9px;letter-spacing:.06em}

                display:inline-flex;align-items:center;gap:8px;padding:0 14px;font-size:11px;margin-top:-34px}
  .env .enabled i{width:6px;height:6px;border-radius:50%;background:#96cfa1;display:block}
  .env .enabled.off i{background:#c67370}
  .ecard{margin-top:16px;border:1px solid #343434;border-radius:22px;
         background:linear-gradient(160deg,#252525,#202020);padding:21px 24px 24px}
  .ecard > header{display:flex;align-items:center;gap:11px;font-size:12px;color:#cacaca;margin-bottom:4px}
  .ecard > header svg{flex:none}
  .ecard .figure{font-size:30px;font-weight:300;margin:14px 0 0;line-height:1}
  .ecard .figure small{font-size:17px;color:#919191;margin-left:7px;font-weight:300}
  .ecard .figure em{font-style:normal;color:#5e5e5e}
  .prose{font-size:11px;color:#919191;margin:10px 0 0;line-height:1.5}
  .sblock{margin-top:16px}
  .sblock > span{display:block;font-size:11px;color:#919191;margin-bottom:6px}
  .tiles2{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .etile{flex:1 1 112px;height:65px;border-radius:13px;background:#222;border:1px solid #383838;
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .etile .mark{width:16px;height:16px;border-radius:50%;border:1.4px solid currentColor;position:relative}
  .etile .mark::after{content:"";position:absolute;left:50%;top:-5px;width:1.5px;height:9px;
                      background:currentColor;transform:translateX(-50%)}
  .etile .cap{font-size:10px;letter-spacing:.04em}
  .etile.on{color:#83cf9e}
  .etile.off{color:#dd8989}
  .etile.na{color:#919191;opacity:.75;cursor:not-allowed}
  .etile.na .mark{border-style:dashed;border-radius:3px}
  .etile.na .mark::after{display:none}
  .quick{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .qtile{flex:1 1 112px;height:106px;border-radius:16px;background:#202020;border:1px solid #323232;
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
  .qtile .orb{width:31px;height:31px;border-radius:50%;background:#6a6a6a;display:grid;place-items:center;
              color:#1a1a1a}
  .qtile.on .orb{background:#69c884}
  .qtile.off .orb{background:#cc7673}
  .qtile .lbl{font-size:10px;color:#c8c8c8}
  .qtile .st{font-size:8px;letter-spacing:.1em}
  .qtile.on .st{color:#69c884}.qtile.off .st{color:#cc7673}.qtile.na .st{color:#6a6a6a}
  .ebtn{height:32px;border-radius:8px;background:#282828;border:1px solid #414141;color:#cccccc;
        display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-size:11px}
  .ebtn[disabled]{color:#707070;cursor:not-allowed}
  .ebtn.wide{width:100%}
  .erule{height:1px;background:rgba(255,255,255,.05);margin:16px 0}
  .ediag{margin-top:14px;border-radius:12px;overflow:hidden;background:#1b1a1e}
  .ediag svg{display:block;width:100%}
  .scale{display:flex;justify-content:space-between;font-size:10px;color:#919191;margin-top:6px}
  .gradbar{height:16px;border-radius:8px;margin-top:14px;
           background:linear-gradient(90deg,#b9764e 0%,#d9b790 35%,#e0dbcd 58%,#92b2d0 85%,#7791b8 100%)}
  .typegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
  .tcell{height:84px;border-radius:12px;background:#1d2021;border:1px solid #3b3e3f;display:flex;
         flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:11px;color:#919191}
  .tcell.sel{border-color:#a9c3e4;color:#a9c3e4}
  .swatchline{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:11px;color:#aaa}
  .swatchline i{width:12px;height:12px;border-radius:3px;display:block}
  .endnote{font-size:11px;color:#8b8b8b;margin:18px 0 0;line-height:1.5}
  .strip{display:flex;gap:12px;overflow-x:auto;margin-top:14px;padding-bottom:6px}
  .strip .body{flex:none;width:112px;height:124px;border-radius:14px;background:#202020;border:1px solid #2b2b2b;
               display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding-bottom:6px}
  .strip .body.sel{background:#2a2b2e;border-color:#c0a7d8}
  .strip .body span{font-size:12px;color:#919191}
  .strip .body.sel span{color:#e9e9e9}

  /* ── the tyre card (TyreInspectorPanel.cpp) ─────────────────────────────── */
  .tcard{background:var(--inset);border:1px solid rgba(255,255,255,.05);border-radius:18px;
         padding:15px 17px 12px;margin-bottom:12px}
  .tcard header{display:flex;align-items:center;gap:9px;font-size:13px}
  .tcard header i{width:3px;height:13px;border-radius:1.5px;display:block}
  .tcard .head{font-size:30px;font-weight:300;margin-top:6px;line-height:1.1}
  .tcard .head em{font-style:normal;color:#5e5e5e}
  .tcard .head small{font-size:12px;color:var(--dim);margin-left:5px}
  .tcard .cap{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
  .trow{display:flex;align-items:center;min-height:30px;margin-top:6px}
  .trow .k{width:86px;flex:none;font-size:11px;color:var(--dim)}
  .trow .z{flex:1;min-width:0;display:flex;align-items:center}

  /* popovers */
  .pop{position:absolute;z-index:50;background:rgba(15,17,20,.98);border:1px solid rgba(255,255,255,.18);
       border-radius:12px;padding:8px;min-width:220px;display:none}
  .pop.open{display:block}
  .pop h5{margin:6px 8px 4px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
  .pop button{display:flex;width:100%;align-items:center;gap:10px;height:28px;padding:0 8px;border-radius:8px;
              font-size:12px;color:var(--t2)}
  .pop button:hover{background:var(--g3);color:var(--text)}
  .pop button img{width:18px;height:18px}
</style>
</head>
<body>
<div id="app">

  <!-- ── the sheet's tab strip ─────────────────────────────────────────── -->

    <div class="tab sel" style="min-width:140px">Outliner <span class="x">✕</span></div>
    <button class="tabadd" id="tabadd" title="Add an object (Shift+A)">+</button>
    <div style="width:26px"></div>
    <div class="tab sel" style="min-width:150px">Viewport <span class="x">✕</span></div>
    <div class="tab" style="min-width:190px">Project-Zero</div>
    <div class="strip-spacer"></div>
    <div class="tab sel" style="min-width:150px">Inspector <span class="x">✕</span></div>
  </div>

  <div id="columns">
    <!-- ══ OUTLINER ══════════════════════════════════════════════════════ -->
    <section class="col left" id="outliner">
      <div class="panelbody">
        <div class="o-head">
          <h1>Outliner</h1>
          <div class="sub" id="o-sub">Showcase · 0 nodes</div>
          <button class="cbtn" id="compact" title="Compact outliner (Tab)">

                 stroke-linecap="round"><path d="M4 9h16M4 15h16"/></svg>

        </div>

        <div class="tiles">
          <div class="tile ok">
            <div class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0b1a12"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17 19 7"/></svg></div>
            <div class="lbl">Visible</div><div class="fig" id="t-visible">0</div>
          </div>
          <div class="tile idle" id="tile-hidden">
            <div class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 20h19Z"/>
                 <path d="M12 10v4"/><circle cx="12" cy="17" r=".9" fill="currentColor"/></svg></div>
            <div class="lbl">Hidden</div><div class="fig" id="t-hidden">0</div>
          </div>
        </div>

        <div class="search">
          <label class="sfield">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.32)"
                 stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="query" placeholder="Search  Ctrl+Shift+F" spellcheck="false">
          </label>
          <button class="filterbtn" id="filterbtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
            <span>Filter</span><span class="count" id="filtercount" hidden>0</span>
            <svg width="8" height="5" viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" stroke="currentColor"
                 stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
          </button>
          <div class="fmenu" id="fmenu"></div>
        </div>

        <div class="chips" id="chips"></div>
        <div class="tree" id="tree"></div>
      </div>
      <div class="foot o-foot" id="o-foot"></div>
    </section>

    <div class="gutter"></div>

    <!-- ══ VIEWPORT ══════════════════════════════════════════════════════ -->
    <section class="col centre">
      <div class="rail">
        <div class="zone">
          <div class="brandtile">F</div>
          <div class="pair">
            <button class="on" id="dock-l" title="Outliner column">
              <svg width="14" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.3">
                <rect x=".8" y=".8" width="14.4" height="10.4" rx="2"/><rect x="1" y="1" width="4" height="10"
                fill="currentColor" stroke="none"/></svg>
            </button>
            <button class="on" id="dock-r" title="Inspector column">
              <svg width="14" height="12" viewBox="0 0 16 12" fill="none" stroke="currentColor" stroke-width="1.3">
                <rect x=".8" y=".8" width="14.4" height="10.4" rx="2"/><rect x="11" y="1" width="4" height="10"
                fill="currentColor" stroke="none"/></svg>
            </button>
          </div>
          <div style="width:6px"></div>
          <button class="vpill" id="addbtn" title="Add an object  (Shift A)">
            <svg width="11" height="11" viewBox="0 0 12 12"><path d="M6 1v10M1 6h10" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round"/></svg>
            <span class="caps">Add</span>

          <div class="pop" id="addmenu"></div>
        </div>

        <div style="flex:1"></div>

        <div class="zone">
          <div class="mode" id="mode">

            <button data-m="sim"><span class="dot"></span><span class="caps">Simulate</span></button>
            <button data-m="play"><span class="dot"></span><span class="caps">Play</span></button>

            <div class="sep"></div>

            <button class="vpill" data-act="step" title="Advance one frame  (.)">▶❙</button>
            <button class="vpill" data-act="stop" title="Stop and restore  (Esc)">■</button>
          </div>

        <div style="flex:1"></div>

        <div class="zone">
          <button class="vpill" id="projbtn" title="Projection and field of view">
            <span class="caps">Perspective</span><span style="color:var(--faint)">60°</span>
            <svg width="8" height="5" viewBox="0 0 8 5"><path d="M1 1l3 3 3-3" stroke="currentColor"
                 stroke-width="1.3" fill="none" stroke-linecap="round"/></svg>
          </button>
          <button class="vpill on" id="markers" title="Volume markers in the view">
            <svg width="11" height="11" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.2" stroke="currentColor"
                 fill="none" stroke-width="1.4"/><circle cx="6" cy="6" r="1.3" fill="currentColor"/></svg>
            <span class="caps">Markers</span>
          </button>
          <div class="sep"></div>
          <div class="status"><span class="live" id="livedot"></span><span class="caps" id="statuslabel">Live</span>
            <b class="mono" id="samples">0</b></div>
          <button class="vpill" title="Viewport settings">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M21 12h-2.4M5.4 12H3M18.4 5.6l-1.7 1.7
              M7.3 16.7l-1.7 1.7M18.4 18.4l-1.7-1.7M7.3 7.3 5.6 5.6"/></svg>
          </button>
        </div>
      </div>
      <div class="hair" id="hair"><i></i></div>

      <div class="view" id="view">
        <svg id="scene" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice"></svg>

      </div>

             stroke-linecap="round"><path d="M5 20V4l10 4-10 4"/></svg>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7Z"/></svg>

      <div class="foot v-foot" id="v-foot"></div>

    <div class="gutter"></div>

    <!-- ══ INSPECTOR ═════════════════════════════════════════════════════ -->
    <section class="col right" id="inspector">
      <div class="ident" id="ident"></div>
      <div class="props" id="props"></div>
      <div class="foot i-foot" id="i-foot"></div>
    </section>
  </div>
</div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   The roster. Labels, tints, meta, glyphs and standings are EditorProof.cpp's
   kMirrorEntries, kept byte for byte; the vehicle group below is the addition
   this pass makes, drawn with the icons now registered in IconSymbols.inc.
   ═══════════════════════════════════════════════════════════════════════════ */
const ICONS = "../../EngineContent/Icons/";
const C = (r,g,b) => `rgb(${Math.round(r*255)},${Math.round(g*255)},${Math.round(b*255)})`;

/* label, kind, depth, tint, icon file, filter, meta, tag, standing, note, pinned, shut */
const ROSTER = [
 ["World",              "folder",   0, C(.353,.663,1.000), "folder-world.svg",            null,       "",            "", "ok",   "", true ],
 ["Atmosphere",         "geometry", 1, C(.353,.663,1.000), "sky-scattering.svg",          "sky",      "AM 10.2",     "", "ok",   ""],
 ["Sun",                "light",    1, C(1.000,.706,.329), "sun.svg",                     "lights",   "5.2°",        "", "ok",   ""],
 ["Sky",                "geometry", 1, C(.404,.910,.976), "sky-scattering.svg",           "sky",      "5.08 kcd",    "", "ok",   ""],
 ["Stars",              "geometry", 1, C(.769,.710,.992), "outliner-stars.svg",           "sky",      "mag -1.3",    "", "warn", "Washed out by sky"],
 ["Wind",               "geometry", 1, C(.655,.953,.816), "wind.svg",                     "sky",      "4.2 m/s SW",  "", "ok",   ""],
 ["Height Fog",         "geometry", 1, C(.624,.690,.753), "fog.svg",                      "sky",      "391 m",       "", "ok",   ""],
 ["Atmospheric Fog",    "geometry", 1, C(.561,.722,.847), "fog.svg",                      "sky",      "56 km",       "", "ok",   ""],
 ["Local Volumetric Fog","geometry",1, C(.788,.839,.886), "local-fog.svg",                "sky",      "36×36 m",     "", "ok",   ""],
 ["Cloud Layer",        "geometry", 1, C(.875,.902,.933), "clouds.svg",                   "sky",      "4/8",         "", "ok",   ""],
 ["Clouds",             "geometry", 1, C(.945,.961,.976), "clouds.svg",                   "sky",      "Cumulus · 45%","", "ok",  ""],
 ["Precipitation",      "geometry", 2, C(.788,.839,.886), "outliner-precipitation.svg",   "sky",      "Rain 12 mm/h","", "ok",   ""],
 ["Local Cloud",        "geometry", 1, C(.910,.933,.965), "local-cloud.svg",              "sky",      "180×140 m",   "", "ok",   ""],
 ["Moons",              "folder",   1, C(.875,.902,.961), "moon.svg",                     "bodies",   "1/4",         "", "ok",   ""],
 ["Luna",               "geometry", 2, C(.875,.902,.961), "moon.svg",                     "bodies",   "62%",         "", "ok",   ""],
 ["Ground Plane",       "geometry", 0, C(.886,.910,.941), "editor-mesh.svg",              "geometry", "1200 m",      "", "ok",   ""],
 ["Height Field",       "geometry", 0, C(.561,.702,.420), "terrain.svg",                  "geometry", "12 m",        "", "ok",   ""],
 ["Lights",             "folder",   0, C(1.000,.824,.478), "editor-point-light.svg",      null,       "",            "", "ok",   "", true ],
 ["Point Light",        "light",    1, C(1.000,.824,.478), "editor-point-light.svg",      "lights",   "14 cd",       "", "ok",   ""],
 ["Spot Light",         "light",    1, C(.624,.816,1.000), "editor-spotlight.svg",        "lights",   "26°",         "", "ok",   ""],
 /* ── the pass's addition: the vehicle rig, with the artwork that was on disk
       but never registered (tyre, tread, rim) and the three new symbols ──── */
 ["Vehicles",           "folder",   0, C(.286,.690,1.000), "editor-vehicle.svg",          null,       "",            "", "ok",   "", true ],
 ["Test Vehicle",       "geometry", 1, C(.286,.690,1.000), "editor-vehicle.svg",          "vehicles", "1 420 kg",    "Live","ok", ""],
 ["Front Left Tyre",    "geometry", 2, C(.345,.820,.890), "editor-tyre.svg",              "vehicles", "225/45 R18",  "", "ok",   ""],
 ["Tread Pattern",      "geometry", 3, C(.345,.820,.890), "editor-tread.svg",             "vehicles", "swept line",  "Ref","ok",  ""],
 ["Wheel Rim",          "geometry", 3, C(.800,.860,.930), "editor-wheel-rim.svg",         "vehicles", "18×8 J",      "", "ok",   ""],
 ["Front Suspension",   "geometry", 2, C(.980,.760,.400), "editor-suspension.svg",        "vehicles", "42 kN/m",     "", "warn", "Damper untuned"],
 ["Seat Cover",         "geometry", 2, C(.950,.560,.690), "editor-cloth.svg",             "cloth",    "XPBD · 4 k",  "", "ok",   ""],
 ["Tarpaulin",          "geometry", 1, C(.880,.500,.620), "editor-cloth.svg",             "cloth",    "6×4 m",       "", "quiet",""],
 ["Camera",             "camera",   0, C(.204,.780,.349), "camera.svg",                   "camera",   "72°",         "", "ok",   ""],
 ["Post Process",       "geometry", 1, C(1.000,.541,.396), "environment-exposure.svg",    "camera",   "+0.4 EV",     "Comp","ok", ""],
 ["Cine Camera",        "camera",   0, C(.369,.918,.831), "camera.svg",                   "camera",   "35 mm",       "", "ok",   ""],
].map((r,i) => ({
  id:i, label:r[0], kind:r[1], depth:r[2], tint:r[3], icon:r[4], filter:r[5],
  meta:r[6], tag:r[7], standing:r[8], note:r[9], pinned:!!r[10],
  visible:true, locked:false, dynamic:r[1]!=="folder", physics:r[5]==="vehicles"||r[5]==="cloth",
  shut:false, notes:""
}));

/* OutlinerPanel.cpp's game catalogue, plus the two the vehicle rig needs. */
const FILTERS = [
  {key:"lights",   label:"Lights",   tint:"var(--pillLights)"},
  {key:"sky",      label:"Sky",      tint:"var(--pillSky)"},
  {key:"bodies",   label:"Bodies",   tint:"var(--pillBodies)"},
  {key:"geometry", label:"Geometry", tint:"var(--pillGeometry)"},
  {key:"camera",   label:"Camera",   tint:"var(--pillCamera)"},
  {key:"vehicles", label:"Vehicles", tint:"#49b0ff"},
  {key:"cloth",    label:"Cloth",    tint:"#f28fae"},
];

const State = {
  picked: ROSTER.findIndex(r => r.label === "Sun"),
  query: "", filters: new Set(), compact:false,
  mode:"edit", paused:false, samples:0, target:256,
  cardsShut:{}, markers:true,
};

/* ── helpers ──────────────────────────────────────────────────────────────── */
const $  = s => document.querySelector(s);
const el = (tag, cls, txt) => { const n=document.createElement(tag); if(cls)n.className=cls;
                                if(txt!=null)n.textContent=txt; return n; };
const kids = i => { let n=0; for(let j=i+1;j<ROSTER.length && ROSTER[j].depth>ROSTER[i].depth;j++)
                    { if(ROSTER[j].depth===ROSTER[i].depth+1) n++; } return n; };
const descendants = i => { let n=0; for(let j=i+1;j<ROSTER.length && ROSTER[j].depth>ROSTER[i].depth;j++) n++; return n; };
const ownerOf = i => { for(let j=i-1;j>=0;j--) if(ROSTER[j].depth < ROSTER[i].depth) return j; return -1; };
const kindLabel = k => ({folder:"Folder",geometry:"Geometry",light:"Light",camera:"Camera"})[k];

/* ═══ OUTLINER ════════════════════════════════════════════════════════════ */
function buildFilterMenu(){
  const m = $("#fmenu"); m.innerHTML = "";
  FILTERS.forEach(f => {
    const row = el("div","row"+(State.filters.has(f.key)?" on":""));
    const dot = el("span","dot"); dot.style.background = f.tint;
    row.append(dot, el("span",null,f.label), el("span","tick","✓"));
    row.onclick = () => { State.filters.has(f.key)?State.filters.delete(f.key):State.filters.add(f.key);
                          m.classList.remove("open"); $("#filterbtn").classList.remove("open"); render(); };
    m.append(row);
  });
}
function renderChips(){
  const c = $("#chips"); c.innerHTML = "";
  FILTERS.filter(f => State.filters.has(f.key)).forEach(f => {
    const chip = el("button","chip");
    const dot = el("span","dot"); dot.style.background = f.tint;
    chip.append(dot, el("span",null,f.label), el("span","x","✕"));
    chip.onclick = () => { State.filters.delete(f.key); render(); };
    c.append(chip);
  });
  const n = State.filters.size;
  $("#filtercount").hidden = n === 0;
  $("#filtercount").textContent = n;
}
function visibleRows(){
  const q = State.query.trim().toLowerCase();
  const pills = State.filters;
  const hit = new Array(ROSTER.length).fill(false);
  ROSTER.forEach((r,i) => {
    let m = !q || r.label.toLowerCase().includes(q);
    if (m && pills.size) m = r.filter != null && pills.has(r.filter);
    if (m && r.kind === "folder" && (q || pills.size)) m = false;
    hit[i] = m;
  });
  /* ancestors of a hit show too — the page's own rule */
  const show = hit.slice();
  hit.forEach((h,i) => { if(!h) return; let o = ownerOf(i); while(o >= 0){ show[o] = true; o = ownerOf(o); } });
  /* a shut folder folds its rows away unless a search is live */
  const out = [];
  let foldDepth = -1;
  ROSTER.forEach((r,i) => {
    if (foldDepth >= 0 && r.depth > foldDepth) return;
    foldDepth = -1;
    if (!show[i]) return;
    out.push(i);
    if (r.shut && !q && !pills.size) foldDepth = r.depth;
  });
  return out;
}
function statusMark(r){
  if (!r.visible) return ["quiet","·","Hidden"];
  if (r.standing === "warn") return ["warn","!",r.note || "Check"];
  if (r.standing === "err")  return ["err","!",r.note || "Error"];
  if (r.standing === "quiet")return ["quiet","·","Seated"];
  return ["ok","✓","All good"];
}

/* ═══ VIEWPORT ════════════════════════════════════════════════════════════ */
/* Every roster entry is a box in its own tint — the gizmo editor's colours —
   laid out on the ground plane, selected one wearing the move gizmo. */
function renderScene(){
  const svg = $("#scene");
  const W = 1000, H = 560, horizon = 250;
  const rows = ROSTER.map((r,i)=>({r,i})).filter(o => o.r.kind !== "folder" && o.r.visible);
  let out = "";
  out += `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8fb4d8"/><stop offset="1" stop-color="#c7d8e6"/></linearGradient>
          <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ded3bd"/><stop offset="1" stop-color="#efe6d4"/></linearGradient></defs>`;
  out += `<rect width="${W}" height="${horizon}" fill="url(#sky)"/>`;
  out += `<rect y="${horizon}" width="${W}" height="${H-horizon}" fill="url(#ground)"/>`;
  /* ground grid, the editor's own faint rule */
  for (let g=1; g<14; g++){
    const y = horizon + Math.pow(g/14, 2.2) * (H - horizon);
    out += `<line x1="0" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="rgba(0,0,0,.07)"/>`;
  }
  for (let g=-7; g<=7; g++){
    out += `<line x1="${500+g*34}" y1="${horizon}" x2="${500+g*150}" y2="${H}" stroke="rgba(0,0,0,.055)"/>`;
  }
  /* boxes: one per entry, deterministic placement so the view is stable */
  const boxes = rows.map((o,k) => {
    const depth = (k % 5) / 5;                      /* 0 near … 1 far          */
    const lane  = ((k * 7) % 11) / 10 - .5;         /* across the ground plane */
    const scale = 1 - depth * .55;
    const x = 500 + lane * 820 * (1 - depth * .45);
    const y = H - 60 - depth * (H - horizon - 110);
    const w = 70 * scale, h = (o.r.kind === "light" ? 52 : 96) * scale;
    return {...o, x, y, w, h, scale, depth};
  }).sort((a,b) => a.y - b.y);
  boxes.forEach(b => {
    const sel = b.i === State.picked;
    const t = b.r.tint, d = b.w * .34;
    const x0 = b.x - b.w/2, y0 = b.y - b.h, x1 = b.x + b.w/2, y1 = b.y;
    out += `<g class="ent" data-id="${b.i}" style="cursor:pointer">`;
    out += `<ellipse cx="${b.x+d*.6}" cy="${y1+2}" rx="${b.w*.75}" ry="${b.w*.2}" fill="rgba(40,48,60,.28)"/>`;
    out += `<polygon points="${x0},${y0} ${x0+d},${y0-d*.6} ${x1+d},${y0-d*.6} ${x1},${y0}"
             fill="${t}" opacity=".95"/>`;
    out += `<polygon points="${x1},${y0} ${x1+d},${y0-d*.6} ${x1+d},${y1-d*.6} ${x1},${y1}"
             fill="${t}" opacity=".62"/>`;
    out += `<rect x="${x0}" y="${y0}" width="${b.w}" height="${b.h}" fill="${t}" opacity=".85"/>`;
    out += `<rect x="${x0}" y="${y0}" width="${b.w}" height="${b.h}" fill="none"
             stroke="${sel?"#fff":"rgba(0,0,0,.25)"}" stroke-width="${sel?2:1}"/>`;
    if (State.markers)
      out += `<text x="${b.x}" y="${y0-d*.6-7}" text-anchor="middle" font-size="${11}"
               fill="rgba(20,26,34,.72)" font-family="inherit">${b.r.label}</text>`;
    out += `</g>`;
    if (sel){
      /* the move gizmo, ControlPanel's axis tints */
      const gx = b.x, gy = y1 - b.h/2;
      out += `<g pointer-events="none">
        <line x1="${gx}" y1="${gy}" x2="${gx+70}" y2="${gy}" stroke="var(--axX)" stroke-width="3"/>
        <polygon points="${gx+70},${gy-5} ${gx+84},${gy} ${gx+70},${gy+5}" fill="var(--axX)"/>
        <line x1="${gx}" y1="${gy}" x2="${gx}" y2="${gy-70}" stroke="var(--axZ)" stroke-width="3"/>
        <polygon points="${gx-5},${gy-70} ${gx},${gy-84} ${gx+5},${gy-70}" fill="var(--axZ)"/>
        <line x1="${gx}" y1="${gy}" x2="${gx-50}" y2="${gy+34}" stroke="var(--axY)" stroke-width="3"/>
        <polygon points="${gx-50},${gy+28} ${gx-62},${gy+42} ${gx-44},${gy+39}" fill="var(--axY)"/>
        <circle cx="${gx}" cy="${gy}" r="5" fill="#fff"/></g>`;
    }
  });
  /* the orbit compass, bottom-right — ViewportPanel's six pads and three arms */
  const ox = W - 70, oy = H - 70, arm = 34;
  out += `<g pointer-events="none">
    <line x1="${ox-arm}" y1="${oy}" x2="${ox+arm}" y2="${oy}" stroke="rgba(239,83,80,.55)" stroke-width="3"/>
    <line x1="${ox}" y1="${oy-arm}" x2="${ox}" y2="${oy+arm}" stroke="rgba(91,140,255,.55)" stroke-width="3"/>
    <line x1="${ox-arm*.7}" y1="${oy+arm*.5}" x2="${ox+arm*.7}" y2="${oy-arm*.5}" stroke="rgba(105,208,109,.55)" stroke-width="3"/>
    <circle cx="${ox+arm}" cy="${oy}" r="11" fill="#ef5350"/><text x="${ox+arm+15}" y="${oy+4}" font-size="11" fill="#ef5350">X</text>
    <circle cx="${ox-arm}" cy="${oy}" r="11" fill="rgba(239,83,80,.35)"/>
    <circle cx="${ox}" cy="${oy-arm}" r="11" fill="#5b8cff"/><text x="${ox+9}" y="${oy-arm-12}" font-size="11" fill="#5b8cff">Z</text>
    <circle cx="${ox}" cy="${oy+arm}" r="11" fill="rgba(91,140,255,.35)"/>
    <circle cx="${ox+arm*.7}" cy="${oy-arm*.5}" r="11" fill="#69d06d"/><text x="${ox+arm*.7+14}" y="${oy-arm*.5+4}" font-size="11" fill="#69d06d">Y</text>
    <circle cx="${ox-arm*.7}" cy="${oy+arm*.5}" r="11" fill="rgba(105,208,109,.35)"/></g>`;
  svg.innerHTML = out;
  svg.querySelectorAll(".ent").forEach(g =>
    g.onclick = () => { State.picked = +g.dataset.id; render(); });
}

function sheetFor(r, i){
  if (r.kind === "folder") return [

      {label:"Position", kind:"axis", axes:[0,0,0]},

    ]},

      {label:"Emission", kind:"slider", min:0, max:64, value:0, dec:1, unit:"lx"},
      {label:"Roughness", kind:"slider", min:0, max:1, value:.5, dec:2, unit:""},

    ]}];
  if (r.kind === "light") return [
    {title:"Light", props:[
      {label:"Intensity", kind:"slider", min:0, max:64, value:32, dec:1, unit:"lx"},
      {label:"Colour", kind:"colour", tint:"rgb(255,255,255)"},
    ]},
    {title:"Aim", props:[{label:"Direction", kind:"readout", text:"-Z (nadir)"}]}];
  return [
    {title:"Transform", props:[
      {label:"Position", kind:"axis", axes:[0,-3.30,1.55]},
      {label:"Pitch", kind:"readout", text:"+0.0°"},
      {label:"Yaw", kind:"readout", text:"+0.0°"},
    ]},
    {title:"Lens", props:[
      {label:"Field of view", kind:"slider", min:20, max:120, value:55, dec:1, unit:"°", hi:true},
      {label:"Aspect", kind:"readout", text:"1.778"},
    ]},
    {title:"Flight", props:[
      {label:"Speed", kind:"readout", text:"2.50 m/s"},
      {label:"Cruise", kind:"readout", text:"2.50 m/s"},
      {label:"Boost", kind:"readout", text:"3.00×"},
      {label:"Sensitivity", kind:"readout", text:"0.00125 rad/px"},
    ]}];
}
const SWATCHES = ["#ef5350","#ffb454","#e5d33a","#69d06d","#4fd8e0","#4da3ff","#b48cff","#ff6b8a"];

function propNode(p){
  const row = el("div","prow");
  row.append(el("div","plabel",p.label));
  const zone = el("div","pzone"); row.append(zone);
  if (p.kind === "slider"){
    const wrap = el("div","spill");
    const num = el("div","numcell");
    const inp = Object.assign(document.createElement("input"), {value:p.value.toFixed(p.dec)});
    num.append(inp);
    const unit = el("div","unitcell", p.unit || "");
    const track = el("div","track" + (p.hi?" hi":""));
    const bed = el("div","bed"), fill = el("div","fill"), knob = el("div","knob");
    track.append(bed, fill, knob);
    const place = v => {
      const f = (v - p.min) / (p.max - p.min);
      fill.style.width = (f*100).toFixed(1) + "%";
      knob.style.left = `calc(12px + ${f.toFixed(4)} * (100% - 24px))`;
      inp.value = v.toFixed(p.dec);
    };
    const drag = e => {
      const b = track.getBoundingClientRect();
      const f = Math.min(1, Math.max(0, (e.clientX - b.left - 12) / Math.max(1, b.width - 24)));
      p.value = p.min + f * (p.max - p.min); place(p.value);
    };
    track.onpointerdown = e => { track.setPointerCapture(e.pointerId); drag(e);
                                 track.onpointermove = ev => ev.buttons && drag(ev); };
    track.onpointerup = () => track.onpointermove = null;
    requestAnimationFrame(() => place(p.value));
    wrap.append(num, unit, track); zone.append(wrap);
  } else if (p.kind === "switch"){
    const s = el("div","switch" + (p.on?" on":"")); s.append(el("i"));
    s.onclick = () => { p.on = !p.on; s.classList.toggle("on", p.on); };
    zone.append(s);
  } else if (p.kind === "axis"){
    const a = el("div","axis");
    ["X","Y","Z"].forEach((L,k) => {
      const cell = el("div","cell");
      const b = el("b",null,L); b.style.color = ["var(--axX)","var(--axY)","var(--axZ)"][k];
      cell.append(b, Object.assign(document.createElement("input"),
                                   {value:p.axes[k].toFixed(2), readOnly:true}));
      a.append(cell);
    });
    zone.append(a);
  } else if (p.kind === "colour"){
    const wrap = el("div","chipcolour");
    const sw = el("div","sw"); sw.style.background = p.tint;
    const hex = el("div","hex mono", rgbToHex(p.tint));
    wrap.append(sw, hex); zone.append(wrap);
  } else if (p.kind === "swatches"){
    const wrap = el("div","swatchrow");
    SWATCHES.forEach(c => { const d = el("i"); d.style.background = c;
      if (rgbToHex(p.tint).toLowerCase() === c) d.classList.add("on");
      wrap.append(d); });
    zone.append(wrap);
  } else if (p.kind === "select"){
    const d = el("div","dd"); d.append(el("span",null,p.options[0]), el("div","caret","⌄"));
    zone.append(d);
  } else {
    zone.append(el("div","readout mono", p.text));
  }
  return row;
}
function rgbToHex(c){
  const m = c.match(/\d+/g); if (!m) return c;
  return "#" + m.slice(0,3).map(n => (+n).toString(16).padStart(2,"0").toUpperCase()).join("");
}

function dedicatedPanel(r){
  switch (appearanceOf(r)){
    case "sun":           return panelSun();
    case "sky":           return panelSky();
    case "stars":         return panelStars();
    case "clouds":        return panelClouds(false);
    case "localcloud":    return panelClouds(true);
    case "heightfog":     return panelFog("height");
    case "aerialfog":     return panelFog("aerial");
    case "localfog":      return panelFog("local");
    case "wind":          return panelWind();
    case "precipitation": return panelPrecipitation();
    case "rainbow":       return panelRainbow();
    case "moon":          return panelMoon();
    case "camera":        return panelCamera(r);
    case "lensflare":     return panelLensFlare();
    case "tyre":          return panelTyre(r);
    default:              return null;
  }
}

function renderInspector(){
  const ident = $("#ident"), props = $("#props"), foot = $("#i-foot");
  ident.innerHTML = ""; props.innerHTML = ""; foot.innerHTML = "";
  const i = State.picked, r = ROSTER[i];
  if (!r){
    const n = el("div","nothing"); n.innerHTML = "Nothing selected<small>Pick an instance in the outliner.</small>";
    props.append(n);
    foot.append(el("div",null,"—"));
    return;
  }
  /* ident: 36 px tile with the tint dot, the editable name, the caps category, lock + eye */
  const sw = el("div","swatch");
  sw.style.background = r.tint.replace("rgb(","rgba(").replace(")",",.14)");
  sw.style.boxShadow = `inset 0 0 0 1px ${r.tint.replace("rgb(","rgba(").replace(")",",.43)")}`;
  const dot = el("i"); dot.style.background = r.tint; sw.append(dot);
  const who = el("div","who");
  const name = Object.assign(document.createElement("input"), {value:r.label, spellcheck:false});
  name.oninput = () => { r.label = name.value; renderTree(); renderScene(); };
  const kind = el("div","kind", kindLabel(r.kind));
  if (r.locked || !r.visible)
    kind.append(Object.assign(el("span"), {textContent:
      " · " + [r.locked?"locked":null, !r.visible?"hidden":null].filter(Boolean).join(" · ")}));
  who.append(name, kind);
  const lock = el("button","disc" + (r.locked?" on":""));
  lock.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V7.8a3.5 3.5 0 0 1 7 0v2.7"/></svg>';
  lock.onclick = () => { r.locked = !r.locked; render(); };
  const eye = el("button","disc" + (r.visible?" on":""));
  eye.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.8-6 10-6 10 6 10 6-3.8 6-10 6-10-6-10-6Z"/><circle cx="12" cy="12" r="2.6"/></svg>';
  eye.onclick = () => { r.visible = !r.visible; render(); };
  ident.append(sw, who, lock, eye);

  /* the dedicated per-type panel, when the row carries an appearance */
  const dedicated = dedicatedPanel(r);
  if (dedicated){
    const page = el("div", appearanceOf(r) === "tyre" ? "" : "env");
    page.append(dedicated);
    props.append(page);
    foot.append(el("div",null,
      `${kindLabel(r.kind)} · ${r.dynamic?"dynamic":"static"}${r.locked?" · locked":""}`));
    const fr = el("div","right");
    fr.append(el("span","caps","FPS"));
    fr.append(Object.assign(el("b","mono"), {textContent:"60", style:"color:var(--green)"}));
    fr.append(el("span",null,"·"));
    fr.append(el("span","caps","TRIS"));
    fr.append(Object.assign(el("b","mono"), {textContent:"5994"}));
    foot.append(fr);
    return;
  }

  /* the generic fallback sheet — folders and plain geometry */
  if (!r.sheet || r.sheetFor !== r.kind){ r.sheet = sheetFor(r, i); r.sheetFor = r.kind; }
  r.sheet.forEach((g, k) => props.append(card(g.title, g.props.map(propNode), r.kind + k)));

  /* INSTANCE — the four standing pills, TYPE and ID */
  const inst = el("section","card");
  inst.append(Object.assign(el("h4"), {textContent:"Instance"}));
  const pills = el("div","pills");
  [["VISIBLE","visible"],["LOCKED","locked"],["DYNAMIC","dynamic"],["PHYSICS","physics"]].forEach(([L,k]) => {
    const b = el("button","ptoggle" + (r[k]?" on":""), L);
    b.onclick = () => { r[k] = !r[k]; render(); };
    pills.append(b);
  });
  inst.append(pills);
  [["TYPE", kindLabel(r.kind)], ["ID", "#" + String(i).padStart(3,"0")]].forEach(([k,v]) => {
    const line = el("div","specline");
    line.append(el("div","k caps",k), el("div","v mono",v)); inst.append(line);
  });
  props.append(inst);

  /* NOTES */
  const notes = el("textarea","notes"); notes.value = r.notes;
  notes.oninput = () => r.notes = notes.value;
  props.append(card("Notes", [notes], "notes"));

  foot.append(el("div",null,
    `${kindLabel(r.kind)} · ${r.dynamic?"dynamic":"static"}${r.locked?" · locked":""}`));
  const right = el("div","right");
  right.append(el("span","caps","FPS"));
  right.append(Object.assign(el("b","mono"), {textContent:"60", style:"color:var(--green)"}));
  right.append(el("span",null,"·"));
  right.append(el("span","caps","TRIS"));
  right.append(Object.assign(el("b","mono"), {textContent:"5994"}));
  foot.append(right);
}

/* ═══ RENDER ══════════════════════════════════════════════════════════════ */
function render(){
  const total  = ROSTER.filter(r => r.kind !== "folder").length;
  const shown  = ROSTER.filter(r => r.kind !== "folder" && r.visible).length;
  const hidden = total - shown;
  $("#o-sub").textContent = `Showcase · ${total} nodes`;
  $("#t-visible").textContent = shown;
  $("#t-hidden").textContent = hidden;
  $("#tile-hidden").className = "tile " + (hidden ? "warn" : "idle");
  $("#outliner").classList.toggle("compact", State.compact);
  buildFilterMenu(); renderChips(); renderTree(); renderOutlinerFoot();
  renderScene(); renderViewportFoot(); renderInspector();
}

});
$("#markers").onclick = () => { State.markers = !State.markers;
                                $("#markers").classList.toggle("on", State.markers); renderScene(); };
$("#dock-l").onclick = () => { const on = $("#dock-l").classList.toggle("on");
                               $("#outliner").style.display = on ? "" : "none"; };
$("#dock-r").onclick = () => { const on = $("#dock-r").classList.toggle("on");
                               $("#inspector").style.display = on ? "" : "none"; };
$("#mode").onclick = e => {
  const b = e.target.closest("button[data-m]"); if (!b) return;
  State.mode = b.dataset.m; State.paused = false;
  [...$("#mode").children].forEach(x => x.classList.toggle("sel", x === b));
  const running = State.mode !== "edit";
  $("#transport").classList.toggle("show", running);
  setStatus();
};
$("#transport").onclick = e => {
  const b = e.target.closest("button[data-act]"); if (!b) return;
  if (b.dataset.act === "pause") State.paused = !State.paused;
  if (b.dataset.act === "stop"){ State.mode = "edit"; State.paused = false;
    [...$("#mode").children].forEach((x,k) => x.classList.toggle("sel", k === 0));
    $("#transport").classList.remove("show"); }
  setStatus();
};
function setStatus(){
  const running = State.mode !== "edit";
  const label = State.paused ? "Held" : (running ? "Running" : "Live");
  $("#statuslabel").textContent = label;
  $("#livedot").className = "live" + (State.paused ? " held" : (running ? "" : ""));
}
/* the add menu — ViewportPanel.cpp's four sections, plus the rig this pass adds */
const ADD = [
  ["Lights", [["Directional Light (Sun)","sun.svg"],["Point Light","editor-point-light.svg"],
              ["Spot Light","editor-spotlight.svg"],["Rect / Area Light","editor-area-light.svg"]]],
  ["World & Celestial", [["Atmosphere Medium","sky-scattering.svg"],["Sky Atmosphere","sky-scattering.svg"],
              ["Cloud Layer","clouds.svg"],["Local Volumetric Fog","local-fog.svg"],["Wind Field","wind.svg"],
              ["Rainbow","rainbow.svg"],["Lens Flare","lens-flare.svg"],["Moon / Satellite","moon.svg"]]],
  ["Cameras", [["Main Camera","camera.svg"],["Cine Camera (35mm)","camera.svg"],
              ["Post Process Volume","environment-exposure.svg"]]],
  ["Geometry Primitives", [["Plane / Ground","editor-mesh.svg"],["Cube / Box","editor-cube.svg"],
              ["Sphere","editor-sphere.svg"],["Cylinder","editor-cylinder.svg"],["Cone","editor-cone.svg"],
              ["Torus","editor-torus.svg"]]],
  ["Vehicle & Cloth", [["Vehicle Body","editor-vehicle.svg"],["Tyre","editor-tyre.svg"],
              ["Tread Pattern","editor-tread.svg"],["Wheel Rim","editor-wheel-rim.svg"],
              ["Suspension","editor-suspension.svg"],["Cloth Panel","editor-cloth.svg"]]],
  ["Foliage", [["Tree","editor-tree.svg"],["Plant","editor-plant.svg"],["Terrain","terrain.svg"]]],
];
(function buildAddMenu(){
  const m = $("#addmenu");
  ADD.forEach(([head, items]) => {
    m.append(el("h5",null,head));
    items.forEach(([label, icon]) => {
      const b = el("button");
      const img = new Image(); img.src = ICONS + icon; img.alt = "";
      b.append(img, el("span",null,label));
      b.onclick = () => { addEntity(label, icon); m.classList.remove("open"); };
      m.append(b);
    });
  });
})();
$("#addbtn").onclick = e => {
  e.stopPropagation();
  const m = $("#addmenu"), b = $("#addbtn").getBoundingClientRect();
  const host = $("#addbtn").closest(".col").getBoundingClientRect();
  m.style.left = (b.left - host.left) + "px"; m.style.top = (b.bottom - host.top + 7) + "px";
  m.classList.toggle("open");
};
$("#tabadd").onclick = () => $("#addbtn").click();
function addEntity(label, icon){
  const kind = icon.includes("light") || icon === "sun.svg" ? "light"
             : icon === "camera.svg" ? "camera" : "geometry";
  const tints = ["#49b0ff","#f28fae","#ffb454","#69d06d","#b48cff","#4fd8e0"];
  ROSTER.push({ id:ROSTER.length, label, kind, depth:0, tint:tints[ROSTER.length % tints.length],
                icon, filter: icon.startsWith("editor-tyre")||icon.startsWith("editor-vehicle") ? "vehicles"
                            : icon === "editor-cloth.svg" ? "cloth" : "geometry",
                meta:"new", tag:"", standing:"ok", note:"", pinned:false, visible:true, locked:false,
                dynamic:true, physics:false, shut:false, notes:"" });
  State.picked = ROSTER.length - 1;
  render();
}
/* keys: Tab compacts, Ctrl+Shift+F lands in the search, Shift+A opens Add */
addEventListener("keydown", e => {
  if (e.key === "Tab" && !e.target.matches("input,textarea")){ e.preventDefault(); $("#compact").click(); }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "f"){ e.preventDefault(); $("#query").focus(); }
  if (e.shiftKey && e.key.toLowerCase() === "a" && !e.target.matches("input,textarea")) $("#addbtn").click();
});
/* the convergence hairline, the renderer's own accumulation */
setInterval(() => {
  State.samples = Math.min(State.target, State.samples + 7);
  $("#samples").textContent = State.samples >= 1000
    ? `${Math.floor(State.samples/1000)} ${String(State.samples%1000).padStart(3,"0")}` : State.samples;
  const f = State.samples / State.target;
  $("#hair").querySelector("i").style.width = (f*100) + "%";
  $("#hair").classList.toggle("done", f >= 1);
}, 180);

render(); setStatus();
</script>
</body>
</html>
