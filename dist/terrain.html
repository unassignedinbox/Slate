<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project Zero · Terrain — WebGPU</title>
<style>:root{--bg:#0a0c0f;--panel:#12161b;--panel2:#171c22;--line:#232b34;--line2:#2d3742;--tx:#d8e0e8;--dim:#8b97a5;--dim2:#6b7683;--acc:#4fb0ff;--acc2:#2d7fc0;--ok:#56c08d;--warn:#e0a44a;--row:34px}*{box-sizing:border-box;margin:0;padding:0}html,body{background:var(--bg);height:100%;color:var(--tx);-webkit-font-smoothing:antialiased;font:12px/1.5 Inter,ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}button,input,select{font:inherit;color:inherit}#app{grid-template:"top top top"38px"rail view dock"1fr"status status status"24px/46px 1fr 330px;height:100%;display:grid}#top{border-bottom:1px solid var(--line);background:linear-gradient(#151a20,#10141a);grid-area:top;align-items:center;gap:10px;padding:0 10px;display:flex}.brand{letter-spacing:.14em;align-items:center;gap:8px;font-size:11px;font-weight:650;display:flex}.brand i{border:2px solid var(--acc);border-radius:2px;width:13px;height:13px;display:block;transform:rotate(45deg)}.brand span{color:var(--dim)}.sep{background:var(--line2);width:1px;height:20px}.tbtn{border:1px solid var(--line2);cursor:pointer;white-space:nowrap;background:#1b222a;border-radius:5px;align-items:center;gap:6px;height:25px;padding:0 11px;display:inline-flex}.tbtn:hover{border-color:var(--acc);color:#fff}.tbtn.primary{color:#fff;background:linear-gradient(#2f86cc,#2069a6);border-color:#3c9ae0;font-weight:600}.tbtn.primary:hover{filter:brightness(1.12)}.tbtn.on{border-color:var(--acc);color:var(--acc);background:#16222c}select,input[type=text],input[type=number]{border:1px solid var(--line2);background:#0f1419;border-radius:5px;height:25px;padding:0 7px}select:focus,input:focus{outline:1px solid var(--acc2)}.grow{flex:1}.meta{color:var(--dim);font-variant-numeric:tabular-nums;font-size:11px}.meta b{color:var(--tx);font-weight:600}#rail{background:var(--panel);border-right:1px solid var(--line);flex-direction:column;grid-area:rail;align-items:center;gap:4px;padding:7px 0;display:flex}.ric{cursor:pointer;width:32px;height:32px;color:var(--dim);background:0 0;border:1px solid #0000;border-radius:6px;place-items:center;display:grid;position:relative}.ric:hover{color:var(--tx);background:#1a212a}.ric.on{border-color:var(--acc2);color:var(--acc);background:#15222e}.ric svg{fill:none;stroke:currentColor;stroke-width:1.6px;stroke-linecap:round;stroke-linejoin:round;width:17px;height:17px}.ric[data-tip]:hover:after{content:attr(data-tip);border:1px solid var(--line2);white-space:nowrap;z-index:50;color:var(--tx);background:#070a0d;border-radius:4px;padding:3px 8px;position:absolute;top:50%;left:38px;transform:translateY(-50%)}.railgap{height:8px}#view{background:#05070a;grid-area:view;position:relative;overflow:hidden}#gpu{width:100%;height:100%;display:block}#overlay{text-align:center;z-index:30;background:#06090cdb;place-items:center;padding:40px;display:grid;position:absolute;inset:0}#overlay .box{max-width:560px}#overlay h2{letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;font-size:15px}#overlay p{color:var(--dim);font-size:12.5px}.vbadge{border:1px solid var(--line);color:var(--dim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);background:#0a0d11b8;border-radius:6px;padding:5px 9px;font-size:11px;position:absolute;top:10px;left:12px}.vbadge b{color:var(--tx)}#progress{background:0 0;height:2px;position:absolute;bottom:0;left:0;right:0}#progress i{background:linear-gradient(90deg,var(--acc2),var(--acc));width:0;height:100%;transition:width .12s linear;display:block}#dock{background:var(--panel);border-left:1px solid var(--line);flex-direction:column;grid-area:dock;min-height:0;display:flex}.dhead{border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.13em;height:30px;color:var(--dim);background:var(--panel2);align-items:center;gap:8px;padding:0 9px;font-size:10px;display:flex}.dhead .acts{gap:4px;margin-left:auto;display:flex}.iconbtn{border:1px solid var(--line2);width:21px;height:21px;color:var(--dim);cursor:pointer;background:#161c23;border-radius:4px;place-items:center;font-size:13px;line-height:1;display:grid}.iconbtn:hover{color:#fff;border-color:var(--acc)}.tabs{border-bottom:1px solid var(--line);background:var(--panel2);display:flex}.tab{height:30px;color:var(--dim);cursor:pointer;letter-spacing:.08em;text-transform:uppercase;background:0 0;border:0;border-bottom:2px solid #0000;flex:1;font-size:11px}.tab.on{color:var(--tx);border-bottom-color:var(--acc);background:#141a21}#stackWrap{flex-direction:column;flex:0 0 42%;min-height:0;display:flex}#stack{flex:1;overflow:auto}.layer{height:var(--row);cursor:pointer;-webkit-user-select:none;user-select:none;border-bottom:1px solid #1a2027;align-items:center;gap:7px;padding:0 8px;display:flex}.layer:hover{background:#161d25}.layer.sel{box-shadow:inset 2px 0 0 var(--acc);background:#15222e}.layer.drag{opacity:.4}.layer .eye{border:1px solid var(--line2);width:18px;height:18px;color:var(--dim);background:#121820;border-radius:4px;place-items:center;font-size:10px;display:grid}.layer.off .nm{color:var(--dim2);text-decoration:line-through}.layer .eye.on{color:var(--acc);border-color:var(--acc2)}.layer .sw{border:1px solid #0008;border-radius:3px;width:13px;height:13px}.layer .nm{text-overflow:ellipsis;white-space:nowrap;flex:1;overflow:hidden}.layer .kind{color:var(--dim2);text-transform:uppercase;letter-spacing:.06em;font-size:10px}.layer .hnd{color:var(--dim2);cursor:grab}#inspector{flex:1;min-height:0;overflow:auto}.group{border-bottom:1px solid var(--line)}.gh{cursor:pointer;background:var(--panel2);text-transform:uppercase;letter-spacing:.12em;height:28px;color:var(--dim);align-items:center;gap:7px;padding:0 9px;font-size:10px;display:flex}.gh:hover{color:var(--tx)}.gh .chev{font-size:9px;transition:transform .15s}.group.closed .chev{transform:rotate(-90deg)}.group.closed .gb{display:none}.gb{padding:7px 9px 10px}.fld{grid-template-columns:116px 1fr 54px;align-items:center;gap:7px;margin:5px 0;display:grid}.fld label{color:var(--dim);text-overflow:ellipsis;white-space:nowrap;font-size:11px;overflow:hidden}.fld input[type=range]{width:100%;height:16px;accent-color:var(--acc);background:0 0}.fld .val{border:1px solid var(--line2);text-align:right;font-variant-numeric:tabular-nums;background:#0f1419;border-radius:4px;height:21px;padding:0 5px;font-size:11px}.fld select{width:100%;height:22px}.fld input[type=color]{border:1px solid var(--line2);background:#0f1419;border-radius:4px;width:100%;height:21px;padding:0}.fld.wide{grid-template-columns:116px 1fr}.hint{color:var(--dim2);padding:4px 9px 9px;font-size:10.5px;line-height:1.5}#status{background:var(--panel2);border-top:1px solid var(--line);color:var(--dim);font-variant-numeric:tabular-nums;grid-area:status;align-items:center;gap:14px;padding:0 10px;font-size:11px;display:flex}#status b{color:var(--tx);font-weight:600}.dot{background:var(--ok);border-radius:50%;width:7px;height:7px}::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#273039;border-radius:5px}::-webkit-scrollbar-track{background:#0f1318}</style>
  <script type="module" crossorigin src="./assets/terrain-TbmmGyuC.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
</head>
<body>
<div id="app">

  <div id="top">
    <div class="brand"><i></i>PROJECT&nbsp;ZERO <span>/ TERRAIN</span></div>
    <div class="sep"></div>
    <select id="preset" title="Preset"></select>
    <button class="tbtn primary" id="build">Build</button>
    <button class="tbtn" id="erodeToggle">⏸ Erosion</button>
    <button class="tbtn" id="reset">Reset sim</button>
    <div class="sep"></div>
    <label class="meta">Seed</label>
    <input id="seed" type="number" style="width:82px" value="1337" />
    <button class="tbtn" id="dice" title="Randomise seed">🎲</button>
    <label class="meta">Res</label>
    <select id="res">
      <option value="512">512²</option>
      <option value="1024" selected>1024²</option>
      <option value="2048">2048²</option>
    </select>
    <div class="grow"></div>
    <div class="meta" id="gpuName">—</div>
    <div class="sep"></div>
    <button class="tbtn" id="exportR16" title="16-bit RAW heightmap (Unreal / Gaea / World Machine)">Export .r16</button>
    <button class="tbtn" id="exportPng">PNG</button>
    <button class="tbtn" id="shot">Screenshot</button>
    <a class="tbtn" href="./index.html" style="text-decoration:none">Fracture demo</a>
  </div>

  <div id="rail">
    <button class="ric on" data-mode="0" data-tip="Shaded (final)"><svg viewBox="0 0 24 24"><path d="M3 18l6-9 4 6 3-4 5 7z"/><circle cx="17" cy="6" r="2"/></svg></button>
    <button class="ric" data-mode="1" data-tip="Height field"><svg viewBox="0 0 24 24"><path d="M4 20V10M9 20V5M14 20v-8M19 20V7"/></svg></button>
    <button class="ric" data-mode="2" data-tip="Slope"><svg viewBox="0 0 24 24"><path d="M4 19L20 5M4 19h16"/></svg></button>
    <button class="ric" data-mode="3" data-tip="Flow / wetness"><svg viewBox="0 0 24 24"><path d="M5 7c3 3 5-3 8 0s3 6 6 3M5 14c3 3 5-3 8 0s3 6 6 3"/></svg></button>
    <button class="ric" data-mode="4" data-tip="Ambient occlusion"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 5v14"/></svg></button>
    <button class="ric" data-mode="5" data-tip="Scour (erosion)"><svg viewBox="0 0 24 24"><path d="M12 3v7M8 10l4 11 4-11z"/></svg></button>
    <button class="ric" data-mode="6" data-tip="Sediment"><svg viewBox="0 0 24 24"><path d="M3 16h18M6 12h12M9 8h6"/></svg></button>
    <div class="railgap"></div>
    <button class="ric on" id="tWater" data-tip="Water surface"><svg viewBox="0 0 24 24"><path d="M12 3s6 7 6 11a6 6 0 11-12 0c0-4 6-11 6-11z"/></svg></button>
    <button class="ric" id="tWire" data-tip="Wireframe"><svg viewBox="0 0 24 24"><path d="M4 7l8-4 8 4-8 4z"/><path d="M4 7v8l8 4 8-4V7"/><path d="M12 11v8"/></svg></button>
    <button class="ric" id="tSun" data-tip="Drag in viewport to move the sun"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
    <div class="railgap"></div>
    <button class="ric" id="tTop" data-tip="Top-down view"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 4v16"/></svg></button>
  </div>

  <div id="view">
    <canvas id="gpu"></canvas>
    <div class="vbadge" id="vbadge">—</div>
    <div id="progress"><i></i></div>
    <div id="overlay"><div class="box"><h2>Initialising WebGPU</h2><p>Requesting adapter…</p></div></div>
  </div>

  <div id="dock">
    <div class="tabs">
      <button class="tab on" data-stack="gen">Terrain stack</button>
      <button class="tab" data-stack="mat">Texture stack</button>
    </div>
    <div id="stackWrap">
      <div class="dhead"><span id="stackTitle">Layers</span>
        <div class="acts">
          <button class="iconbtn" id="addLayer" title="Add layer">+</button>
          <button class="iconbtn" id="dupLayer" title="Duplicate">⧉</button>
          <button class="iconbtn" id="delLayer" title="Delete">−</button>
          <button class="iconbtn" id="upLayer" title="Move up">↑</button>
          <button class="iconbtn" id="downLayer" title="Move down">↓</button>
        </div>
      </div>
      <div id="stack"></div>
    </div>
    <div class="dhead">Inspector</div>
    <div id="inspector"></div>
  </div>

  <div id="status">
    <span class="dot" id="dot"></span>
    <span id="st1">—</span><span id="st2"></span><span id="st3"></span>
    <span class="grow" style="flex:1"></span>
    <span id="st4"></span>
  </div>
</div>
</body>
</html>
