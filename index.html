<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060b" />
    <title>Motorball // Test Circuit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="loading" class="loading">
        <div class="loading-mark">MB</div>
        <p>BUILDING THE CIRCUIT</p>
      </div>

      <div id="circuit-fallback" class="circuit-fallback" aria-hidden="true">
        <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="presentation">
          <defs>
            <linearGradient id="fallbackSky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#080d1b"/><stop offset=".58" stop-color="#16122a"/><stop offset="1" stop-color="#07080d"/></linearGradient>
            <linearGradient id="fallbackRoad" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#3b4756"/><stop offset="1" stop-color="#141a22"/></linearGradient>
            <linearGradient id="fallbackCar" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#ff4d5a"/><stop offset="1" stop-color="#7a1022"/></linearGradient>
            <filter id="fallbackGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <rect width="1600" height="900" fill="url(#fallbackSky)"/>
          <circle cx="260" cy="160" r="92" fill="#a9dcfa" opacity=".08" filter="url(#fallbackGlow)"/>
          <g fill="#0a101a" stroke="#263747" stroke-width="3">
            <path d="M0 412h70v-154h48v154h58v-245h60v245h94v-125h55v125h74v488H0z"/>
            <path d="M1087 398h52V230h54v168h65V141h67v257h49V284h54v114h54v502h-395z"/>
          </g>
          <g opacity=".7" stroke="#45e4ff" stroke-width="4" filter="url(#fallbackGlow)">
            <path d="M0 464 C350 425 550 440 800 478 S1270 460 1600 415" fill="none"/>
            <path d="M0 501 C280 459 530 467 800 504 S1310 480 1600 444" fill="none" opacity=".45"/>
          </g>
          <path d="M670 358 C705 410 651 549 410 900 H1190 C952 548 894 410 930 358 Z" fill="url(#fallbackRoad)" stroke="#151d28" stroke-width="12"/>
          <path d="M670 358 C705 410 651 549 410 900" fill="none" stroke="#ff4051" stroke-width="12" filter="url(#fallbackGlow)"/>
          <path d="M930 358 C894 410 952 549 1190 900" fill="none" stroke="#48e7ff" stroke-width="12" filter="url(#fallbackGlow)"/>
          <g stroke="#cbdce1" stroke-width="6" opacity=".6">
            <path d="M795 398l10 0"/><path d="M780 454l40 0"/><path d="M755 530l90 0"/><path d="M715 640l170 0"/><path d="M655 792l290 0"/>
          </g>
          <g transform="translate(800 682)">
            <ellipse cy="123" rx="170" ry="24" fill="#000" opacity=".55"/>
            <path d="M-122 87 L-96 -77 L-48 -122 L57 -122 L102 -70 L125 87 L83 120 L-85 120 Z" fill="url(#fallbackCar)" stroke="#ff6b6f" stroke-width="5"/>
            <path d="M-70 -74 L-39 -109 L49 -109 L76 -74 L65 -13 L-60 -13 Z" fill="#071826" stroke="#6eeaff" stroke-width="4"/>
            <path d="M-121 47H-74L-66 73H-116M121 47H73L66 73H116" fill="#0a0c10" stroke="#99afb9" stroke-width="5"/>
            <path d="M-78 95H-34M34 95H79" stroke="#e9fbff" stroke-width="10" filter="url(#fallbackGlow)"/>
            <path d="M-110 10 L-44 25 L44 25 L110 10" fill="none" stroke="#24070f" stroke-width="12"/>
          </g>
          <text x="800" y="220" text-anchor="middle" fill="#dcebf2" font-family="Arial, sans-serif" font-size="24" letter-spacing="10">RUST BELT MOTORBALL CIRCUIT</text>
          <text x="800" y="252" text-anchor="middle" fill="#ff4b59" font-family="monospace" font-size="14" letter-spacing="4">3D RENDERER STANDBY</text>
        </svg>
      </div>
      <canvas id="race-canvas"></canvas>

      <div class="vignette"></div>
      <div class="scanlines"></div>

      <section class="brand-panel hud-panel">
        <div class="eyebrow"><span></span> SCRAPYARD LEAGUE / 09</div>
        <h1>MOTOR<span>BALL</span></h1>
        <p>TEST CIRCUIT <b>—</b> NIGHT SHIFT</p>
      </section>

      <section class="telemetry hud-panel">
        <div class="gear" id="gear">N</div>
        <div class="speed-readout"><strong id="speed">000</strong><span>KM/H</span></div>
        <div class="boost-meter"><div class="meter-label"><span>NITRO</span><span id="nitro-label">100%</span></div><div class="meter-track"><i id="nitro-fill"></i></div></div>
      </section>

      <section class="race-card hud-panel">
        <div class="race-line"><span>TRACK</span><b>RUST BELT // A-13</b></div>
        <div class="race-line"><span>LAP</span><b id="lap">01 <em>/ 03</em></b></div>
        <div class="race-line"><span>TIME</span><b id="time">00:00.000</b></div>
        <div class="race-line"><span>BEST</span><b id="best">--:--.---</b></div>
      </section>

      <section class="controls hud-panel">
        <div class="controls-title">DRIVER INPUT</div>
        <div class="key-grid">
          <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><span>DRIVE</span></div>
          <div><kbd>SHIFT</kbd><span>NITRO</span></div>
          <div><kbd>C</kbd><span>CAMERA</span></div>
          <div><kbd>R</kbd><span>RESET</span></div>
        </div>
      </section>

      <div class="center-message" id="center-message">
        <div class="message-kicker">FREERIDE SESSION</div>
        <div class="message-main">LINE UP</div>
        <div class="message-sub">THROTTLE UP TO ENTER THE CIRCUIT</div>
      </div>

      <div class="track-warning" id="track-warning">RETURN TO CIRCUIT</div>
      <div class="crosshair"></div>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
