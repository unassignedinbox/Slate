<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Level 01 - Section 1: Fractured Town (greybox)</title>
  <style>
    :root { --ink: #eceae4; --dim: rgba(236, 234, 228, 0.62); --bg: rgba(22, 25, 28, 0.62); --accent: #e8774f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd6da; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--ink); }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #cfd6da; color: #2b3035; z-index: 50; }
    #loading .t { font-weight: 700; letter-spacing: 0.18em; font-size: 15px; }
    #loading .st { margin-top: 8px; font-size: 12px; opacity: 0.7; text-align: center; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35); }
    #hud .tl { position: absolute; left: 22px; top: 18px; }
    #hud .lvl { font-size: 11px; letter-spacing: 0.22em; color: var(--dim); }
    #hud .lvl span { opacity: 0.5; margin: 0 2px; }
    #hud .lvl b { color: var(--ink); font-weight: 600; }
    #hud .secname { font-size: 22px; font-weight: 700; letter-spacing: 0.08em; margin-top: 2px; }
    #hud .beat { margin-top: 6px; font-size: 13px; letter-spacing: 0.14em; color: var(--ink); background: var(--bg); padding: 4px 9px; display: inline-block; border-left: 3px solid var(--accent); }
    #hud .tr { position: absolute; right: 22px; top: 16px; text-align: right; }
    #hud .time { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    #hud .sub { font-size: 11px; letter-spacing: 0.16em; color: var(--dim); font-variant-numeric: tabular-nums; }
    #hud .split { margin-top: 6px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; opacity: 0; transition: opacity 0.2s; }
    #hud .split.good { color: #a8e0b0; } #hud .split.bad { color: #f0a080; }
    #hud .speedo { position: absolute; right: 26px; bottom: 74px; text-align: right; }
    #hud .speedo .v { font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
    #hud .speedo .u { font-size: 11px; letter-spacing: 0.24em; color: var(--dim); }
    #hud .progress { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(56vw, 700px); height: 6px; background: rgba(20, 23, 26, 0.45); border-radius: 3px; }
    #hud .progress .fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(236, 234, 228, 0.85); border-radius: 3px; }
    #hud .progress .car { position: absolute; top: -5px; width: 4px; height: 16px; margin-left: -2px; background: var(--accent); border-radius: 2px; }
    #hud .progress .tick { position: absolute; top: -3px; width: 1px; height: 12px; background: rgba(236, 234, 228, 0.6); }
    #hud .progress .tick span { position: absolute; top: -16px; left: -8px; font-size: 9px; letter-spacing: 0.05em; color: var(--dim); }
    #hMap { position: absolute; right: 18px; top: 112px; width: 176px; height: 176px; background: rgba(22, 25, 28, 0.38); border-radius: 6px; }
    #hud .center { position: absolute; left: 0; right: 0; top: 30%; text-align: center; }
    #hud .big { font-size: 72px; font-weight: 800; letter-spacing: 0.06em; opacity: 0; transition: opacity 0.15s; font-variant-numeric: tabular-nums; }
    #hud .msg { margin-top: 6px; font-size: 15px; letter-spacing: 0.14em; opacity: 0; transition: opacity 0.2s; }
    #hud .help { position: absolute; left: 22px; bottom: 58px; font-size: 11px; line-height: 1.65; color: var(--dim); max-width: 44vw; background: rgba(22, 25, 28, 0.32); padding: 7px 10px; border-radius: 4px; }
    #hud .help b { color: var(--ink); font-weight: 600; letter-spacing: 0.12em; margin-right: 4px; }
    .hidden { display: none !important; }
    .labels { position: fixed; inset: 0; pointer-events: none; z-index: 4; overflow: hidden; }
    .label { position: absolute; left: 0; top: 0; white-space: nowrap; font-size: 11px; letter-spacing: 0.14em; padding: 3px 7px; background: rgba(22, 25, 28, 0.66); color: var(--ink); border-left: 2px solid rgba(255, 244, 200, 0.9); will-change: transform; }
    .label-beat { font-size: 12px; font-weight: 700; border-left-color: var(--accent); }
    .label-note { color: #f4eedc; background: rgba(60, 50, 30, 0.62); }
    .label-portal { font-size: 13px; font-weight: 700; background: rgba(30, 36, 42, 0.78); border-left-color: #cfe0ea; }
    .label-tick { font-size: 9px; padding: 1px 4px; background: rgba(22, 25, 28, 0.45); border-left: none; }
    #designer { position: fixed; right: 14px; top: 300px; width: 330px; max-height: calc(100vh - 320px); overflow: auto; z-index: 6; background: rgba(24, 27, 31, 0.86); border-radius: 6px; padding: 12px 12px 10px; font-size: 12px; color: var(--ink); }
    #designer .dh { font-weight: 800; letter-spacing: 0.2em; font-size: 12px; margin-bottom: 8px; }
    #designer .dh span { font-weight: 500; letter-spacing: 0.1em; color: var(--dim); margin-left: 6px; }
    #designer .dsec { color: var(--dim); line-height: 1.5; margin-bottom: 8px; }
    #designer .dsec b { color: var(--ink); }
    #designer .dbeats { display: grid; gap: 3px; margin-bottom: 10px; }
    #designer .dbeats button { text-align: left; display: flex; gap: 8px; align-items: baseline; }
    #designer .dbeats button i { margin-left: auto; font-style: normal; color: var(--dim); }
    #designer button { background: rgba(255, 255, 255, 0.07); color: var(--ink); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 3px; padding: 5px 8px; font: inherit; cursor: pointer; }
    #designer button:hover { background: rgba(255, 255, 255, 0.14); }
    #designer button.on { background: var(--accent); color: #1a1d20; }
    #designer .dopts { display: grid; gap: 5px; margin-bottom: 10px; }
    #designer .dopts label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
    #designer .range input { flex: 1; }
    #designer .dbtns { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    #designer pre { margin: 0; font-size: 10.5px; line-height: 1.5; color: var(--dim); white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="loading"><div><div class="t">LEVEL 01 &nbsp;/&nbsp; SECTION 1 &nbsp;-&nbsp; FRACTURED TOWN</div><div class="st">Loading...</div></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
