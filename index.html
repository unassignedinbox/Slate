<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eagle — 3D Model &amp; Animation</title>
  <link rel="stylesheet" href="./src/style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>

    <header id="topbar">
      <div class="brand">
        <span class="mark">🦅</span>
        <div class="brand-text">
          <h1>Bald Eagle</h1>
          <p>Realistic 3D model &amp; procedural animation</p>
        </div>
      </div>
      <div id="status" class="status">Loading…</div>
    </header>

    <aside id="panel">
      <div class="group">
        <h2>Animations</h2>
        <div id="animButtons" class="btn-grid"></div>
      </div>

      <div class="group">
        <h2>Playback</h2>
        <label class="slider">
          <span>Speed <b id="speedVal">1.00×</b></span>
          <input id="speed" type="range" min="0.1" max="2.5" step="0.05" value="1" />
        </label>
        <div class="toggles">
          <label class="chk"><input id="autoRotate" type="checkbox" /> Orbit camera</label>
          <label class="chk"><input id="showGround" type="checkbox" checked /> Ground</label>
          <label class="chk"><input id="wireframe" type="checkbox" /> Wireframe</label>
        </div>
      </div>

      <div class="group hint">
        <h2>View</h2>
        <p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
      </div>
    </aside>

    <footer id="footer">
      <span id="animName">—</span>
      <span id="animDesc"></span>
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
