# SolidArc material manifest for BoxCar.obj
# Edit freely: 'frontier' is the engine material each usemtl group binds to; paints use System B AutomotiveFlakePaint.
mesh = "BoxCar.obj"

[materials.plastic-blue]
frontier   = "AutomotiveFlakePaint"
baseColor  = [0.16, 0.36, 0.85]
metallic   = 0
roughness  = 0.25
emissive   = 0
opacity    = 1
flakes     = true

[materials.rubber]
frontier   = "Rubber_Tyre"
baseColor  = [0.045, 0.045, 0.05]
metallic   = 0
roughness  = 0.95
emissive   = 0
opacity    = 1
flakes     = false

